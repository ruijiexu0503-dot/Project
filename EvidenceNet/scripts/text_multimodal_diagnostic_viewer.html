<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text—多模态 · 正例与难反例</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#22334b;font:14px/1.6 system-ui,sans-serif}header{padding:17px 22px;background:#19304d;color:white}h1{font-size:21px;margin:0}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 5px}.muted{color:#6b7c91;font-size:12px}.toolbar{padding:10px 20px;background:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dce4ef}button,select,input{font:inherit}select,button{padding:6px 9px;border:1px solid #c9d5e4;border-radius:5px;background:white;color:#22334b;cursor:pointer}.layout{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 145px)}aside{background:white;overflow:auto;border-right:1px solid #dce4ef}main{overflow:auto;padding:16px}.case{display:block;width:100%;border:0;border-radius:0;border-bottom:1px solid #e3e9f1;padding:10px 12px;text-align:left}.case.active{background:#e5eefb;border-left:4px solid #3b76b6}.tag{display:inline-block;padding:1px 6px;border-radius:4px;background:#eaf0f7;color:#43617f;font-size:11px;margin:2px}.yes{background:#dcf0e7;color:#146a50}.no{background:#fae4e4;color:#a23d3d}.maybe{background:#fff0d2;color:#8c601d}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #dce4ef;border-radius:8px;padding:15px;margin-bottom:14px}.text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.id{font:11px/1.5 ui-monospace,monospace;word-break:break-all;color:#697c95}.asset{width:100%;height:auto;display:block;border:1px solid #e3e8ef;border-radius:4px}.context{border-left:3px solid #c79542;background:#fff7e8;padding:10px;margin:8px 0}.anchor{border-left:3px solid #488f77;background:#eff8f4;padding:10px;margin:8px 0}details{margin-top:10px}summary{cursor:pointer;color:#476789;font-size:12px}pre{font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;padding:9px}.hint{padding:10px 14px;background:#fff8e7;color:#806128;border-bottom:1px solid #eadfc5;font-size:12px}.member{padding:10px 0;border-top:1px solid #e6eaf0}.ref{background:#f0f4fa;padding:9px;border-radius:5px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}@media(max-width:950px){.layout{grid-template-columns:210px 1fr}.columns{display:block}}@media(max-width:650px){.layout{display:block;height:auto}aside{max-height:260px;border-bottom:1px solid #dce4ef}main{overflow:visible;padding:10px}}
</style></head><body><header><h1>Text—多模态 · 完整节点与难反例</h1><div id="totals" style="color:#c8d7e8;font-size:12px"></div></header><div class="toolbar"><select id="filter"><option value="all">全部样本</option><option value="error">与参考不一致</option><option value="prose">理由／范围需修</option><option value="positive">参考正例</option><option value="negative">参考反例</option><option value="uncertain">边界待定／模型不确定</option></select><select id="domain"><option value="all">全部材料</option><option value="stadium">体育场</option><option value="remote">遥感／交通</option><option value="dlr">DLR</option></select><label><input id="showGold" type="checkbox" checked> 显示开发参考标注</label><button id="previous">上一对</button><button id="next">下一对</button></div><div class="hint">评测的是是否存在有用的具体关联；同一对象的不同细节可连边。原图不自动证明整个段落。参考为助手开发标注，边界案例另列，不等同独立金标准。</div><div class="layout"><aside id="cases"></aside><main id="detail"></main></div>
<script>
const D=/*__DATA__*/null,$=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=null,visible=[];
const statusText=s=>({LINK:'有链接',NO_LINK:'不连边',UNCERTAIN:'边界待定'}[s]||s),cls=s=>s==='LINK'?'yes':s==='NO_LINK'?'no':'maybe';
function label(c){return D.scope[c.case_id]?.reviewed_label||c.label;}
function result(c){const p=D.predictions[c.case_id];return p?.valid?p.result.status:p?'INVALID':'PENDING';}
function isError(c){return ['LINK','NO_LINK'].includes(label(c))&&['LINK','NO_LINK'].includes(result(c))&&label(c)!==result(c);}
function domain(c){return c.group.includes('stadium')?'stadium':c.group.includes('dlr')||c.group.includes('ridge')||c.group.includes('ahead')?'dlr':'remote';}
function nodeHTML(n){const eligible=new Set(n.eligible_members.filter(m=>m.eligible).map(m=>m.kind+'|'+m.member_id));let html=`<div class="card"><div class="row"><h2>${n.unit_type==='TEXT'?'文字节点':'多模态节点'}</h2><span class="tag">${esc(n.unit_type)}</span></div><div class="id">${esc(n.id)}</div><div class="muted">${esc(n.document)} · ${esc(n.page)}</div>`;
for(const m of n.members){if(!eligible.has(m.kind+'|'+m.id))continue;html+=`<section class="member"><b>${esc(m.id)}</b><span class="tag">${esc(m.kind)} / ${esc(m.type||'')}</span>`;const digest=D.node_assets[n.id]?.[m.id];if(digest)html+=`<img class="asset" src="${D.assets[digest]}" alt="${esc(m.id)} 原始图像"><div class="muted">原始来源 crop（未改写）</div>`;if(m.text)html+=`<h3>${m.kind==='visual'?'Qwen 生成描述（以原图为准）':'原始成员内容'}</h3><div class="text">${esc(m.text)}</div>`;html+='</section>';}
for(const context of n.context||[])html+=`<div class="context"><b>单独的身份上下文</b><div class="id">${esc(context.source_id)}</div><div class="text">${esc(context.text)}</div><div class="muted">只用于指代／身份解析，不属于当前 node 的正文证据。</div></div>`;return html+'</div>';}
function renderList(){visible=D.cases.filter(c=>{const f=$('#filter').value,d=$('#domain').value;if(d!=='all'&&domain(c)!==d)return false;return f==='all'||f==='prose'&&D.reviews[c.case_id]?.prose_flag||f==='error'&&isError(c)||f==='positive'&&label(c)==='LINK'||f==='negative'&&label(c)==='NO_LINK'||f==='uncertain'&&(label(c)==='UNCERTAIN'||['UNCERTAIN','INVALID','PENDING'].includes(result(c)));});$('#cases').innerHTML=visible.map((c,i)=>`<button class="case ${current===c.case_id?'active':''}" data-case="${c.case_id}"><b>${i+1}. ${esc(c.group)}</b><br><span class="tag ${cls(result(c))}">模型 ${statusText(result(c))}</span>${$('#showGold').checked?`<span class="tag ${cls(label(c))}">参考 ${statusText(label(c))}</span>`:''}${isError(c)?'<span class="tag maybe">需复核</span>':''}${D.reviews[c.case_id]?.prose_flag?'<span class="tag maybe">理由需修</span>':''}<div class="id">${esc(c.case_id.slice(-12))}</div></button>`).join('');document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>select(b.dataset.case));if(!visible.some(c=>c.case_id===current))current=visible[0]?.case_id||null;}
function select(id){current=id;renderList();const c=D.cases.find(c=>c.case_id===current);if(!c){$('#detail').innerHTML='<div class="card">没有符合条件的样本。</div>';return;}const pred=D.predictions[c.case_id],r=pred?.result;let html=`<div class="card"><div class="row"><h2>${esc(c.group)}</h2><span class="tag ${cls(result(c))}">模型 ${statusText(result(c))}</span></div><div class="id">${esc(c.case_id)}</div>`;
if($('#showGold').checked)html+=`<div class="ref"><b>开发参考：${statusText(label(c))}</b><div class="text">${esc(D.scope[c.case_id]?.reason||c.reference_reason)}</div>${D.scope[c.case_id]?'<div class="muted">原始冻结标签 '+esc(c.label)+' 单独保留；此对在专门的范围复核中列为待定。</div>':''}</div>`;
if(r){html+=`<h3>模型依据：${esc(r.basis||'无关联类型')}</h3><div class="text">${esc(r.reason)}</div><h3>关系不代表什么</h3><div class="text">${esc(r.limitation)}</div><details><summary>查看实际选择的来源证据和身份上下文</summary><pre>${esc(JSON.stringify({anchors:r.anchors,identity_context:r.identity_context},null,2))}</pre></details>`;}else html+='<p class="muted">'+(pred?'模型输出未通过来源 ID 校验。':'尚无模型输出；当前是准备好的参考案例。')+'</p>';
if(D.reviews[c.case_id])html+=`<div class="anchor"><b>来源复核</b><div class="text">${esc(D.reviews[c.case_id].reason)}</div></div>`;if(pred)html+=`<details><summary>原始响应和校验记录</summary><pre>${esc(JSON.stringify(pred.attempts,null,2))}</pre></details>`;html+='</div><div class="columns">'+nodeHTML(D.nodes[c.text_node_id])+nodeHTML(D.nodes[c.multimodal_node_id])+'</div>';$('#detail').innerHTML=html;}
$('#totals').textContent=`${D.cases.length} 对完整 evidence nodes · ${Object.keys(D.predictions).length} 对已有输出 · ${Object.keys(D.assets).length} 份原始图表 · GPU 80263 · 可离线打开`;
for(const id of ['filter','domain','showGold'])$('#'+id).onchange=()=>{renderList();select(current);};for(const[id,delta]of[['previous',-1],['next',1]])$('#'+id).onclick=()=>{const i=visible.findIndex(c=>c.case_id===current);if(visible.length)select(visible[(i+delta+visible.length)%visible.length].case_id);};renderList();select(current);
</script></body></html>
