<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>剩余 6 个旧正例核查</title>
<style>
:root{--ink:#172033;--muted:#62708a;--line:#d9e0eb;--paper:#f5f7fb;--nav:#176b87;--no:#a23b3b;--old:#8a6a18}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Noto Sans SC",sans-serif}
header{background:#172033;color:white;padding:34px max(24px,calc((100vw - 1440px)/2));box-shadow:0 6px 24px #17203330}
h1{margin:0 0 8px;font-size:34px;letter-spacing:-.5px}.sub{max-width:900px;color:#cbd5e6}.summary{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}.metric{background:#ffffff12;border:1px solid #ffffff25;border-radius:12px;padding:10px 16px}.metric b{font-size:23px;margin-right:6px}
main{max-width:1440px;margin:0 auto;padding:24px}.toolbar{position:sticky;top:0;z-index:20;background:#f5f7fbeF;padding:14px 0;backdrop-filter:blur(8px);display:flex;gap:8px}.filter{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 15px;cursor:pointer}.filter.active{background:var(--ink);color:white;border-color:var(--ink)}
.case{background:white;border:1px solid var(--line);border-radius:18px;margin:12px 0 24px;overflow:hidden;box-shadow:0 8px 28px #24324b0c}.case-head{padding:20px 24px;display:flex;gap:18px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line)}
.title{display:flex;gap:10px;align-items:center}.id{font-weight:800;font-size:24px}.badge{font-weight:700;padding:5px 10px;border-radius:999px}.badge.nav{background:#e6f5f7;color:var(--nav)}.badge.no{background:#faeaea;color:var(--no)}.legacy{font-size:12px;color:var(--old);border:1px solid #d9c681;padding:3px 8px;border-radius:999px}.relation{font-family:ui-monospace,monospace;color:var(--muted)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 24px;background:#fafbfe}.step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:75px}.step small{display:block;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}.step strong{display:block;margin-top:5px}.step.final-nav{border-color:#75bbc8;background:#f2fbfc}.step.final-no{border-color:#d99999;background:#fff7f7}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px 24px}.endpoint{border:1px solid var(--line);border-radius:14px;overflow:hidden}.endpoint-head{padding:12px 14px;background:#f7f9fc;border-bottom:1px solid var(--line)}.node-id{font:600 12px/1.4 ui-monospace,monospace;word-break:break-all}.doc{font-size:12px;color:var(--muted);margin-top:4px}
.pagebox{position:relative;background:#dfe5ee;max-height:510px;overflow:auto;text-align:center;padding:10px}.canvas{position:relative;display:inline-block;line-height:0;max-width:100%}.canvas img{max-width:100%;height:auto}.box{position:absolute;border:3px solid #ef3d54;background:#ef3d5420;box-shadow:0 0 0 2px white;pointer-events:none}.box:before{content:attr(data-side);position:absolute;left:-3px;top:-29px;background:#ef3d54;color:white;font:800 13px/1 system-ui;padding:6px 8px;border-radius:6px 6px 0 0}
.text{padding:14px}.quote{font-weight:650;white-space:pre-wrap}.full{white-space:pre-wrap;color:#3d4960;max-height:180px;overflow:auto;border-top:1px dashed var(--line);margin-top:12px;padding-top:12px}details summary{cursor:pointer;color:#315e91;margin-top:10px}.members{font-size:12px;color:var(--muted)}
.review{margin:0 24px 24px;border-radius:14px;padding:17px 19px;background:#f7f9fc;border:1px solid var(--line)}.review h3{margin:0 0 7px}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}.review p{margin:4px 0 12px}.takeaway{font-weight:700}.rank{font-size:12px;color:var(--muted)}
@media(max-width:850px){.pair,.review-grid,.flow{grid-template-columns:1fr}.case-head{display:block}.relation{margin-top:8px}.pagebox{max-height:420px}}
</style></head><body>
<header><h1>剩余 6 个旧正例核查</h1><div class="sub">每一对都回到原始页面和完整 evidence node 检查。红框是节点在原页的位置；“旧正例”表示早期宽口径标注，不等于当前严格证据边。</div><div class="summary" id="summary"></div></header>
<main><div class="toolbar"><button class="filter active" data-filter="all">全部 6</button><button class="filter" data-filter="导航">导航关系 3</button><button class="filter" data-filter="不连">不应连边 3</button></div><div id="cases"></div></main>
<script>const DATA=/*__DATA__*/null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decision={NAVIGATION_LINK:'导航边',NO_LINK:'不连边',EVIDENCE_LINK:'证据边'};
function endpoint(e){let o=e.overlay,m=e.members.map(x=>`${esc(x.id)} · ${esc(x.kind||x.type)} · ${esc(x.role||'')} · ${esc((x.text||'').replace(/\s+/g,' ').slice(0,180))}`).join('<br>');return `<section class="endpoint"><div class="endpoint-head"><div class="node-id">${esc(e.side)} · ${esc(e.node_id)}</div><div class="doc">${esc(e.document)} · PDF 第 ${e.page} 页 · ${esc(e.unit_type)}</div></div><div class="pagebox"><div class="canvas"><img src="${DATA.assets[e.asset]}" alt="${esc(e.document)} page ${e.page}"><span class="box" data-side="${e.side}" style="left:${o.left}%;top:${o.top}%;width:${o.width}%;height:${o.height}%"></span></div></div><div class="text"><div class="label">人工锚点 · 已合并版面换行</div><div class="quote">${esc(e.display_quote)}</div><details><summary>查看完整 node 与成员</summary><div class="full">${esc(e.display_text)}</div><div class="members">${m}</div></details><details><summary>查看原始抽取文本（保留回车）</summary><div class="full">${esc(e.text)}</div></details></div></section>`}
function ranks(r){if(!r.article&&!r.global)return esc(r.stage);let a=r.article?`文章通道 rank ${r.article.rank} / 配额 ${r.article.limit}`:'文章通道未命中';let g=r.global?`全局通道 rank ${r.global.rank} / 配额 ${r.global.limit}`:'全局通道未命中';return `${esc(r.stage)}<div class="rank">${a}<br>${g}</div>`}
function card(r){let cls=r.category==='导航'?'nav':'no',v=r.verifier;return `<article class="case" data-category="${r.category}"><div class="case-head"><div><div class="title"><span class="id">${r.id}</span><span class="badge ${cls}">${r.category}</span><span class="legacy">旧标签 ${esc(r.legacy_label)}</span></div><div class="relation">${esc(r.requested_relation)}</div></div><div>${esc(r.legacy_rationale)}</div></div><div class="flow"><div class="step"><small>1 旧标注</small><strong>请求建立 ${esc(r.requested_relation)}</strong></div><div class="step"><small>2 当前召回</small><strong>${ranks(r.retrieval)}</strong></div><div class="step"><small>3 严格核验</small><strong>${decision[v.decision]||esc(v.decision)} · ${esc(v.basis)}</strong></div><div class="step final-${cls}"><small>4 推荐落点</small><strong>${r.category==='导航'?'文章/方法导航图':'不写入图'}</strong></div></div><div class="pair">${r.endpoints.map(endpoint).join('')}</div><div class="review"><h3>为什么这样判</h3><div class="review-grid"><div><div class="label">具体共同点</div><p>${esc(v.matched_claim||'无足够具体共同点')}</p><div class="label">当前建议</div><p class="takeaway">${esc(r.takeaway)}</p></div><div><div class="label">核验理由</div><p>${esc(v.reason)}</p>${v.limitation?`<div class="label">限制</div><p>${esc(v.limitation)}</p>`:''}</div></div></div></article>`}
document.querySelector('#summary').innerHTML=`<div class="metric"><b>6</b> 对旧正例</div><div class="metric"><b>${DATA.counts['导航']}</b> 对降为导航</div><div class="metric"><b>${DATA.counts['不连']}</b> 对应拒绝</div><div class="metric"><b>0</b> 对严格证据边</div>`;
const root=document.querySelector('#cases');root.innerHTML=DATA.records.map(card).join('');document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.case').forEach(c=>c.hidden=b.dataset.filter!=='all'&&c.dataset.category!==b.dataset.filter)})
</script></body></html>
