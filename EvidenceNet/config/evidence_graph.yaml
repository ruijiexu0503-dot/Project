input:
  aligned_root: ../parsing/output/hybrid_deepseek_layout_split_render/aligned_json
output:
  graph_root: output/evidence_graph
evidence:
  one_aligned_block_per_node: true
  split_on_single_newline: false
  merge_continuations: false
  keep_incomplete_nodes: true
structure:
  create_previous_edges: true
  detect_continuations: true
magazine_role_routing:
  enabled: true
  document_prefixes:
    - CERNCourier
micro_fragment_consolidation:
  enabled: true
  apply: false
  document_prefixes:
    - CERNCourier
  max_chars: 120
  min_target_chars: 40
  neighbour_window: 2
  min_axis_overlap: 0.30
  max_vertical_gap_px: 120
  max_horizontal_gap_px: 100
canonicalization:
  enabled: true
  output_root: output/canonical_graph
  # Keep old, unreviewed VLM semantic predictions out of the production graph.
  include_legacy_semantic: false
  # Only explicitly configured, non-legacy model outputs enter the semantic layer.
  semantic_sources:
    gw150914_detection: output/scientific_body_semantics/Qwen3.5-35B-A3B/gw150914_detection/accepted_edges.jsonl
validation:
  deepseek_order_conflict_threshold: 3
enrichment:
  enabled: true
  provider: transformers
  model: ../external/models/Qwen2.5-VL-7B-Instruct
  dtype: bfloat16
  device_map: auto
  require_cuda: true
  max_new_tokens: 2048
  batch_size: 2
  generation_tokens: 1000
  retry_generation_tokens: 1400
  prompt_version: v1
embedding:
  enabled: false
  model: null
  input_mode: original_plus_summary
candidates:
  structural_window: 3
  embedding_top_k: 8
  shared_entity_top_k: 5
  same_section_top_k: 5
  maximum_candidates_per_node: 15
  cross_unit_embedding_threshold: 0.45
  maximum_cross_unit_candidates_per_node: 2
full_semantic:
  maximum_candidates_per_node: 6
  maximum_cross_unit_candidates_per_node: 2
relations:
  acceptance_threshold: 0.80
  allow_unsupported_relation_review: true
  batch_size: 2
  generation_tokens: 1000
  retry_generation_tokens: 1400
adjudication:
  acceptance_threshold: 0.80
  batch_size: 2
  generation_tokens: 1200
  retry_generation_tokens: 1600
pilot:
  maximum_nodes: 25
  section_count: 2
  include_unsectioned: true
  maximum_candidates: null
article_segmentation:
  enabled: true
  document_prefixes:
    - CERNCourier
  batch_size: 10
  generation_tokens: 1400
