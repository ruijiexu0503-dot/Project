g lower-metallicity gases are consistent with observations. If heavy clouds absorb these gases is significantly longer than the age of the Fermi bubbles, instead, it appears that while the bubbles radiod lag along gas clouds from the galactic lane, they also swept up existing halo gas clouds as they expanded outwards.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/EvidenceNet/output/relation_first_corpus_shadow_v1/staged_sources/CERNCourier2022NovDec-digitaledition/page_0006.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_1/hybrid/shard_1/CERNCourier2022NovDec-digitaledition/page_0006/evidence_nodes.jsonl", "source_atom_ids": ["A_040"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::CERNCourier2022NovDec-digitaledition::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "CERNCourier2022NovDec-digitaledition", "document_title": "CERNCourier2022NovDec-digitaledition", "question": "What causal, technical, or comparative relationship does the selected passage establish in CERNCourier2022NovDec-digitaledition, and what stated condition or consequence qualifies it?", "gold_answer_draft": "with the SM prediction of $(3.7\\pm1)\\times10^{-7}$ , and reduces a previous tension between theory and experiment, which was based on the combination of the previous CMS result with the ATLAS and LHCb values. The variation in the central value of the $y(\\text{GeV})$ ratio, i.e., $|\\text{GeV}|\\leq y\\leq 1$ , from the use of a larger data sample and by the change of the B-hadron fragmentation fraction ratio (by about 8 % ), the meas- ured effective lifetime of the $B^{*}\\to\\mu\\nu$ decay, $1.8\\pm0.2\\%,$ is also consistent with the SM prediction. The precision of this measurement is approaching the level necessary to probe the CP properties of our LHCb data, even if we did differ from the SM prediction. Finally, $B^{*}\\to\\mu\\nu$ decay remains unseen.", "gold_evidence_draft": [{"evidence_unit_id": "CERNCourier2022NovDec-digitaledition_page_0017_HY_006", "document_id": "CERNCourier2022NovDec-digitaledition", "page_id": "page_0017", "element_type": "TEXT", "bbox": [[532.0, 168.0, 720.0, 404.0]], "text": "with the SM prediction of $(3.7\\pm1)\\times10^{-7}$ , and reduces a previous tension between theory and experiment, which was based on the combination of the previous CMS result with the ATLAS and LHCb values. The variation in the central value of the $y(\\text{GeV})$ ratio, i.e., $|\\text{GeV}|\\leq y\\leq 1$ , from the use of a larger data sample and by the change of the B-hadron fragmentation fraction ratio (by about 8 % ), the meas- ured effective lifetime of the $B^{*}\\to\\mu\\nu$ decay, $1.8\\pm0.2\\%,$ is also consistent with the SM prediction. The precision of this measurement is approaching the level necessary to probe the CP properties of our LHCb data, even if we did differ from the SM prediction. Finally, $B^{*}\\to\\mu\\nu$ decay remains unseen.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/output/deepseekocr2_split_render/CERNCourier2022NovDec-digitaledition/page_0017/page.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_6/hybrid/shard_0/CERNCourier2022NovDec-digitaledition/page_0017/evidence_nodes.jsonl", "source_atom_ids": ["A_011"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::CERNCourier2025JanFeb-digitaledition::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "CERNCourier2025JanFeb-digitaledition", "document_title": "CERNCourier2025JanFeb-digitaledition", "question": "What causal, technical, or comparative relationship does the selected passage establish in CERNCourier2025JanFeb-digitaledition, and what stated condition or consequence qualifies it?", "gold_answer_draft": "The masses of SUSY particles have very important implications for both the physics of our universe and how they could be potentially produced and observed at experiments like CMS. The heavier the sparticle, the rarer its appearance. On the other hand, when heavy particle decay, their mass is con- verted to the masses and momenta of SM particles, like leptons and jets. These particles are detected by CMS, with large masses leaving potentially spectacular (and conspicuous) signatures. Each heavy sparticle is expected to continue to decay to lighter ones, ending with the lightest SUSY particles (LSPs). LSPs, though mas- sive, are stable and do not decay in the detector. Instead, they appear as missing momentum. In cases of compressed spar- cicle mass spectra, the mass difference between the initially produced sparticles and LSPs is small. This means the low rates of production of massive sparticles are not accompanied by high – momentum", "gold_evidence_draft": [{"evidence_unit_id": "CERNCourier2025JanFeb-digitaledition_page_0006_HY_015", "document_id": "CERNCourier2025JanFeb-digitaledition", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[851.0, 367.0, 1044.0, 694.0]], "text": "The masses of SUSY particles have very important implications for both the physics of our universe and how they could be potentially produced and observed at experiments like CMS. The heavier the sparticle, the rarer its appearance. On the other hand, when heavy particle decay, their mass is con- verted to the masses and momenta of SM particles, like leptons and jets. These particles are detected by CMS, with large masses leaving potentially spectacular (and conspicuous) signatures. Each heavy sparticle is expected to continue to decay to lighter ones, ending with the lightest SUSY particles (LSPs). LSPs, though mas- sive, are stable and do not decay in the detector. Instead, they appear as missing momentum. In cases of compressed spar- cicle mass spectra, the mass difference between the initially produced sparticles and LSPs is small. This means the low rates of production of massive sparticles are not accompanied by high – momentum", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/EvidenceNet/output/relation_first_corpus_shadow_v1/staged_sources/CERNCourier2025JanFeb-digitaledition/page_0006.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_3/hybrid/shard_0/CERNCourier2025JanFeb-digitaledition/page_0006/evidence_nodes.jsonl", "source_atom_ids": ["A_027"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::CERNCourier2025JanFeb-digitaledition::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "CERNCourier2025JanFeb-digitaledition", "document_title": "CERNCourier2025JanFeb-digitaledition", "question": "What causal, technical, or comparative relationship does the selected passage establish in CERNCourier2025JanFeb-digitaledition, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Data on strokes is plentiful but frag- mented, making it difficult to exploit in data-driven treatment strategies. The toolbox of the high-energy physicist is well adapted to the task. To amplify CERN's societal contributions through technological innovation, the Unleash- ing of Cerebral Cortex Neuronate Patient-Centric Stroke Management for a Better, Rapid, Advanced and Personalised Stroke Diagnosis, Treatments and Out- come Prediction (UMBRELLA) project – co-led by Vall d'Hebron Research Institute and Siemens Healthineers – was officially launched on 1 October 2024. The kickoff meeting in Barcelona, Spain, convened more than 20 partners, including Philips, General Electric and Medtrion. Backed by nearly £27 million from the EU's Innovative Health Initiative and industry collaborators, the project aims to transform stroke care across Europe.", "gold_evidence_draft": [{"evidence_unit_id": "CERNCourier2025JanFeb-digitaledition_page_0017_HY_003", "document_id": "CERNCourier2025JanFeb-digitaledition", "page_id": "page_0017", "element_type": "TEXT", "bbox": [[46.0, 169.0, 234.0, 456.0]], "text": "Data on strokes is plentiful but frag- mented, making it difficult to exploit in data-driven treatment strategies. The toolbox of the high-energy physicist is well adapted to the task. To amplify CERN's societal contributions through technological innovation, the Unleash- ing of Cerebral Cortex Neuronate Patient-Centric Stroke Management for a Better, Rapid, Advanced and Personalised Stroke Diagnosis, Treatments and Out- come Prediction (UMBRELLA) project – co-led by Vall d'Hebron Research Institute and Siemens Healthineers – was officially launched on 1 October 2024. The kickoff meeting in Barcelona, Spain, convened more than 20 partners, including Philips, General Electric and Medtrion. Backed by nearly £27 million from the EU's Innovative Health Initiative and industry collaborators, the project aims to transform stroke care across Europe.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/output/deepseekocr2_split_render/CERNCourier2025JanFeb-digitaledition/page_0017/page.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_4/hybrid/shard_1/CERNCourier2025JanFeb-digitaledition/page_0017/evidence_nodes.jsonl", "source_atom_ids": ["A_005"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::CERNCourier2026MayJun-digitaledition::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "CERNCourier2026MayJun-digitaledition", "document_title": "CERNCourier2026MayJun-digitaledition", "question": "What causal, technical, or comparative relationship does the selected passage establish in CERNCourier2026MayJun-digitaledition, and what stated condition or consequence qualifies it?", "gold_answer_draft": "The collaboration's main target is CPT symmetry. Charge conjugation (C), parity inversion (P) and time reversal (T), taken together, are expected to leave physics invariant. Matter and anti- matter must therefore have identical masses and magnetic moments, equal momentum sizes and the same neutral site sign. BASE tests CPT directly on protons and antiprotons, confined in electromagnetic traps, by measuring their cyclotron and spin-flip frequen- cies. \"At low energies, measurements usually use only matter systems, on the assumption that antimatter behaves the same way without testing it,\" says Christian Smorra, leader of the collab- oration, and the use of 125 U and 90 g BASE-STEP. \"Antiprotons are the only stable baryons that can be produced and trapped at low energies, enabling precise frequency measurements.\"", "gold_evidence_draft": [{"evidence_unit_id": "CERNCourier2026MayJun-digitaledition_page_0008_HY_003", "document_id": "CERNCourier2026MayJun-digitaledition", "page_id": "page_0008", "element_type": "TEXT", "bbox": [[47.0, 457.0, 235.0, 745.0]], "text": "The collaboration's main target is CPT symmetry. Charge conjugation (C), parity inversion (P) and time reversal (T), taken together, are expected to leave physics invariant. Matter and anti- matter must therefore have identical masses and magnetic moments, equal momentum sizes and the same neutral site sign. BASE tests CPT directly on protons and antiprotons, confined in electromagnetic traps, by measuring their cyclotron and spin-flip frequen- cies. \"At low energies, measurements usually use only matter systems, on the assumption that antimatter behaves the same way without testing it,\" says Christian Smorra, leader of the collab- oration, and the use of 125 U and 90 g BASE-STEP. \"Antiprotons are the only stable baryons that can be produced and trapped at low energies, enabling precise frequency measurements.\"", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/output/deepseekocr2_split_render/CERNCourier2026MayJun-digitaledition/page_0008/page.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_3/hybrid/shard_1/CERNCourier2026MayJun-digitaledition/page_0008/evidence_nodes.jsonl", "source_atom_ids": ["A_006"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::CERNCourier2026MayJun-digitaledition::2", "review_status": "NEEDS_HUMAN_REVIEW", "cor e_unit_id": "CLADmag_2025_H2_page_0063_HY_002", "document_id": "CLADmag_2025_H2", "page_id": "page_0063", "element_type": "TEXT", "bbox": [[94.0, 528.0, 463.0, 682.0]], "text": "This distinctive 42,000-seat stadium, designed by global giants Gensler, is partially submerged into the earth to keep well clear of flight paths immediately above. The result is a striking sunken arena, with a massive structural arch adding to the drama - as well as making this a symbolic gateway to Cairo. On arrival, fans of Egypt's biggest club Al-Ahly will be welcomed into an 'Owners' Plaza', with shops, cafés, a club", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/output/deepseekocr2_h100_clad/CLADmag_2025_H2/page_0063/page.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_6/hybrid/shard_0/CLADmag_2025_H2/page_0063/evidence_nodes.jsonl", "source_atom_ids": ["A_004"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::DLRmagazine_176_EN::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "DLRmagazine_176_EN", "document_title": "DLRmagazine_176_EN", "question": "What causal, technical, or comparative relationship does the selected passage establish in DLRmagazine_176_EN, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Applications in which valuable goods or even human lives depend on accurate positional information in emergen- cies require exceptionally reliable navigation systems. This is the case, for example, with automatic aircraft landings in poor weather conditions or autonomous driving. To achieve the necessary level of reliability, data from a variety of sensors – such as inertial sensors and cameras – are analysed and integrated with GNSS data. These multi- sensor solutions combine the strengths of different sensor types, mitigate the weaknesses of individual sensors and ensure safety through redundancy. In the data fusion process, researchers account for the error characteristics of each sensor to derive the most reliable positioning information possible. Both conventional sensors and novel sensors developed at DLR, based on quantum technology, are considered in this process.", "gold_evidence_draft": [{"evidence_unit_id": "DLRmagazine_176_EN_page_0009_HY_006", "document_id": "DLRmagazine_176_EN", "page_id": "page_0009", "element_type": "TEXT", "bbox": [[1273, 413, 1555, 634]], "text": "Applications in which valuable goods or even human lives depend on accurate positional information in emergen- cies require exceptionally reliable navigation systems. This is the case, for example, with automatic aircraft landings in poor weather conditions or autonomous driving. To achieve the necessary level of reliability, data from a variety of sensors – such as inertial sensors and cameras – are analysed and integrated with GNSS data. These multi- sensor solutions combine the strengths of different sensor types, mitigate the weaknesses of individual sensors and ensure safety through redundancy. In the data fusion process, researchers account for the error characteristics of each sensor to derive the most reliable positioning information possible. Both conventional sensors and novel sensors developed at DLR, based on quantum technology, are considered in this process.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/EvidenceNet/output/composite_evidence_pilot_v3_recomposed_components/DLRmagazine_176_EN/page_0009/original.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_6/hybrid/shard_0/DLRmagazine_176_EN/page_0009/evidence_nodes.jsonl", "source_atom_ids": ["D016"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::DLRmagazine_176_EN::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "DLRmagazine_176_EN", "document_title": "DLRmagazine_176_EN", "question": "What causal, technical, or comparative relationship does the selected passage establish in DLRmagazine_176_EN, and what stated condition or consequence qualifies it?", "gold_answer_draft": "The local mission control centre (LMOC) is positioned at the last safe deployment site, housed within a mobile container nearly seven metres in length. It is connected to the GMOC and commands the aid transporter. The remote control is operated primarily through automation along a pre-planned route, with the vehicle continuously transmitting its position and 360-degree environmental data to the LMOC. To facilitate this, the vehicle is equipped with a radar antenna, perception sensors, depth cameras and a lidar system, akin to those used on lunar or Martian rovers. Technological support is provided by the DLR spin-off Roboception. There is also a landing pad on the vehi- cle’s roof for drones that can gather supplementary information. The team in the command centre monitors all activities live on a screen.", "gold_evidence_draft": [{"evidence_unit_id": "DLRmagazine_176_EN_page_0012_HY_006", "document_id": "DLRmagazine_176_EN", "page_id": "page_0012", "element_type": "TEXT", "bbox": [[396, 549, 736, 716]], "text": "The local mission control centre (LMOC) is positioned at the last safe deployment site, housed within a cy-driven approach when they studied whether a period of catch-up growth in the early 2000s in Latin America and the Caribbean (LAC) was driven by `good policies' or `good luck' from high commodity prices. Other analyses built on Araujo et al. (2016) to explore country- and region-specific growth episodes. For example, results from Haile and Moller (2018) pointed to the importance of financial deepening, macro policy, and infrastructure for previously poorly understood growth accelerations in the West African Economic and Monetary Union (WAEMU). Geiger et al. (2019) revealed that typical growth correlates explain the exceptional growth performance of Ghana up to 2010 but not afterwards. They interpret this as an abatement of structural improvements in the economy and an increasingly cyclical growth performance. $^7$", "gold_evidence_draft": [{"evidence_unit_id": "IDU-41f597b3-c201-4fa7-8cac-466610c36a27_page_0006_HY_002", "document_id": "IDU-41f597b3-c201-4fa7-8cac-466610c36a27", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[184.0, 370.0, 914.0, 590.0]], "text": "Araujo et al. (2016) revived this policy-driven approach when they studied whether a period of catch-up growth in the early 2000s in Latin America and the Caribbean (LAC) was driven by `good policies' or `good luck' from high commodity prices. Other analyses built on Araujo et al. (2016) to explore country- and region-specific growth episodes. For example, results from Haile and Moller (2018) pointed to the importance of financial deepening, macro policy, and infrastructure for previously poorly understood growth accelerations in the West African Economic and Monetary Union (WAEMU). Geiger et al. (2019) revealed that typical growth correlates explain the exceptional growth performance of Ghana up to 2010 but not afterwards. They interpret this as an abatement of structural improvements in the economy and an increasingly cyclical growth performance. $^7$", "source_page_image": "/hkfs/home/project  Tennessee, Virginia, and West Virginia. By 1912, Sarah Cochran, dubbed the nation's “coal queen,” was one of the wealthiest women in the eastern United States.6", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/output/deepseekocr2_split_render/Luminous Garden Agnes Northrop and the Women of Tiffany Studios/page_0014/page.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_3/hybrid/shard_1/Luminous Garden Agnes Northrop and the Women of Tiffany Studios/page_0014/evidence_nodes.jsonl", "source_atom_ids": ["A_003"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::arxiv_1508_02357::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "arxiv_1508_02357", "document_title": "arxiv_1508_02357", "question": "What causal, technical, or comparative relationship does the selected passage establish in arxiv_1508_02357, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Figure 1 shows the steps that the pipeline uses to find signals and measure their significance. The input to the pipeline is the detector's calibrated strain data [36, 37] . In addition to possible signals, the strain data contains two classes of noise: a primarily stationary, Gaussian noise component from fundamental processes such as thermal noise, quantum noise, and seismic noise coupling into the detector [5] and non-Gaussian noise transients of instrumental and environmental origin [38, 34] . To eliminate the worst periods of detector performance, data quality investigations [39, 40, 41, 33] are used to characterize detector data into three general classes: (i) the data is polluted with enough noise that the data should be discarded without being searched, (ii) the data can be filtered, but candidate events that lie in intervals of poor data quality should be discarded, or vetoed , due to the presence of a instrumental or environmental artifacts, or (iii) the data is suitable for astrophysical searches. Data quality investigations are conducted independently of the search pipeline (by looking only at detector performance), as well as by determining the effect of instrumental artifacts on the noise background of the search pipeline. After removing data that is not suitable for astrophysical searches, the pipeline begins its analysis, following the remaining steps shown in Figure 1 .", "gold_evidence_draft": [{"evidence_unit_id": "arxiv_1508_02357_page_0003_HY_002", "document_id": "arxiv_1508_02357", "page_id": "page_0003", "element_type": "TEXT", "bbox": [[140.0, 566.0, 1048.0, 1110.0]], "text": "Figure 1 shows the steps that the pipeline uses to find signals and measure their significance. The input to the pipeline is the detector's calibrated strain data [36, 37] . In addition to possible signals, the strain data contains two classes of noise: a primarily stationary, Gaussian noise component from fundamental processes such as thermal noise, quantum noise, and seismic noise coupling into the detector [5] and non-Gaussian noise transients of instrumental and environmental origin [38, 34] . To eliminate the worst periods of detector performance, data quality investigations [39, 40, 41, 33] are used to characterize detector data into three general classes: (i) the data is polluted with enough noise that the data should be discarded without being searched, (ii) the data can be filtered, but candidate events that lie in intervals of poor data quality should be discarded, or vetoed , due to the presence of a instrumental or environmental artifacts, or (iii) the data is suitable for astrophysical searches. Data quality investigations are conducted independently of the search pipeline (by looking only at detector performance), as well as by determining the effect of instrumental artifacts on the noise background of the search pipeline. After removing data that is not suitable for astrophysical searches, the pipeline begins its analysis, following the remaining steps shown in Figure 1 .", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/experiments/dolphin_v2_pilot/work/relation_first_fresh/images/relation_arxiv_1508_02357.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_2/hybrid/shard_0/arxiv_1508_02357/page_0003/evidence_nodes.jsonl", "source_atom_ids": ["A_004"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::arxiv_1508_02357::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "arxiv_1508_02357", "document_title": "arxiv_1508_02357", "question": "What causal, technical, or comparative relationship does the selected passage establish in arxiv_1508_02357, and what stated condition or consequence qualifies it?", "gold_answer_draft": "The search requires that signals are observed with consistent parameters in the detector network. First, any triggers that occur during times of instrumental or environmental artifacts, as determined by the input data quality metadata, are vetoed . To be considered a candidate event, triggers must be observed with a time of arrival difference less than or equal to the gravitational-wave travel time between detectors, with an additional window to account for uncertainty in the measurement of the time of", "gold_evidence_draft": [{"evidence_unit_id": "arxiv_1508_02357_page_0006_HY_005", "document_id": "arxiv_1508_02357", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[140.0, 1347.0, 1048.0, 1537.0]], "text": "The search requires that signals are observed with consistent parameters in the detector network. First, any triggers that occur during times of instrumental or environmental artifacts, as determined by the input data quality metadata, are vetoed . To be considered a candidate event, triggers must be observed with a time of arrival difference less than or equal to the gravitational-wave travel time between detectors, with an additional window to account for uncertainty in the measurement of the time of", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/experiments/dolphin_v2_pilot/work/relation_first_fresh/images/relation_arxiv_1508_02357_page_0006.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_4/hybrid/shard_1/arxiv_1508_02357/page_0006/evidence_nodes.jsonl", "source_atom_ids": ["A_010"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::arxiv_1510_04615::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "arxiv_1510_04615", "document_title": "arxiv_1510_04615", "question": "What causal, technical, or comparative relationship does the selected passage establish in arxiv_1510_04615, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Initial and advanced LIGO/Virgo rate estimates are ob- tained using gravitational waveform models for a given source with binary component masses $m_1$ and $m_2$ at red- shift $z$ . Our standard waveform model IMRPhenomC from Santamaria et al. (2010) includes inspiral, merger, and ringdown, and is tuned to numerical relativity simulations of non-precessing BH-BH mergers with aligned spins. We have verified explicitly that we obtain essentially identi- cal rate estimates using an effective-one-body waveform model (more specifically, EOBNRv2; Pan et al. 2011). Mild differences between EOBNRv2 and IMRPhenomC only show up in the highest mass bins, where the rates are so low that statistical fluctuations dominate over un- certainties due to the gravitational waveform model. Pan- narale et al. (2013) demonstrated that finite-size effects introduce negligible errors ( $\\lesssim 1\\%$ ) in SNR calculations for BH-NS binaries, and therefore the IMRPhenomC model is also applicable to BH-NS rate estimates. We also use the IMRPhenomC waveforms for NS-NS binaries, since in this case the signal seen by advanced detectors is dom- inated by the early inspiral, where finite-size effects are negligible. The IMRPhenomC model includes higher har- monics in the waveform amplitude, resulting in a slight reduction of the inspiral amplitude compared to a simple quadrupole-formula estimate, and therefore in a slight de- crease in the predicted detection rates. All of our rate calculations neglect spins, and therefore they should be considered as conservative lower limits (cf. Dominik et al. 2015 for a more detailed discussion of waveform models and of the effect of spins).", "gold_evidence_draft": [{"evidence_unit_id": "arxiv_1510_04615_page_0003_HY_010", "document_id": "arxiv_1510_04615", "page_id": "page_0003", "element_type": "TEXT", "bbox": [[644.0, 143.0, 1159.0, 811.0]], "text": "Initial and advanced LIGO/Virgo rate estimates are ob- tained using gravitational waveform models for a given source with binary component masses $m_1$ and $m_2$ at red- shift $z$ . Our standard waveform model IMRPhenomC from Santamaria et al. (2010) includes inspiral, merger, and ringdown, and is tuned to numerical relativity simulations of non-precessing BH-BH mergers with aligned spins. We have verified explicitly that we obtain essentially identi- cal rate estimates using an effective-one-body waveform model (more specifically, EOBNRv2; Pan et al. 2011). Mild differences between EOBNRv2 and IMRPhenomC only show up in the highest mass bins, where the rates are so low that statistical fluctuations dominate over un- certainties due to the gravitational waveform model. Pan- narale et al. (2013) demonstrated that finite-size effects introduce negligible errors ( $\\lesssim 1\\%$ ) in SNR calculations for BH-NS binaries, and therefore the IMRPhenomC model is also applicable to BH-NS rate estimates. We also use the IMRPhenomC waveforms for NS-NS binaries, since in this case the signal seen by advanced detectors is dom- inated by the early inspiral, where finite-size effects are negligible. The IMRPhenomC model includes higher har- monics in the waveform amplitude, resulting in a slight reduction of the inspiral amplitude compared to a simple quadrupole-formula estimate, and therefore in a slight de- crease in the predicted detection rates. All of our rate calculations neglect spins, and therefore they should be considered as conservative lower limits (cf. Dominik et al. 2015 for a more detailed discussion of waveform models and of the effect of spins).", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/experiments/dolphin_v2_pilot/work/relation_first_fresh/images/relation_arxiv_1510_04615.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_4/hybrid/shard_0/arxiv_1510_04615/page_0003/evidence_nodes.jsonl", "source_atom_ids": ["A_012"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::arxiv_1510_04615::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "arxiv_1510_04615", "document_title": "arxiv_1510_04615", "question": "What causal, technical, or comparative relationship does the selected passage establish in arxiv_1510_04615, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Methods II and III predict nonzero rates out to a total redshifted mass of 400 M $_\\odot$ . This is a much higher total BH-BH binary mass than what is conventionally expected from normal stars, where by “ normal ” stars we mean stars with initial mass below 150 M $_\\odot$ . Until recently, this value was believed to be the upper mass limit on star forma- tion, at least in non-zero metallicity environments. Thus far all the predictions for compact object merger rates from Population I and Population II stars have been lim- ited to stars of mass $<150$ M $_\\odot$ . The recent discovery of stars estimated to be initially as massive as $\\sim$ 200 – 300 M $_\\odot$ (e.g., Crowther et al. 2010 ) in the relatively high metal- licity environment of the S Doradus cluster in the LMC ( $Z\\approx0.6$ Z $_\\odot$ ) has shaken these beliefs. The first study of BH-BH merger rates from these very massive stars has already been proposed (Belczynski et al. 2014 ). However, in the current work our models are limited to stars with initial mass below 150 M $_\\odot$ and we nonetheless find merg- ers as massive as 400 M $_\\odot$ in our calculations. Two factors are responsible for this surprising result: the inclusion of very low-metallicity models, and our use of the full grav- itational waveform in our analysis. The former allows for the formation of massive BH-BH binaries from Population", "gold_evidence_draft": [{"evidence_unit_id": "arxiv_1510_04615_page_0006_HY_009", "document_id": "arxiv_1510_04615", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[645.0, 966.0, 1159.0, 1478.0]], "text": "Methods II and III predict nonzero rates out to a total redshifted mass of 400 M $_\\odot$ . This is a much higher total BH-BH binary mass than what is conventionally expected from normal stars, where by “ normal ” stars we mean stars with initial mass below 150 M $_\\odot$ . Until recently, this value was believed to be the upper mass limit on star forma- tion, at least in non-zero metallicity environments. Thus far all the predictions for compact object merger rates from Population I and Population II stars have been lim- ited to stars of mass $<150$ M $_\\odot$ . The recent discovery of stars estimated to be initially as massive as $\\sim$ 200 – 300 M $_\\odot$ (e.g., Crowther et al. 2010 ) in the relatively high metal- licity environment of the S Doradus cluster in the LMC ( $Z\\approx0.6$ Z $_\\odot$ ) has shaken these beliefs. The first study of BH-BH merger rates from these very massive stars has already been proposed (Belczynski et al. 2014 ). However, in the current work our models are limited to stars with initial mass below 150 M $_\\odot$ and we nonetheless find merg- ers as massive as 400 M $_\\odot$ in our calculations. Two factors are responsible for this surprising result: the inclusion of very low-metallicity models, and our use of the full grav- itational waveform in our analysis. The former allows for the formation of massive BH-BH binaries from Population", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/experiments/dolphin_v2_pilot/work/relation_first_fresh/images/relation_arxiv_1510_04615_page_0006.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_1/hybrid/shard_1/arx w that the so- lutions for the network responses are given by the pro- jections of the data vectors $(\\mathbf{w}, \\tilde{\\mathbf{w}})$ on the network plane. As described above the un-modeled burst analysis can be constrained to search for GW signals with various po- larization states. In general case, the constrained likeli- hood problem is hard to solve analytically and the nu- merical solutions are computationally prohibitive. To solve this problem, we apply the phase transformation in Equation 3.5 to the data vectors $\\mathbf{w}$ and $\\tilde{\\mathbf{w}}$ . This transformation reveals the underlying polarization pat- tern $\\{\\mathbf{w}_{+}, \\mathbf{w}_{\\times}, \\tilde{\\mathbf{w}}_{\\times}\\}$ smeared by the detector noise. The detector responses can be reconstructed directly from this pattern. The solutions for different polarization states can be obtained by imposing the polarization con- straints in Table I . As follows from Equations 3.10 - 3.12 , for linear ( $e=0$ ) and circular ( $e\\pm1$ ) waves the com- ponents $\\boldsymbol{\\tilde{\\xi}}_{\\times}=0$ and $\\boldsymbol{\\xi}_{\\times}=0$ respectively. Therefore, the reconstructed responses for the loose linear polar- ization constraint are $(\\boldsymbol{\\xi}_{+}=\\mathbf{w}_{+}, \\boldsymbol{\\xi}_{\\times}=\\mathbf{w}_{\\times}, \\boldsymbol{\\xi}_{\\times}=0)$ and for the loose circular polarization constraint they are $(\\boldsymbol{\\xi}_{+}=\\mathbf{w}_{+}, \\boldsymbol{\\xi}_{\\times}=0, \\tilde{\\boldsymbol{\\xi}}_{\\times}=\\tilde{\\mathbf{w}}_{\\times})$ . The solution for linear waves is $(\\boldsymbol{\\xi}_{+}=\\mathbf{p}_{+}, \\boldsymbol{\\xi}_{\\times}=\\mathbf{p}_{\\times}, \\tilde{\\boldsymbol{\\xi}}_{\\times}=0)$ where $\\mathbf{p}$ are the projections of $\\mathbf{w}_{+}+\\mathbf{w}_{\\times}$ on their average vector. The analytic solutions for the other polarization constraints are straightforward to find and we do present them here. Such significant simplification of th ts (blue markers) and background (green curve) for an alternative search that treats events independently of their frequency evolution (C2 + C3). The classes C2 and C3 are defined in the text. Right: The tail in the black-line background of the binary coalescence search is due to random coincidences of GW150914 in one detector with noise in the other detector. (This type of event is practically absent in the generic transient search background because they do not pass the time-frequency consistency requirements used in that search.) The purple curve is the background excluding those coincidences, which is used to assess the significance of the second strongest event.", "gold_evidence_draft": [{"evidence_unit_id": "gw150914_detection_page_0006_HY_007", "document_id": "gw150914_detection", "page_id": "page_0006", "element_type": "COMPOSITE", "bbox": [[101.0, 1206.0, 1135.0, 1453.0], [119.0, 794.0, 1113.0, 1190.0]], "text": "FIG. 4. Search results from the generic transient search (left) and the binary coalescence search (right). These histograms show the number of candidate events (orange markers) and the mean number of background events (black lines) in the search class where GW150914 was found as a function of the search detection statistic and with a bin width of 0.2. The scales on the top give the significance of an event in Gaussian standard deviations based on the corresponding noise background. The significance of GW150914 is greater than $5.1\\sigma$ and $4.6\\sigma$ for the binary coalescence and the generic transient searches, respectively. Left: Along with the primary search (C3) we also show the results (blue markers) and background (green curve) for an alternative search that treats events independently of their frequency evolution (C2 + C3). The classes C2 and C3 are defined in the text. Right: The tail in the black-line background of the binary coalescence search is due to random coincidences of GW150914 in one detector with noise in the other detector. y, binary systems move along circular or elliptical orbits with constant orbital period [4, 5] . In GR, binary systems emit GWs [6, 7] ; as a consequence, the bi- nary’s orbital period decreases over time as energy and angu- lar momentum are radiated away. Electromagnetic observa- tions of binary pulsars over the four decades since their dis- covery [8, 9] have made it possible to measure GW-induced orbital-period variations $\\dot{P}_{\\rm orb}\\sim-10^{-14}-10^{-12}$ , confirming the GW luminosity predicted at leading order in post-Newtonian (PN) theory [10] (i.e., Einstein's quadrupole formula) with exquisite precision [11, 12] . Nevertheless, even in the most relativistic binary pulsar known today, J0737-3039 [11] , the orbital period changes at an effectively constant rate. The or- bital velocity $v$ relative to the speed of light $c$ is $v/c\\sim2\\times10^{-3}$ , and the two neutron stars in the system will coalesce in $\\sim85\\,{\\rm Myr}$ .", "gold_evidence_draft": [{"evidence_unit_id": "gw150914_gr_test_page_0006_HY_002", "document_id": "gw150914_gr_test", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[104.0, 374.0, 608.0, 760.0]], "text": "In Newtonian gravity, binary systems move along circular or elliptical orbits with constant orbital period [4, 5] . In GR, binary systems emit GWs [6, 7] ; as a consequence, the bi- nary’s orbital period decreases over time as energy and angu- lar momentum are radiated away. Electromagnetic observa- tions of binary pulsars over the four decades since their dis- covery [8, 9] have made it possible to measure GW-induced orbital-period variations $\\dot{P}_{\\rm orb}\\sim-10^{-14}-10^{-12}$ , confirming the GW luminosity predicted at leading order in post-Newtonian (PN) theory [10] (i.e., Einstein's quadrupole formula) with exquisite precision [11, 12] . Nevertheless, even in the most relativistic binary pulsar known today, J0737-3039 [11] , the orbital period changes at an effectively constant rate. The or- bital velocity $v$ relative to the speed of light $c$ is $v/c\\sim2\\times10^{-3}$ , and the two neutron stars in the system will coalesce in $\\sim85\\,{\\rm Myr}$ .", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/experiments/dolphin_v2_pilot/work/relation_first_fresh/images/relation_gw150914_gr_test_page_0006.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_0/hybrid/shard_1/gw150914_gr_test/page_0006/evidence_nodes.jsonl", "source_atom_ids": ["A_003"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::gw150914_properties::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "node_vqa_reuse_v1_20261113", "document_id": "gw150914_properties", "document_title": "gw150914_properties", "question": "What causal, technical, or comparative relationship does the selected passage establish in gw150914_properties, and what stated condition or consequence qualifies it?", "gold_answer_draft": "As the BHs get closer to each other and their velocities increase, the accuracy of the PN expansion degrades, and eventually the full solution of Einstein's equations is needed to accurately describe the binary evolution. This is accomplished using numerical relativity (NR) which, after the initial breakthrough [32–34] , has been improved continuously to achieve the sophistication of modeling needed for our purposes. The details of the ringdown are primarily governed by the mass and spin of the final BH. In particular, the final mass and spin determine the (constant) frequency and decay time of the BH's ringdown to its final state [35] . The late stage of the coale tion of this tissue, as well as the restoration of the transcriptional signature corresponding to young age (Adler et al., 2007) . Likewise, genetic and pharmacological inhibition of NF- $\\kappa$ B signaling prevents age-associated features in different mouse models of accelerated aging (Osorio et al., 2012; Tilstra et al., 2012) . A novel link between inflammation and aging derives from the recent finding that inflammatory and stress responses activate NF- $\\kappa$ B in the hypothalamus and induce a signaling pathway that results in reduced production of gonadotropin-releasing hormone (GnRH) by neurons (Zhang et al., 2013) . This GnRH decline can contribute to numerous aging-related changes such as bone fragility, muscle weakness, skin atrophy and reduced neurogenesis. Consistently, GnRH treatment prevents aging-impaired neurogenesis and decelerates aging development in mice (Zhang et al., 2013) . These findings suggest that the hypothalamus may modulate systemic aging by integrating NF- $\\kappa$ B-driven inflammatory responses with GnRH-mediated neuroendocrine effects.", "gold_evidence_draft": [{"evidence_unit_id": "hallmarks_of_aging_page_0018_HY_003", "document_id": "hallmarks_of_aging", "page_id": "page_0018", "element_type": "TEXT", "bbox": [[221.0, 737.0, 784.0, 1044.0]], "text": "Global studies on the transcriptional landscape of aged tissues have also emphasized the relevance of inflammatory pathways in aging (de Magalhaes et al., 2009; Lee et al., 2012) . Over-activation of the NF- $\\kappa$ B pathway is one of these transcriptional signatures of aging and conditional expression of an NF- $\\kappa$ B inhibitor in the aged skin of transgenic mice causes the phenotypic rejuvenation of this tissue, as well as the restoration of the transcriptional signature corresponding to young age (Adler et al., 2007) . Likewise, genetic and pharmacological inhibition of NF- $\\kappa$ B signaling prevents age-associated features in different mouse models of accelerated P-ribosyltransferases has been studied extensively as potential anti-aging factors. Interest in this family of proteins in relation to aging stems from a series of studies in yeast, flies and worms reporting that the single sirtuin gene of these organisms, named Sir2 , had a remarkable longevity activity (Guarente, 2011) . Overexpression of Sir2 was first shown to extend replicative lifespan in Saccharomyces cerevisiae (Kaeberlein et al., 1999) , and subsequent reports indicated that enhanced expression of the worm ( sir-2.1 ) and fly ( dSir2 ) orthologs could extend lifespan in both invertebrate model systems (Rogina and Helfand, 2004; Tissenbaum and Guarente, 2001) . These findings have recently been called into question, however, with the report that the lifespan extension originally observed in the worm and fly studies was mostly due to confounding genetic background differences and not to the overexpression of sir-2.1 or dSir2 , respectively (Burnett et al., 2011) . In fact, careful reassessments indicate that overexpression of sir-2.1 only results in modest lifespan extension in C. elegans (Viswanathan and Guarente, 2011) .", "gold_evidence_draft": [{"evidence_unit_id": "hallmarks_of_aging_page_0006_HY_005", "document_id": "hallmarks_of_aging", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[299.0, 997.0, 1054.0, 1339.0]], "text": "The sirtuin family of NAD-dependent protein deacetylases and ADP-ribosyltransferases has been studied extensively as potential anti-aging factors. Interest in this family of proteins in relation to aging stems from a series of studies in yeast, flies and worms reporting that the single sirtuin gene of these organisms, named Sir2 , had a remarkable longevity activity (Guarente, 2011) . Overexpression of Sir2 was first shown to extend replicative lifespan in Saccharomyces cerevisiae (Kaeberlein et al., 1999) , and subsequent reports indicated that enhanced expression of the worm ( sir-2.1 ) and fly ( dSir2 ) orthologs could  “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Looking forward, NASA took major steps to realize the national goal of establishing a permanent base on the lunar surface by 2024 in cooperation with many space-faring nations. In August 2006, we selected a prime contractor to build the Orion crew exploration vehicle, America's next human-rated spacecraft, to be operational by 2015. Last fall, our next-generation launch vehicle, the Ares I, successfully completed its systems requirement review. In December, NASA unveiled an initial Global Exploration Strategy and lunar architecture which details how sustained lunar exploration will advance science, commerce, and technology development and help us prepare for later journeys to Mars and other destinations.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0007:e004", "document_id": "real_016_batch_16_basic_version_07", "page_number": 7, "element_index": 4, "element_type": "para", "bbox": [94, 729, 550, 1048], "text": "Looking forward, NASA took major steps to realize the national goal of establishing a permanent base on the lunar surface by 2024 in cooperation with many space-faring nations. In August 2006, we selected a prime contractor to build the Orion crew exploration vehicle, America's next human-rated spacecraft, to be operational by 2015. Last fall, our next-generation launch vehicle, the Ares I, successfully completed its systems requirement review. In December, NASA unveiled an initial Global Exploration Strategy and lunar architecture which details how sustained lunar exploration will advance science, commerce, and technology development and help us prepare for later journeys to Mars and other destinations.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0007/output_json/page_0007.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::006", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "A s NASA approaches its 50th anniversary, we reflect on a proud history of achievements that have pushed back boundaries and opened new frontiers for all humanity in the exploration of our solar system and our understanding of the universe and our place in it. New technologies have arisen during this jour- ney, developed of necessity and spurred by the innovative spirit that answers the call of doing the impossible. In the wake of a half-century of advancement, myriad technolo- gies—without which the limits of aeronautics and space could not have been challenged—have found other uses. From the mundane to the sublime, these technologies have become part of the fabric of our everyday life, driv- ing innovation, helping the economy, and adding to the quality of life not only in the United States, but around the world. This 31st edition of Spinoff continues the annual tradition of documenting a few of these happy byproducts by showcasing numerous technologies that have been derived from such diverse projects as launch- ing space shuttles, developing the next generation of helicopters, and analyzing images from Mars probes, all of which are now put to use in our hospitals, homes, and communities.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0009:e001", "document_id": "real_016_batch_16_basic_version_07", "page_number": 9, "element_index": 1, "element_type": "para", "bbox": [92, 162, 550, 728], "text": "A s NASA approaches its 50th anniversary, we reflect on a proud history of achievements that have pushed back boundaries and opened new frontiers for all humanity in the exploration of our solar system and our understanding of the universe and our place in it. New technologies have arisen during this jour- ney, developed of necessity and spurred by the innovative spirit that answers the call of doing the impossible. In the wake of a half-century of advancement, myriad technolo- gies—without which the limits of aeronautics and space could not have been challenged—have found other uses. From the mundane to the sublime, these technologies have become part of the fabric of our everyday life, driv- ing innovation, helping the economy, and adding to the quality of life not only in the United States, but around the world. This 31st edition of Spinoff continues the annual tradition of documenting a few of these happy byproducts by showcasing numerous technologies that have been derived from such diverse projects as launch- ing space shuttles, developing the next generation of helicopters, and analyzing images from Mars probes, all of which are now put to use in our hospitals, homes, and communities.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0009/output_json/page_0009.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::007", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "In accordance with congressional mandates cited in the National Aeronautics and Space Act of 1958 and the Technology Utilization Act of 1962, NASA was directed to encourage greater use of the Agency's knowledge by providing a link between the NASA research community and those who might use the research for commercial or industrial products. For more than 40 years, NASA has nurtured partnerships with the private sector to facilitate the transfer of NASA-developed technologies. The benefits of these partnerships have reached throughout the economy and around the globe, as the resulting commercial products contributed to the development of services and technologies in the fields of health and medicine, transportation, public safety, consumer goods, environmental resources, computer technology, and industry. Since 1976, NASA Spinoff has profiled more than 1,500 of the most compelling of these technologies, annually highlighting the best and brightest of partnerships and innovations. Building on this dynamic history, NASA partnerships with the private sector c , comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "The NASA Innovative Partnerships Program promoted a NASA-developed process for cre- ating nanotubes, and Idaho Space Materials Inc. (ISM) applied for a nonexclusive license for the single-walled carbon nanotube manu- facturing technology. ISM commercialized its products, and the inexpensive, robust nano- tubes are now being used to create the next generation of composite polymers, metals, and ceramics. Researchers are also examining ways to use these materials in myriad technologies, including transistors, fuel cells, televisions, supercapacitors, catalysts, and advanced com- posite materials. page 118 1", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0017:e009", "document_id": "real_016_batch_16_basic_version_07", "page_number": 17, "element_index": 9, "element_type": "para", "bbox": [701, 529, 1029, 856], "text": "The NASA Innovative Partnerships Program promoted a NASA-developed process for cre- ating nanotubes, and Idaho Space Materials Inc. (ISM) applied for a nonexclusive license for the single-walled carbon nanotube manu- facturing technology. ISM commercialized its products, and the inexpensive, robust nano- tubes are now being used to create the next generation of composite polymers, metals, and ceramics. Researchers are also examining ways to use these materials in myriad technologies, including transistors, fuel cells, televisions, supercapacitors, catalysts, and advanced com- posite materials. page 118 1", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0017/output_json/page_0017.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::011", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Cardiovascular experts at NASA have found that the blood that normally settles in the lower regions of the body is instead pulled to the upper body in the microgravity environment of space. Blood volume is subsequently reduced as some cardiovascular reflexes are no longer being used, and less blood flows to the legs. Additionally, the muscles weaken, especially in the lower portion of the body, because they are not working (contracting) as hard as they usually do. This is not so much a concern for the astronauts while they are in space, since the action of floating around takes the place of putting center-of-gravity pressure on their legs. (They do exercise strenuously while in microgravity, though, to keep their muscles and circulatory systems conditioned, thus preparing their bodies for the return to gravity as best they can.) When they return to Earth's gravity, however, more blood returns to the legs. Since there is a lower volume of blood, the flow that is supposed to be traveling to the brain can be insufficient. That is when orthostatic intolerance can set in.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0024:e006", "docum the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Thompson has a history of heart disease in his family. The first male in many generations to live past age 50, and the last living male in his family line, Thompson comes from a long line of active, athletic men who, with no prior symptoms, suffered fatal heart-related events. A lifelong athlete who had boxed in the New York City Golden Gloves tournament in his youth and ran his first marathon in 1975, Thompson was understandably concerned, but feeling confident, when he approached his 50th birthday. He had the family history working against him, but he was also in prime shape. To celebrate his half-century mark, he planned to run three marathons: Los Angeles, New York, and Boston, and he underwent a battery of medical tests, all of which confirmed that he was in perfect health, without any signs of cardiovascular disease.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0029:e001", "document_id": "real_016_batch_16_basic_version_07", "page_number": 29, "element_index": 1, "element_type": "para", "bbox": [93, 215, 550, 593], "text": "Thompson has a history of heart disease in his family. The first male in many generations to live past age 50, and the last living male in his family line, Thompson comes from a long line of active, athletic men who, with no prior symptoms, suffered fatal heart-related events. A lifelong athlete who had boxed in the New York City Golden Gloves tournament in his youth and ran his first marathon in 1975, Thompson was understandably concerned, but feeling confident, when he approached his 50th birthday. He had the family history working against him, but he was also in prime shape. To celebrate his half-century mark, he planned to run three marathons: Los Angeles, New York, and Boston, and he underwent a battery of medical tests, all of which confirmed that he was in perfect health, without any signs of cardiovascular disease.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0029/output_json/page_0029.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::016", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "and fatty substances in the arteries, combined with arterial hardening. The result is that blood flow through the heart is restricted, hampering oxygen supply. Heart attacks occur when the heart does not get the necessary oxygen, and strokes are the result of oxygen not reaching the brain. Atherosclerosis, referred to by the American Heart Association (AHA) as the “ silent killer, ” initially has no discernable symptoms until one or more of the arteries becomes so congested that these major, sometimes fatal, problems occur. The AHA estimates that two out of three unexpected cardiac deaths occur without prior symptoms.", "gold_evidence_draft": [{"evidence_unit_id": "real gold_answer_draft": "Attention Control Systems now offers people with memory, attention, and cognitive disorders a computerized, personal planning device to help them stay on task by overcoming limitations in planning and fulfilling their daily schedules. The device, called the Planning and Execution Assistant and Trainer, or PEAT, is a pocket-sized PDA, complete with a graphical display, touchscreen controls, an electronic calendar, an address book, and a built-in phone. The functionality of PEAT, however, transcends that of a regular PDA scheduling device. PEAT cues users to start or stop scheduled activities, monitors their progress, and adjusts schedules as necessary in response to delays or calendar changes. It uses the automatic planning model developed for NASA to make automatic adjustments to daily plans when a situation changes. Most PDA systems lack this flexibility, requiring their users to manually re-plan and update schedule data when changes occur.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0032:e015", "document_id": "real_016_batch_16_basic_version_07", "page_number": 32, "element_index": 15, "element_type": "para", "bbox": [1049, 492, 1508, 944], "text": "Attention Control Systems now offers people with memory, attention, and cognitive disorders a computerized, personal planning device to help them stay on task by overcoming limitations in planning and fulfilling their daily schedules. The device, called the Planning and Execution Assistant and Trainer, or PEAT, is a pocket-sized PDA, complete with a graphical display, touchscreen controls, an electronic calendar, an address book, and a built-in phone. The functionality of PEAT, however, transcends that of a regular PDA scheduling device. PEAT cues users to start or stop scheduled activities, monitors their progress, and adjusts schedules as necessary in response to delays or calendar changes. It uses the automatic planning model developed for NASA to make automatic adjustments to daily plans when a situation changes. Most PDA systems lack this flexibility, requiring their users to manually re-plan and update schedule data when changes occur.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0032/output_json/page_0032.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::018", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Whether individuals are mildly or severely impaired, PEAT makes it easier for them to get through their planned schedules by providing cues for task completion and adjusting for unplanned schedule conflicts. PEAT can automatically shift flexible tasks that do not require an exact start time in order to keep the prioritized, scheduled events on track. For example, an individual using PEAT wakes up to a preplanned day that consists of having breakfast with a family member from 9:30 to 10:30, followed by stopping at the bank, and then seeing a 12:00 matinee show with a friend (the individual receives cues from PEAT to i n_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Getting a whole cell into focus is vital for many dif- ferent types of cellular analyses, especially for a technique known as fluorescence in situ hybridization (FISH). FISH involves the binding of engineered genetic probes to specific genes or other DNA sequences within cells. The genetic probes consist of a short piece of DNA attached to a fluorescent molecule. The DNA part finds and binds to its complementary DNA sequence(s) within the cell's genome and the fluorescent molecule signals that the binding has taken place, producing a small spot of light within the cell. By detecting and counting these “FISH” spots, a clinician or a researcher conducting an analysis can tell, for instance, if a patient has extra copies of a gene or a chromosome, whether there is damage to their genes, or whether they have lost genetic material—all of which are very useful for detecting cancer and birth defects.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0041:e001", "document_id": "real_016_batch_16_basic_version_07", "page_number": 41, "element_index": 1, "element_type": "para", "bbox": [93, 265, 550, 655], "text": "Getting a whole cell into focus is vital for many dif- ferent types of cellular analyses, especially for a technique known as fluorescence in situ hybridization (FISH). FISH involves the binding of engineered genetic probes to specific genes or other DNA sequences within cells. The genetic probes consist of a short piece of DNA attached to a fluorescent molecule. The DNA part finds and binds to its complementary DNA sequence(s) within the cell's genome and the fluorescent molecule signals that the binding has taken place, producing a small spot of light within the cell. By detecting and counting nt, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "FACET is now a fully integrated feature in the Flight Explorer Professional Edition (version 7.0). Flight Explorer Professional is a flight-tracking and management-decision support tool that the aviation community can use to improve operational efficiency and business performance. It incorporates NASA's FACET technology to graphically depict airports and air sectors that are approaching capacity or are over capacity. FACET provides a count of the total number of arrivals and departures at airports every 15 minutes, plus a count of aircraft flying and aircraft anticipated to be flying within a given sector every 15 minutes—all while calculating loading predictions and weather conditions—to help keep flights on schedule. Data is derived from posted flight plans, and information pertaining to airports and sectors is color-coded, based on capacity. For instance, if an airport is at less than 80- percent capacity, it is marked green; if it is at greater than or equal to 80-percent capacity, it is marked yellow; if it is at 100-percent capacity, it is marked red. Green, yellow, and red color codes also apply for the capacity of sectors.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0046:e014", "document_id": "real_016_batch_16_basic_version_07", "page_number": 46, "element_index": 14, "element_type": "para", "bbox": [1050, 387, 1507, 877], "text": "FACET is now a fully integrated feature in the Flight Explorer Professional Edition (version 7.0). Flight Explorer Professional is a flight-tracking and management-decision support tool that the aviation community can use to improve operational efficiency and business performance. It incorporates NASA's FACET technology to graphically depict airports and air sectors that are approaching capacity or are over capacity. FACET provides a count of the total number of arrivals and departures at airports every 15 minutes, plus a count of aircraft flying and aircraft anticipated to be flying within a given sector every 15 minutes—all while calculating loading predictions and weather conditions—to help keep flights on schedule. Data is derived from posted flight plans, and information pertaining to airports and sectors is color-coded, based on capacity. For instance, if an airport is at less than 80- percent capacity, it is marked green; if it is at greater than or equal to 80-percent capacity, it is marked yellow; if it is at 100-percent capacity, it is marked red. Green, yellow, and red color codes also apply for the capacity of sectors.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0046/output_json/page_0046.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::028", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "The software's Flight Alert System generates automatic alerts to inform users of important events, better preparing them for weather conditions and potential airport delays. A real-time log of any significant events occurring during flight or at an airport is recorded and can be exported to a database for analysis. For the weather alerts, Flight Explorer depends on the NEXRAD (next generation radar) weather-surveillance satellite to display forecast sce- narios 6 hours ahead of time. Graphical overlays are also built in so that users can view real-time maps containing layers of information on top of each other, such as air traffic patterns on top of regional weather conditions.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0047:e000", "document_id": "real_016_batch_16_basic_version_07", "page_number": 47, "element_index": 0, "element_type": "para", "bbox": [93, 164, 550, 463], "text": "The software's Flight Alert System generates automatic alerts to inform users of important events, better preparing them for weather conditions and potential airport delays. A real-time log of any significant events occurring during flight or at an airport is recorded and can be exported to a database for analysis. For the weather alerts, Flight Explorer depends on the NEXRAD (next generation radar) weather-surveillance satellite to display forecast sce- narios 6 hours ahead of time. Graphical overlays are also built in so that users can view real-time maps containing layers of information on top of each other, such as air traffic patterns on top of regional weather conditions.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0047/output_json/page_0047.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_m
