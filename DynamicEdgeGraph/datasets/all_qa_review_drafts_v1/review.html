const rows=[{"draft_id": "manual_qa_review_v1::001", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_01_NASA-Spinoff-2023.pdf", "question": "Which long-running Kennedy research effort supplied the closed-loop, plant-based model later adapted for self-reliant food production?", "gold_answer_draft": "The Controlled Ecological Life Support System (CELS) program.", "gold_evidence_draft": [{"evidence_unit_id": "real_001_batch_01_NASA-Spinoff-2023:p0007:e005", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "page_number": 7, "element_index": 5, "element_type": "para", "bbox": [298, 196, 732, 245], "text": "NASA has worked for decades to develop a life-support system that functions as a self-replenishing ecology. At the heart of this work was the Controlled Ecological Life Support System (CELS) program, which ran for about 25 years, between the late 1970s and early 2000s, at NASA's Kennedy Space Center in Florida. It relied especially on plants, which recycle waste into food and oxygen.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_001_batch_01_NASA-Spinoff-2023/pages/page_0007/output_json/page_0007.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::002", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_01_NASA-Spinoff-2023.pdf", "question": "What physical behavior makes a low-emission aviation energy carrier difficult to contain even before a vehicle can exploit its energy density?", "gold_answer_draft": "Because hydrogen has one of the lowest boiling points of any element and its gaseous form must be kept extremely cold or at remarkably high pressure.", "gold_evidence_draft": [{"evidence_unit_id": "real_001_batch_01_NASA-Spinoff-2023:p0009:e007", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "page_number": 9, "element_index": 7, "element_type": "para", "bbox": [344, 252, 731, 312], "text": "While NASA is testing it to carry liquid oxygen into space, a commercial airline is interested in the fact that the BHL could ultra-cold fuels without developing the micromicrols that they believe are so essential for certain propellant tanks. Hydrogen has one of the lowest boiling points of any element on Earth and its burning gas form must be kept extremely cold, or it needs to be kept under remarkably high pressure.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_001_batch_01_NASA-Spinoff-2023/pages/page_0009/output_json/page_0009.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::003", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_002_batch_02_Spinoff.2022", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_02_Spinoff.2022.pdf", "question": "Which environmental variables must be jointly tuned, rather than optimized one at a time, for a controlled farm to tailor a crop recipe?", "gold_answer_draft": "It optimizes conditions such as water, nutrients, light, airflow, and temperature for particular plants and cultivars.", "gold_evidence_draft": [{"evidence_unit_id": "real_002_batch_02_Spinoff.2022:p0018:e002", "document_id": "real_002_batch_02_Spinoff.2022", "page_number": 18, "element_index": 2, "element_type": "para", "bbox": [49, 135, 267, 208], "text": "Different plants require different balances of water, nutrients, light, airflow, and more. NASA studied and documented all this information for dozens of species, and now Green Sense Farm Holdings Inc. is using some of that individualized plant research to help growers on Earth.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_002_batch_02_Spinoff.2022/pages/page_0018/output_json/page_0018.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::004", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_002_batch_02_Spinoff.2022", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_02_Spinoff.2022.pdf", "question": "What timing reference lets a navigation network avoid an irreversible trajectory error during a one-shot deep-space encounter?", "gold_answer_draft": "Atomic clocks.", "gold_evidence_draft": [{"evidence_unit_id": "real_002_batch_02_Spinoff.2022:p0031:e007", "document_id": "real_002_batch_02_Spinoff.2022", "page_number": 31, "element_index": 7, "element_type": "para", "bbox": [270, 407, 487, 493], "text": "NASA Deep Space Network (DSN), a sort of GPS system for space, relies on atomic clocks for extreme accuracy. Any modern navigation system must accurately time radio signals to triangulate a measurement, but the time for accuracy is even higher in space, where great distances can compound even tiny errors.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_002_batch_02_Spinoff.2022/pages/page_0031/output_json/page_0031.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::005", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_03_NASA_Spinoff_2021.pdf", "question": "What class of persistent industrial contaminant motivated the field-center cleanup demonstration?", "gold_answer_draft": "Polychlorinated biphenyls, or PCBs.", "gold_evidence_draft": [{"evidence_unit_id": "real_003_batch_03_NASA_Spinoff_2021:p0022:e007", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "page_number": 22, "element_index": 7, "element_type": "para", "bbox": [279, 254, 494, 364], "text": "The contaminants she was working against were polychlorinated biphenyls, more commonly referred to as PCBs. When the molecules were first developed and manufactured into multiple formulas, they were added to paint because the formulae used to make these 100% pure temperature extremes. That meant paint wouldn't crack, peel, or catch fire, all important qualities for buildings located near rocket launches.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_003_batch_03_NASA_Spinoff_2021/pages/page_0022/output_json/page_0022.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::006", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_03_NASA_Spinoff_2021.pdf", "question": "Which food sector became the first regulatory test case for the preventive safety system developed for spaceflight?", "gold_answer_draft": "Low-acid canned food manufacturers.", "gold_evidence_draft": [{"evidence_unit_id": "real_003_batch_03_NASA_Spinoff_2021:p0034:e002", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "page_number": 34, "element_index": 2, "element_type": "para", "bbox": [48, 196, 265, 331], "text": "In 1973, low-acid canned food manufacturers became the first to be subject to HACCP regulations, and they were the only ones for a long time. Then in 1993, an outbreak of food poisoning due to a Shiga tono-producing strain of E. coli bacteria caused the meat and poultry industries to close down. This was a time of economic confidence. Within a decade, the U.S. Department of Agriculture (USDA) had HACCP regulations in place for meat and poultry, and the FDA required the system for all seafood and juice producers. By", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_003_batch_03_NASA_Spinoff_2021/pages/page_0034/output_json/page_0034.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::007", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_004_batch_04_Spinoff2020", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_04_Spinoff2020.pdf", "question": "Which set of body signals had to be integrated into one operational telemetry workflow to assess a crew member during flight?", "gold_answer_draft": "Temperature, ECG heart data, breath cycles, and blood pressure.", "gold_evidence_draft": [{"evidence_unit_id": "real_004_batch_04_Spinoff2020:p0028:e001", "document_id": "real_004_batch_04_Spinoff2020", "page_number": 28, "element_index": 1, "element_type": "para", "bbox": [93, 148, 549, 294], "text": "In the end, the astronauts wore a belt carrying four differ- ent signal conditioners that each captured data from sensors and electrodes attached across the body: an oral probe for temperature, electrodes for ECG (electrocardiogram) heart data and breath cycles, and an inflatable cuff with a sound transducer over an artery for blood pressure.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_004_batch_04_Spinoff2020/pages/page_0028/output_json/page_0028.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::008", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_004_batch_04_Spinoff2020", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_04_Spinoff2020.pdf", "question": "What architectural feature allowed the optical sensing system to improve speed as the number of monitored channels increased?", "gold_answer_draft": "It monitored changes in the ratios of multiple spectral components simultaneously, allowing many sensors to be monitored at once.", "gold_evidence_draft": [{"evidence_unit_id": "real_004_batch_04_Spinoff2020:p0035:e003", "document_id": "real_004_batch_04_Spinoff2020", "page_number": 35, "element_index": 3, "element_type": "para", "bbox": [93, 643, 549, 744], "text": "The ability to monitor multiple sensors simultaneously allows for much faster readings, which is important for detecting, for example, the tiny, rapid vibrations caused by friction with a textured surface.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_004_batch_04_Spinoff2020/pages/page_0035/output_json/page_0035.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::009", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_005_batch_05_Spinoff2019", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_05_Spinoff2019.pdf", "question": "What miniaturization tradeoff separates the most accurate laboratory timekeepers from versions that can fly on a spacecraft?", "gold_answer_draft": "They can fill an entire laboratory, making them too large for a satellite.", "gold_evidence_draft": [{"evidence_unit_id": "real_005_batch_05_Spinoff2019:p0052:e003", "document_id": "real_005_batch_05_Spinoff2019", "page_number": 52, "element_index": 3, "element_type": "para", "bbox": [93, 328, 550, 477], "text": "The best clocks are atomic clocks, and the best atomic clocks currently made “won’t lose a second in the entire life of the observable universe,” says Gregory Heckler, the deputy telecommunications systems manager for NASA’s Tracking and Data Relay Satellites (TDRS) at Goddard Space Flight Center.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_005_batch_05_Spinoff2019/pages/page_0052/output_json/page_0052.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_005_batch_05_Spinoff2019:p0052:e004", "document_id": "real_005_batch_05_Spinoff2019", "page_number": 52, "element_index": 4, "element_type": "para", "bbox": [93, 476, 550, 626], "text": "Unfortunately, those clocks tend to be enormous — filling up an entire laboratory — and so impractical, to say the least, for a satellite. To make a clock small enough to fit on a satellite, scientists are currently able to achieve pretty decent accuracy, good to maybe a second of drift in 30,000 years, but there's still plenty of room to improve.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_005_batch_05_Spinoff2019/pages/page_0052/output_json/page_0052.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::010", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_005_batch_05_Spinoff2019", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_05_Spinoff2019.pdf", "question": "Which elemental signatures were prioritized as biological clues, and what ordering did the investigator give them?", "gold_answer_draft": "Carbon, sulfur, and nitrogen, in that order.", "gold_evidence_draft": [{"evidence_unit_id": "real_005_batch_05_Spinoff2019:p0077:e003", "document_id": "real_005_batch_05_Spinoff2019", "page_number": 77, "element_index": 3, "element_type": "para", "bbox": [93, 279, 550, 478], "text": "The Ames Research Center planetary scientist says his favorite isotopes are those of carbon, sulfur, and nitrogen, in that order, “ because biology does interesting things with them and leaves an isotopic signature. ” For example, he says, the ratio of different isotopes in a carbon sample can reveal whether it's a product of biology. And his favorite compound is water, which carries isotopic evidence of its many phase changes between gas, liquid, and solid.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_005_batch_05_Spinoff2019/pages/page_0077/output_json/page_0077.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::011", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_006_batch_06_Spinoff2018", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_06_Spinoff2018.pdf", "question": "What nondeterminism had to be eliminated before a common data network could carry mission-critical control traffic?", "gold_answer_draft": "It could not guarantee message delivery or transmission time, so messages could interrupt one another, be lost, or be damaged.", "gold_evidence_draft": [{"evidence_unit_id": "real_006_batch_06_Spinoff2018:p0051:e003", "document_id": "real_006_batch_06_Spinoff2018", "page_number": 51, "element_index": 3, "element_type": "para", "bbox": [93, 353, 550, 527], "text": "Until recently, though, Ethernet could never be used for critical systems like the spacecraft avionics responsible for navigation, communication, and other essential functions, because it's imprecise. There's no guarantee how long it will take to transmit a message or even whether it will arrive at its intended destination. Messages can interrupt each other or be lost or damaged.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_006_batch_06_Spinoff2018/pages/page_0051/output_json/page_0051.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::012", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_006_batch_06_Spinoff2018", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_06_Spinoff2018.pdf", "question": "Which reactive chemical species explain why the air-cleaning method can act throughout a space rather than only at a device surface?", "gold_answer_draft": "Hydroxyls, hydrogen peroxide, and superoxides.", "gold_evidence_draft": [{"evidence_unit_id": "real_006_batch_06_Spinoff2018:p0080:e002", "document_id": "real_006_batch_06_Spinoff2018", "page_number": 80, "element_index": 2, "element_type": "para", "bbox": [94, 224, 550, 423], "text": "The oxidizers ActivePure deploys include hydroxyls, hydrogen peroxide, and superoxides, all charged particles that clean air and surfaces but pose no threat to humans or pets. They naturally distribute themselves throughout the air, so the only question is the quantity needed to clean a given space, Urso says, noting that this is why the company offers the technology in different scales and also develops custom solutions for areas of any size.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_006_batch_06_Spinoff2018/pages/page_0080/output_json/page_0080.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::013", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_007_batch_07_Spinoff2017", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_07_Spinoff2017.pdf", "question": "What size-versus-durability compromise made the early rechargeable chemistry attractive for flight applications despite its shorter service life?", "gold_answer_draft": "They were reliable for only about 400–500 shallow discharge cycles, compared with about 10,000 cycles for nickel-cadmium batteries.", "gold_evidence_draft": [{"evidence_unit_id": "real_007_batch_07_Spinoff2017:p0098:e000", "document_id": "real_007_batch_07_Spinoff2017", "page_number": 98, "element_index": 0, "element_type": "para", "bbox": [93, 75, 550, 294], "text": "By 1972 Lewis had tested and proven silver-zinc cells based on a specific inorganic separator and a specially prepared zinc electrode, which were able to function as a rechargeable battery after heat sterilization. The cells were still only reliable up to 400 to 500 shallow discharge cycles, as opposed to the 10,000-cycle life of the nickel-cadmium batteries commonly used in space applications of the time, but they could result in batteries one-third the size of nickel- cadmium units, a substantial saving in weight.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_007_batch_07_Spinoff2017/pages/page_0098/output_json/page_0098.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::014", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_007_batch_07_Spinoff2017", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_07_Spinoff2017.pdf", "question": "Why does distance from terrestrial medical support change the design requirements for diagnostic instruments on exploration missions?", "gold_answer_draft": "Space travel can suppress immunity and make some bacteria more virulent, while a Mars mission would be months from an emergency return or a nearby doctor.", "gold_evidence_draft": [{"evidence_unit_id": "real_007_batch_07_Spinoff2017:p0041:e002", "document_id": "real_007_batch_07_Spinoff2017", "page_number": 41, "element_index": 2, "element_type": "para", "bbox": [93, 201, 551, 452], "text": "NASA astronauts are screened for sound health, among a slew of other requirements, but no one is invulnerable, especially in space. For reasons not fully understood, space travel appears to suppress the human immune system, while some bacteria become heartier and more virulent in microgravity. Meanwhile, aboard the International Space Station, the nearest medi- cal doctor is on the other side of atmospheric reentry. On a future mission to Mars, any emergency return would likely take months.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_007_batch_07_Spinoff2017/pages/page_0041/output_json/page_0041.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::015", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_008_batch_08_Spinoff2016", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_08_Spinoff2016.pdf", "question": "Why is a pressurized chemical energy store attractive when a remote renewable-power site may sit idle for long periods?", "gold_answer_draft": "Pressurized hydrogen can be stored virtually indefinitely without losses, whereas unused alkaline batteries lose energy over time.", "gold_evidence_draft": [{"evidence_unit_id": "real_008_batch_08_Spinoff2016:p0126:e003", "document_id": "real_008_batch_08_Spinoff2016", "page_number": 126, "element_index": 3, "element_type": "para", "bbox": [93, 684, 550, 975], "text": "It's the first electrolyzer to be competitive with bat- teries and even provides some advantages. For example, unused alkaline batteries lose energy over time, whereas a cylinder of pressurized hydrogen gas will keep virtually indefinitely without losses. Batteries also lose energy to heat if power is drawn from them rapidly, which is not the case with hydrogen fuel cells. At telecommunication towers in remote parts of Africa or India, which are often powered by solar energy, batteries have performance issues due to the heat. “ Our panels love heat, ” Guerra says. “ The hotter the electrolyte, the more efficient they get. ”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_008_batch_08_Spinoff2016/pages/page_0126/output_json/page_0126.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::016", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_008_batch_08_Spinoff2016", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_08_Spinoff2016.pdf", "question": "Which pair of physical risks requires a cryogenic propellant system to control both temperature and microscopic leakage?", "gold_answer_draft": "Liquid hydrogen must be kept below −423 °F; leaks are a priority because hydrogen escapes through tiny cracks and is highly flammable.", "gold_evidence_draft": [{"evidence_unit_id": "real_008_batch_08_Spinoff2016:p0073:e003", "document_id": "real_008_batch_08_Spinoff2016", "page_number": 73, "element_index": 3, "element_type": "para", "bbox": [92, 353, 552, 674], "text": "But harnessing that energy requires a great deal of technological know-how on the Agency's part. For one, keeping hydrogen in its liquid state means maintaining it at a temperature below -423 °F. The element must also be insulated from external heat sources during launch, lest it begin to evaporate. Then there's the persistent threat of leakage. As the smallest and lightest of atoms, hydrogen escapes through the tiniest of cracks. That makes it a hazard, as the element is highly flammable, to the point where high-pressure joint leaks can cause combustion. As a result, detecting leaks is a top priority, but it's also a challenge, because the gas — and the flame it emits — are odorless and colorless.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_008_batch_08_Spinoff2016/pages/page_0073/output_json/page_0073.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::017", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_009_batch_09_Spinoff2015", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_09_Spinoff2015.pdf", "question": "What additional biological parameter turns a regional atmospheric water-loss estimate into a decision useful for a particular crop field?", "gold_answer_draft": "A crop coefficient specific to the crop and its growth stage is multiplied by ETo to produce a more refined measurement.", "gold_evidence_draft": [{"evidence_unit_id": "real_009_batch_09_Spinoff2015:p0111:e001", "document_id": "real_009_batch_09_Spinoff2015", "page_number": 111, "element_index": 1, "element_type": "para", "bbox": [93, 214, 550, 532], "text": "As helpful as ETo data is, farmers and irrigators must still perform additional calculations to convert the ETo information into a number specific to their fields and crops. For example, the utility of ETo information is increased when paired with another piece of data called the crop coefficient. Specific to the crop type and its stage of growth, the number, when multiplied by ETo, results in a more refined measurement of evapotranspiration specific to a particular crop and field. As it turns out, in recent years NASA and the US Department of Agriculture (USDA) together were discovering that Landsat and MODIS data could be used to map vegetation conditions and, from that, derive crop coefficients.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_009_batch_09_Spinoff2015/pages/page_0111/output_json/page_0111.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::018", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_009_batch_09_Spinoff2015", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_09_Spinoff2015.pdf", "question": "Why must an underground-water inference workflow remove surface clutter before it combines radar observations with other Earth data?", "gold_answer_draft": "It processes NASA SAR and SIR data with geophysical and geological inputs, then adds NASA Landsat data as a critical input.", "gold_evidence_draft": [{"evidence_unit_id": "real_009_batch_09_Spinoff2015:p0060:e004", "document_id": "real_009_batch_09_Spinoff2015", "page_number": 60, "element_index": 4, "element_type": "para", "bbox": [93, 369, 550, 563], "text": "a proprietary process Gachet developed that removes surface obstacles from NASA SAR data and SIR data without harming the soil wetness signal. In other words, the WATEX processes NASA SAR imagery so that information about groundwater can be inferred without the interference of surface features such as infrastructure, rocks, or vegetation. This process is combined with several other inputs, such as geophysical and geological data.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_009_batch_09_Spinoff2015/pages/page_0060/output_json/page_0060.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_009_batch_09_Spinoff2015:p0060:e005", "document_id": "real_009_batch_09_Spinoff2015", "page_number": 60, "element_index": 5, "element_type": "para", "bbox": [94, 562, 550, 926], "text": "Then there's NASA Landsat satellite data, which is added as a critical input to the WATEX System. Started in 1972, the Landsat program, administered by both NASA and the US Geological Survey, is the longest continuous satellite-based record of the Earth's surface through not only visual imagery but also the near- infrared, short-wave, and thermal infrared bands of the electromagnetic spectrum. By analyzing the time-lapsed imagery, scientists are able to monitor numerous environ- mental conditions, from deforestation to agricultural land use and rates of erosion. For WATEX, Gachet utilized Landsat data to note the chemical signatures of rocks and also discern surface landscapes, which give clues to where water might accumulate by looking at slopes, flood plains and ditches.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_009_batch_09_Spinoff2015/pages/page_0060/output_json/page_0060.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::019", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_010_batch_10_Spinoff2013", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_10_Spinoff2013.pdf", "question": "What institutional resource helped a commercial heat-shield program cope with a scaling problem that an earlier capsule did not face?", "gold_answer_draft": "It could consult NASA engineers with roughly 40–50 years of heat-shield knowledge and experience.", "gold_evidence_draft": [{"evidence_unit_id": "real_010_batch_10_Spinoff2013:p0065:e001", "document_id": "real_010_batch_10_Spinoff2013", "page_number": 65, "element_index": 1, "element_type": "para", "bbox": [93, 459, 550, 728], "text": "Having seen the Stardust capsule's successful reentry, the company was very interested in the choice of PICA as a material for their heat shield. Fortunately, under the provisions of the contract, in addition to financial funding SpaceX also had access to NASA's brain trust of engineers for technical consultation, which the firm made full use of. “The group of people we worked with had basically designed every American heat shield since the Apollo days,” says Andrew Chambers, the company's project lead in this arena. “We were able to tap 40–50 years of knowl- edge and experience, which was absolutely invaluable.”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_010_batch_10_Spinoff2013/pages/page_0065/output_json/page_0065.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::020", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_010_batch_10_Spinoff2013", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_10_Spinoff2013.pdf", "question": "Why did an astronaut-assistance robot need human-compatible manipulation rather than only autonomous mobility?", "gold_answer_draft": "It needed to perform the same tasks as humans and use the same tools astronauts use to service spaceflight hardware.", "gold_evidence_draft": [{"evidence_unit_id": "real_010_batch_10_Spinoff2013:p0075:e002", "document_id": "real_010_batch_10_Spinoff2013", "page_number": 75, "element_index": 2, "element_type": "para", "bbox": [93, 204, 550, 378], "text": "R obonaut 2 flew aboard Space Shuttle Discovery to the International Space Station (ISS) in early 2011, but its development has been many years in the making. In 1997, Johnson Space Center engineers embarked on a mission to build a robot that could perform the same tasks as humans so it could assist astronauts in space.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_010_batch_10_Spinoff2013/pages/page_0075/output_json/page_0075.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_010_batch_10_Spinoff2013:p0075:e003", "document_id": "real_010_batch_10_Spinoff2013", "page_number": 75, "element_index": 3, "element_type": "para", "bbox": [94, 378, 550, 576], "text": "In collaboration with the Defense Advanced Research Projects Agency (DARPA), Johnson aimed to build Robonaut 1—a humanoid robot complete with dexterous manipulation, or a capability to use its hands—to work alongside its human counterparts. In order to lend a help- ing hand, Robonaut needed to be able to use the same tools as astronauts to service space flight hardware, which was designed for human servicing.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_010_batch_10_Spinoff2013/pages/page_0075/output_json/page_0075.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::021", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_011_batch_11_Spinoff2012", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_11_Spinoff2012.pdf", "question": "What combination of motion, sampling limitations, and cost makes conventional aerodynamic sensing poorly suited to spinning rotor blades?", "gold_answer_draft": "They provide measurements only at discrete locations and standard static instrumentation cannot handle a moving rotor; dynamic taps greatly increase cost.", "gold_evidence_draft": [{"evidence_unit_id": "real_011_batch_11_Spinoff2012:p0056:e003", "document_id": "real_011_batch_11_Spinoff2012", "page_number": 56, "element_index": 3, "element_type": "para", "bbox": [93, 354, 550, 577], "text": "All of this makes acquiring a true understanding of rotorcraft aerodynamics a difficult task. A traditional means of acquiring aerodynamic data is to conduct wind tunnel tests using a vehicle model outfitted with pressure taps and other sensors. These sensors add significant costs to wind tunnel testing while only providing measurements at discrete locations on the model's surface. In addition, standard sensor solutions do not work for pulling data from a rotor in motion.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_011_batch_11_Spinoff2012/pages/page_0056/output_json/page_0056.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_011_batch_11_Spinoff2012:p0056:e004", "document_id": "real_011_batch_11_Spinoff2012", "page_number": 56, "element_index": 4, "element_type": "para", "bbox": [93, 577, 550, 800], "text": "“Typical static pressure instrumentation can’t handle that,” explains Neal Watkins, electronics engineer in Langley Research Center’s Advanced Sensing and Optical Measurement Branch. “There are dynamic pressure taps, but your costs go up by a factor of five to ten if you use those. In addition, recovery of the pressure tap readings is accomplished through slip rings, which allow only a limited amount of sensors and can require significant maintenance throughout a typical rotor test.”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_011_batch_11_Spinoff2012/pages/page_0056/output_json/page_0056.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::022", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_011_batch_11_Spinoff2012", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_11_Spinoff2012.pdf", "question": "What capture-and-computation workflow allowed a rover imaging system to produce panoramas far beyond the native sensor resolution?", "gold_answer_draft": "A NASA-built automated tripod and photo-processing software combined a series of smaller shots into a large image.", "gold_evidence_draft": [{"evidence_unit_id": "real_011_batch_11_Spinoff2012:p0088:e003", "document_id": "real_011_batch_11_Spinoff2012", "page_number": 88, "element_index": 3, "element_type": "para", "bbox": [93, 380, 549, 528], "text": "While the rovers each took a mere 1 megapixel camera for the journey, the pictures they have become famous for measure up to 96 megapixels in size. This was made pos- sible by a NASA-built automated tripod, which with the help of photo processing software seamlessly integrates a series of smaller shots into one large image.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_011_batch_11_Spinoff2012/pages/page_0088/output_json/page_0088.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::023", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_012_batch_12_Spinoff2011", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_12_Spinoff2011.pdf", "question": "Which two commercial aircraft marked the transition from experimental electronic flight control to mainstream airline adoption, and in what sequence?", "gold_answer_draft": "The Airbus 320 in 1987 and Boeing's 777 in 1994.", "gold_evidence_draft": [{"evidence_unit_id": "real_012_batch_12_Spinoff2011:p0079:e003", "document_id": "real_012_batch_12_Spinoff2011", "page_number": 79, "element_index": 3, "element_type": "para", "bbox": [93, 461, 550, 779], "text": "The first commercial airliner to fly with DFBW was the Airbus 320 in 1987, followed by Boeing's 777 in 1994. Today, the technology features in a number of aircraft from both manufacturers. For commercial air- craft, the technology replaces heavy mechanical systems, allowing airlines to benefit from greater fuel efficiency or carry more passengers and cargo. The heightened responsiveness of DFBW-enabled aircraft allows pilots to provide a smoother flight, and the system's redundan- cies help ensure safe operation of the vehicle. Mechanical maintenance needs are also reduced, saving costs and time spent on upkeep and repairs of the mechanical systems and reducing the chance of failures.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_012_batch_12_Spinoff2011/pages/page_0079/output_json/page_0079.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::024", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_012_batch_12_Spinoff2011", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_12_Spinoff2011.pdf", "question": "Which nanoscale conductor is proposed for solar cells because it combines extreme thinness with unusual electrical, thermal, and mechanical properties?", "gold_answer_draft": "A carbon nanotube.", "gold_evidence_draft": [{"evidence_unit_id": "real_012_batch_12_Spinoff2011:p0150:e003", "document_id": "real_012_batch_12_Spinoff2011", "page_number": 150, "element_index": 3, "element_type": "para", "bbox": [93, 474, 550, 646], "text": "To build upon existing photovoltaic technology, NASA's Glenn Research Center has worked on a variety of innovative designs and materials to incorporate into photovoltaic cells, the building blocks of solar power sys- tems. One of these materials is the carbon nanotube—a tiny structure about 50,000 times finer than the average human hair, with notably high electrical and thermal con-", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_012_batch_12_Spinoff2011/pages/page_0150/output_json/page_0150.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::025", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_013_batch_13_Spinoff2010", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_13_Spinoff2010.pdf", "question": "What makes the subscale testbed experimentally different from a simulator even though both are used to develop flight-control methods?", "gold_answer_draft": "Its subscale vehicle actually flies as a remotely piloted aircraft and communicates with display and control computers through a high-bandwidth telemetry link.", "gold_evidence_draft": [{"evidence_unit_id": "real_013_batch_13_Spinoff2010:p0162:e000", "document_id": "real_013_batch_13_Spinoff2010", "page_number": 162, "element_index": 0, "element_type": "para", "bbox": [93, 164, 549, 240], "text": "The difference between AirSTAR and a flight simula- tor is that in AirSTAR, the vehicle is actually flying as a remotely piloted aircraft communicating with display and", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_013_batch_13_Spinoff2010/pages/page_0162/output_json/page_0162.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::026", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_013_batch_13_Spinoff2010", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_13_Spinoff2010.pdf", "question": "What paired observational result supports interpreting the Maryland phenology shift as a broader environmental change rather than isolated beekeeper anecdotes?", "gold_answer_draft": "It came about a half-day earlier each year on average and had shifted about a month earlier since the 1970s.", "gold_evidence_draft": [{"evidence_unit_id": "real_013_batch_13_Spinoff2010:p0202:e000", "document_id": "real_013_batch_13_Spinoff2010", "page_number": 202, "element_index": 0, "element_type": "para", "bbox": [93, 164, 551, 339], "text": "Data from the network, when combined with additional data that reach back to the 1920s, indicate that the timing of spring nectar flows have undergone extraordinary changes. “Each year, the nectar flow comes about a half-day earlier on average,” said Esaias. “In total, since the 1970s, it has moved forward by about month in Maryland.”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_013_batch_13_Spinoff2010/pages/page_0202/output_json/page_0202.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::027", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_01_NASA-Spinoff-2023.pdf", "question": "What design logic connects life support for an orbiting crew with a method for local food autonomy?", "gold_answer_draft": "CELS treated plants as part of a closed loop that recycled waste into food and oxygen; its results helped give rise to controlled-environment agriculture for self-reliant communities.", "gold_evidence_draft": [{"evidence_unit_id": "real_001_batch_01_NASA-Spinoff-2023:p0007:e005", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "page_number": 7, "element_index": 5, "element_type": "para", "bbox": [298, 196, 732, 245], "text": "NASA has worked for decades to develop a life-support system that functions as a self-replenishing ecology. At the heart of this work was the Controlled Ecological Life Support System (CELS) program, which ran for about 25 years, between the late 1970s and early 2000s, at NASA's Kennedy Space Center in Florida. It relied especially on plants, which recycle waste into food and oxygen.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_001_batch_01_NASA-Spinoff-2023/pages/page_0007/output_json/page_0007.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_001_batch_01_NASA-Spinoff-2023:p0007:e006", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "page_number": 7, "element_index": 6, "element_type": "para", "bbox": [298, 251, 731, 300], "text": "The project's results, published in hundreds of papers over the years, have given rise to the controlled environment agriculture movement (Spinet 2021). But Womack wanted to apply the findings to something closer. NASA's goal is – a closed-loop, self-sustaining life-support system that would enable self-reliance for families, homesteaders, and communities.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_001_batch_01_NASA-Spinoff-2023/pages/page_0007/output_json/page_0007.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::028", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_01_NASA-Spinoff-2023.pdf", "question": "Why does using hydrogen as an aviation fuel create both an emissions advantage and a storage-engineering challenge?", "gold_answer_draft": "Hydrogen produces no carbon emissions and has high energy per pound, but its low boiling point means it must be kept extremely cold or at high pressure in a strong tank.", "gold_evidence_draft": [{"evidence_unit_id": "real_001_batch_01_NASA-Spinoff-2023:p0009:e006", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "page_number": 9, "element_index": 6, "element_type": "para", "bbox": [344, 184, 731, 245], "text": "Replacing jet fuel with hydrogen would be good for business and the environment. Hydrogen generates no carbon emissions and packs three times the energy per pound of hydrocarbon. It's a cleaner, more cost-effective, and more environmentally friendly fuel than fossil fuels, can't safely hold hydrogen. A solution is the carbo-fibrilled Hybrid Laminar (HHL) cryotank developed by Glycer-Taylor Laboratories (GT) Inc. of Tulsa, Tennessee.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_001_batch_01_NASA-Spinoff-2023/pages/page_0009/output_json/page_0009.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_001_batch_01_NASA-Spinoff-2023:p0009:e007", "document_id": "real_001_batch_01_NASA-Spinoff-2023", "page_number": 9, "element_index": 7, "element_type": "para", "bbox": [344, 252, 731, 312], "text": "While NASA is testing it to carry liquid oxygen into space, a commercial airline is interested in the fact that the BHL could ultra-cold fuels without developing the micromicrols that they believe are so essential for certain propellant tanks. Hydrogen has one of the lowest boiling points of any element on Earth and its burning gas form must be kept extremely cold, or it needs to be kept under remarkably high pressure.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_001_batch_01_NASA-Spinoff-2023/pages/page_0009/output_json/page_0009.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::029", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_002_batch_02_Spinoff.2022", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_02_Spinoff.2022.pdf", "question": "What agricultural pressures make controlled-environment farming a long-term response rather than merely an efficiency improvement?", "gold_answer_draft": "The article projects 2.3 billion additional people by 2050, largely in cities, while conventional agriculture can deplete nutrients and contaminate water and soil; controlled environments address resource reuse and chemical dependence.", "gold_evidence_draft": [{"evidence_unit_id": "real_002_batch_02_Spinoff.2022:p0017:e003", "document_id": "real_002_batch_02_Spinoff.2022", "page_number": 17, "element_index": 3, "element_type": "para", "bbox": [279, 166, 491, 264], "text": "The United Nations predicts Earth will have to feed another 2.3 billion people by the year 2050, with most concentrated in urban centers far from farmland. Current agriculture may not have the capacity to feed that many people, and it threatens future production by depleting soil of essential nutrients and contaminating freshwater supplies and soil with pesticides and herbicides.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_002_batch_02_Spinoff.2022/pages/page_0017/output_json/page_0017.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::030", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_002_batch_02_Spinoff.2022", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_02_Spinoff.2022.pdf", "question": "During an irreversible celestial rendezvous, what metrological capability makes a navigation decision trustworthy?", "gold_answer_draft": "Their extremely steady atomic oscillations provide the timing accuracy needed by the Deep Space Network to navigate to the right time and place; a missed Jupiter flyby could waste the entire mission investment.", "gold_evidence_draft": [{"evidence_unit_id": "real_002_batch_02_Spinoff.2022:p0031:e005", "document_id": "real_002_batch_02_Spinoff.2022", "page_number": 31, "element_index": 5, "element_type": "para", "bbox": [270, 223, 494, 333], "text": "\"If you've been flying for six years, and you have just one chance for a Jupiter flyby, and you don't get there at the right time and place, the entire investment you've made is essentially gone,\"\" explained Luke Malek, former researcher at NASA's Jet Propulsion Laboratory in Southern California. \"Over time, you can't allow you to successfully navigate to your target, and be sure they're extremely important.\"", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_002_batch_02_Spinoff.2022/pages/page_0031/output_json/page_0031.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_002_batch_02_Spinoff.2022:p0031:e007", "document_id": "real_002_batch_02_Spinoff.2022", "page_number": 31, "element_index": 7, "element_type": "para", "bbox": [270, 407, 487, 493], "text": "NASA Deep Space Network (DSN), a sort of GPS system for space, relies on atomic clocks for extreme accuracy. Any modern navigation system must accurately time radio signals to triangulate a measurement, but the time for accuracy is even higher in space, where great distances can compound even tiny errors.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_002_batch_02_Spinoff.2022/pages/page_0031/output_json/page_0031.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::031", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_03_NASA_Spinoff_2021.pdf", "question": "How did HACCP move from a NASA-developed safety approach to broad food-industry regulation?", "gold_answer_draft": "After its 1971 presentation and FDA training, low-acid canned food makers were regulated in 1973; following the 1993 E. coli outbreak, USDA rules covered meat and poultry and FDA requirements expanded to seafood and juice.", "gold_evidence_draft": [{"evidence_unit_id": "real_003_batch_03_NASA_Spinoff_2021:p0034:e001", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "page_number": 34, "element_index": 1, "element_type": "para", "bbox": [49, 67, 270, 189], "text": "The company presented HACCP to the world at the first National Conference on Food Protection in 1971. It was not immediately embraced, but after being questioned by the committee of inquiry about that summer, the National Canners Association petitioned the Food and Drug Administration (FDA) for regulations to prevent food poisoning. The FDA in turn asked Pilsbury to train its supervisors and food inspectors so that system it had developed for NASA.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_003_batch_03_NASA_Spinoff_2021/pages/page_0034/output_json/page_0034.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_003_batch_03_NASA_Spinoff_2021:p0034:e002", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "page_number": 34, "element_index": 2, "element_type": "para", "bbox": [48, 196, 265, 331], "text": "In 1973, low-acid canned food manufacturers became the first to be subject to HACCP regulations, and they were the only ones for a long time. Then in 1993, an outbreak of food poisoning due to a Shiga tono-producing strain of E. coli bacteria caused the meat and poultry industries to close down. This was a time of economic confidence. Within a decade, the U.S. Department of Agriculture (USDA) had HACCP regulations in place for meat and poultry, and the FDA required the system for all seafood and juice producers. By", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_003_batch_03_NASA_Spinoff_2021/pages/page_0034/output_json/page_0034.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::032", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_03_NASA_Spinoff_2021.pdf", "question": "By what charge-based mechanism can the Apollo-era purification approach disable microbes?", "gold_answer_draft": "Positively charged silver ions bind to and disrupt negatively charged microbial cell membranes before entering the cells, which is why NASA commissioned an electrolytic silver-ion generator for Apollo water purification.", "gold_evidence_draft": [{"evidence_unit_id": "real_003_batch_03_NASA_Spinoff_2021:p0024:e003", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "page_number": 24, "element_index": 3, "element_type": "para", "bbox": [49, 200, 265, 300], "text": "The ancients, of course, had no idea how it worked – that when positively charged silver ions dissolve into water or other substances, they bond with and disrupt the negatively charged cell membranes of bacteria and other microorganisms before entering them and wreaking general havoc. But as understanding has improved, so has technology for delivering the ions.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_003_batch_03_NASA_Spinoff_2021/pages/page_0024/output_json/page_0024.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_003_batch_03_NASA_Spinoff_2021:p0024:e004", "document_id": "real_003_batch_03_NASA_Spinoff_2021", "page_number": 24, "element_index": 4, "element_type": "para", "bbox": [49, 305, 257, 380], "text": "In the 1960s, Johnson, then known as the Manned Spacecraft Center, commissioned an electrolytic silver ion generator to purify water on the Apollo missions. The following decade, in the run-up to the space shuttle missions, the center sponsored a more advanced prototype.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_003_batch_03_NASA_Spinoff_2021/pages/page_0024/output_json/page_0024.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::033", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_004_batch_04_Spinoff2020", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_04_Spinoff2020.pdf", "question": "How did the astronaut monitoring design combine multiple body measurements with mission operations rather than merely recording medical data?", "gold_answer_draft": "Separate conditioners captured temperature, ECG, breathing, and blood pressure, then fed the signals to onboard telemetry so ground stations could assess condition during flight and plan later missions.", "gold_evidence_draft": [{"evidence_unit_id": "real_004_batch_04_Spinoff2020:p0028:e001", "document_id": "real_004_batch_04_Spinoff2020", "page_number": 28, "element_index": 1, "element_type": "para", "bbox": [93, 148, 549, 294], "text": "In the end, the astronauts wore a belt carrying four differ- ent signal conditioners that each captured data from sensors and electrodes attached across the body: an oral probe for temperature, electrodes for ECG (electrocardiogram) heart data and breath cycles, and an inflatable cuff with a sound transducer over an artery for blood pressure.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_004_batch_04_Spinoff2020/pages/page_0028/output_json/page_0028.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_004_batch_04_Spinoff2020:p0028:e002", "document_id": "real_004_batch_04_Spinoff2020", "page_number": 28, "element_index": 2, "element_type": "para", "bbox": [93, 294, 549, 414], "text": "Then the data was fed directly into the onboard telemetry system, explains the article. For the first time ever, “ ground monitoring stations receive the telemetered signals during flight. These signals are used to assess the physiological condition of the astronaut. ”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_004_batch_04_Spinoff2020/pages/page_0028/output_json/page_0028.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::034", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_004_batch_04_Spinoff2020", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_04_Spinoff2020.pdf", "question": "Why was a helium-neon metrology laser unsuitable for a long-lived satellite instrument, and what lifetime target drove the replacement?", "gold_answer_draft": "A vacuum makes helium difficult to contain and helium-neon lasers last only three to four years, far short of the 10–15 year satellite lifetime expected for CrIS.", "gold_evidence_draft": [{"evidence_unit_id": "real_004_batch_04_Spinoff2020:p0117:e004", "document_id": "real_004_batch_04_Spinoff2020", "page_number": 117, "element_index": 4, "element_type": "para", "bbox": [94, 747, 550, 946], "text": "“ On industrial systems, we used to use a helium-neon laser. Essentially, that's a tube with gas inside, and by applying a high voltage, it creates a laser signal,\" Soucy says. But that wouldn't work in space for a variety of reasons. For one, in the vacuum of space, it is difficult to contain the helium. For another, the lifespan of these lasers is only about three to four years — far too short for a satellite expected to last 10 to 15 years.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_004_batch_04_Spinoff2020/pages/page_0117/output_json/page_0117.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::035", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_005_batch_05_Spinoff2019", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_05_Spinoff2019.pdf", "question": "How does shrinking a time standard alter the tradeoff between precision and physical footprint?", "gold_answer_draft": "The best clocks may not lose a second over the observable universe's lifetime but fill a laboratory, whereas satellite-sized clocks accept roughly a second of drift in 30,000 years to fit on a spacecraft.", "gold_evidence_draft": [{"evidence_unit_id": "real_005_batch_05_Spinoff2019:p0052:e003", "document_id": "real_005_batch_05_Spinoff2019", "page_number": 52, "element_index": 3, "element_type": "para", "bbox": [93, 328, 550, 477], "text": "The best clocks are atomic clocks, and the best atomic clocks currently made “won’t lose a second in the entire life of the observable universe,” says Gregory Heckler, the deputy telecommunications systems manager for NASA’s Tracking and Data Relay Satellites (TDRS) at Goddard Space Flight Center.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_005_batch_05_Spinoff2019/pages/page_0052/output_json/page_0052.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_005_batch_05_Spinoff2019:p0052:e004", "document_id": "real_005_batch_05_Spinoff2019", "page_number": 52, "element_index": 4, "element_type": "para", "bbox": [93, 476, 550, 626], "text": "Unfortunately, those clocks tend to be enormous — filling up an entire laboratory — and so impractical, to say the least, for a satellite. To make a clock small enough to fit on a satellite, scientists are currently able to achieve pretty decent accuracy, good to maybe a second of drift in 30,000 years, but there's still plenty of room to improve.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_005_batch_05_Spinoff2019/pages/page_0052/output_json/page_0052.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::036", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_005_batch_05_Spinoff2019", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_05_Spinoff2019.pdf", "question": "How did the revised mass-spectrometer detector reduce signal degradation compared with earlier designs?", "gold_answer_draft": "A metal-oxide-coated silicon pixel directly received ion charge, avoiding the multiple ion-to-electron-to-photon conversions that added noise and blurred the beam focus.", "gold_evidence_draft": [{"evidence_unit_id": "real_005_batch_05_Spinoff2019:p0152:e003", "document_id": "real_005_batch_05_Spinoff2019", "page_number": 152, "element_index": 3, "element_type": "para", "bbox": [93, 487, 549, 681], "text": "Working together, Wadsworth and Sinha came up with a simpler design. By coating each silicon pixel with a tough, conductive coating of metal oxide, they could make the CCD blind to light but able to directly receive a charge from an ion striking the sensor. The device would be enabled by some of the refined circuitry and strong separation between pixels that Wadsworth had developed for Mars rover cameras.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_005_batch_05_Spinoff2019/pages/page_0152/output_json/page_0152.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_005_batch_05_Spinoff2019:p0152:e002", "document_id": "real_005_batch_05_Spinoff2019", "page_number": 152, "element_index": 2, "element_type": "para", "bbox": [93, 318, 549, 487], "text": "Sinha had helped develop a mass spectrometer that used a CCD array in its focal plane—much easier to use than predecessors that had camera film in their focal planes—but it was complex and required high voltage. It essentially con- verted ions to electrons to photons, then back to electrons and finally to a digital signal, and every conversion added noise to the signal and blurred the focus of the ion beam.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work
