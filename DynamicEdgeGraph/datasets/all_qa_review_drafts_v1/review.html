source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/experiments/dolphin_v2_pilot/work/relation_first_fresh/images/relation_CyberPhysicalModelingChapter4_page_0006.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_5/hybrid/shard_0/CyberPhysicalModelingChapter4/page_0006/evidence_nodes.jsonl", "source_atom_ids": ["A_003"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "provenance_warning": "Legacy original PDFs were not uniformly verified; review against preserved page image and node text.", "reviewer_decision": null, "reviewer_notes": null, "corpus": "node_vqa_reuse_v1_20261113", "answer_status": "candidate_gold_requires_human_rewrite_and_approval"}, {"draft_id": "legacy_qa_review_v1::006", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "DLRmagazine_176_EN", "document_title": "DLRmagazine_176_EN", "question": "What substantive claim, mechanism, or result does the selected passage establish about DLRmagazine_176_EN? Include any condition that limits the claim.", "gold_answer_draft": "This ship was the target of a combined jamming and spoofing attack. In a jamming attack, global navigation satellite system (GNSS) signals are submerged by an interfering signal. This prevents a standard navigation receiver from detecting them, meaning it is unable to determine a position. Tech- nically, such interference is relatively simple to carry out. Since navigation satellites are over 20,000 kilometres from Earth, GNSS signals are quite weak. As a result, small, portable jammers can easily block these signals within a radius of a few kilometres. Although the trade and use of such devices are prohibited, they are regularly seized by police and customs officials. For large-scale disruptions, however, more powerful equipment is required, which is not easily available commercially and is likely employed by state players. Spoofing, on the other hand, involves transmitting deceptive signals that appear to a receiver to be genuine satellite signals but actually generate false position and time information. This type of attack is much more technically demanding.", "gold_evidence_draft": [{"evidence_unit_id": "DLRmagazine_176_EN_page_0009_HY_004", "document_id": "DLRmagazine_176_EN", "page_id": "page_0009", "element_type": "TEXT", "bbox": [[923, 549, 1163, 853]], "text": "This ship was the target of a combined jamming and spoofing attack. In a jamming attack, global navigation satellite system (GNSS) signals are submerged by an interfering signal. This prevents a standard navigation receiver from detecting them, meaning it is unable to determine a position. Tech- nically, such interference is relatively simple to carry out. Since navigation satellites are over 20,000 kilometres from Earth, GNSS signals are quite weak. As a result, small, portable jammers can easily block these signals within a radius of a few kilometres. Although the trade and use of such devices are prohibited, they are regularly seized by police and customs officials. For large-scale disruptions, however, more powerful equipment is required, which is not easily available commercially and is likely employed by state players. Spoofing, on the other hand, involves transmitting deceptive signals that appear to a receiver to be genuine satellite signals but actually generate false position and time information. This type of attack is much more technically demanding.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/EvidenceNet/output/composite_evidence_pilot_v3_recomposed_components/DLRmagazine_176_EN/page_0009/original.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_6/hybrid/shard_0/ d_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "provenance_warning": "Legacy original PDFs were not uniformly verified; review against preserved page image and node text.", "reviewer_decision": null, "reviewer_notes": null, "corpus": "node_vqa_reuse_v1_20261113", "answer_status": "candidate_gold_requires_human_rewrite_and_approval"}, {"draft_id": "legacy_qa_review_v1::008", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "IDU-41f597b3-c201-4fa7-8cac-466610c36a27", "document_title": "IDU-41f597b3-c201-4fa7-8cac-466610c36a27", "question": "What substantive claim, mechanism, or result does the selected passage establish about IDU-41f597b3-c201-4fa7-8cac-466610c36a27? Include any condition that limits the claim.", "gold_answer_draft": "In this paper, we make the case that growth regressions can provide policy-relevant insights into a country's growth performance, even if they only provide descriptive correlations. Such correlations tell what policy-relevant changes in key macroeconomic variables countries typically experience in their growth process. This allows for a quantitative assessment of how special or representative the policy mix of a country's growth performance is. For example, if typical growth correlates can explain a country's growth performance well, this suggests that key macroeconomic variables move in line with the experience of other growing economies. Even in this case, the policy mix of this country may still be unique (see the Ethiopia case study in Moller and Wacker, 2017) . Conversely, if typical growth correlates cannot explain a country's performance well, this can be insightful in its own way. Can we learn something new for growth theory from this country? Or has the country just had “ good luck ” ? Obtaining quantitative assessments of successful policy mixes is particularly useful today as growth policies may face trade-offs with climate goals (Haberl et al., 2020; Wollburg et al., 2023) .", "gold_eviden s substantial fortune gave her the resources to build a grand house, which she named Linden Hall after the linden trees that lined the drive on the property (fig. 7 ). She did not follow the example of her economic peers in the Pittsburgh area who were constructing country homes just outside the city. Rather, she followed in the footsteps of her father-in-law, who believed pas- ionately in living in the place where he grew up and from where he derived his wealth. James Cochran had not only owned and operated hundreds of coke ovens in the area, but he had also owned the Dawson Cemetery, founded the local bank, and built Dawson's main bridge. Sarah furthered those principles of local com- mitment through extensive philanthropy to Dawson and the surrounding areas.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/output/deepseekocr2_split_render/Luminous Garden Agnes Northrop and the Women of Tiffany Studios/page_0014/page.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_3/hybrid/shard_1/Luminous Garden Agnes Northrop and the Women of Tiffany Studios/page_0014/evidence_nodes.jsonl", "source_atom_ids": ["A_007"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "provenance_warning": "Legacy original PDFs were not uniformly verified; review against preserved page image and node text.", "reviewer_decision": null, "reviewer_notes": null, "corpus": "node_vqa_reuse_v1_20261113", "answer_status": "candidate_gold_requires_human_rewrite_and_approval"}, {"draft_id": "legacy_qa_review_v1::010", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "ML1_11_Reinforcement_Learning_1", "document_title": "ML1_11_Reinforcement_Learning_1", "question": "What substantive claim, mechanism, or result does the selected passage establish about ML1_11_Reinforcement_Learning_1? Include any condition that limits the claim.", "gold_answer_draft": "■ Learning process is active instead of passive – No fixed dataset, data/experience is collected by interacting with the environment. ■ No supervision, just a reward signal ■ Interactions are often sequential – Future decisions may depend on previous ones. ■ We can learn optimal behavior without examples of optimal behavior.", "gold_evidence_draft": [{"evidence_unit_id": "ML1_11_Reinforcement_Learning_1_page_0006_HY_004", "document_id": "ML1_11_Reinforcement_Learning_1", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[109.0, 453.0, 1506.0, 763.0]], "text": "■ Learning process is active instead of passive – No fixed dataset, data/experience is collected by interacting with the environment. ■ No supervision, just a reward signal ■ Interactions are often sequential – Future decisions may depend on previous ones. ■ We can learn optimal behavior without examples of optimal behavior.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/experiments/dolphin_v2_pilot/work/relation_first_fresh/images/relation_ML1_11_Reinforcement_Learning_1_page_0006.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_5/hybrid/shard_1/ML1_11_Reinforcement_Learning_1/page_0006/evidence_nodes.jsonl", "source_atom_ids": ["A_006"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "provenance_warning": "Legacy original PDFs were not uniformly verified; review against preserved page image and node text.", "reviewer_decision": null, "reviewer_notes": null, "corpus": "node_vqa_reuse_v1_20261113", "answer_status": "candidate_gold_requires_human_rewrite_and_approval"}, {"draft_id": "legacy_qa_review_v1::011", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "arxiv_1508_02357", "document_title": "arxiv_1508_02357", "question": "What substantive claim, mechanism, or result does the selected passage establish about arxiv_1508_02357? Include any condition that limits the claim.", "gold_answer_draft": "Triggers generated by matched filtering the data against the template bank are subject to a chi-squared test that determines if the time-frequency distribution of power in the data is consistent with the expected power in the matching template waveform [16] . To construct this test, the template is split into $p$ frequency bins. These bins are constructed so that each contributes an equal amount of power to the total matched-filter SNR. The matched-filter SNR, $\\rho_i$ , is constructed for each of these $p$ bins. For a real signal, $\\rho_i$ should contain $1/p$ of the total power. The $\\chi^2$ statistic compares the expected to the measured power in each bin according to $$\\chi ^ { 2 } = p \\sum _ { i = 1 } ^ { p } \\left[ \\left( \\frac { \\rho _ { c o s } ^ { 2 } } { p } - \\rho _ { c o s , i } ^ { 2 } \\right) ^ { 2 } + \\left( \\frac { \\rho _ { s i n } ^ { 2 } } { p } - \\rho _ { s i n , i } ^ { 2 } \\right) ^ { 2 } \\right] , \\quad( 5 )$$ where $\\rho^2_{\\rm cos}$ and $\\rho^2_{\\rm sin}$ are the SNRs of the two orthogonal phases of the matched filter. Lower-mass binary systems, such as binary neutron stars, lose energy to gravitational waves more slowly than higher-mass systems. Consequently, the waveforms of lower mass systems are longer, having more gravitational-wave cycles in the sensitive band of the detector. The PyCBC pipeline allows the number of bins to be specified as a function of the intrinsic parameters of the template. This allows the search to use more bins in the chi-squared test for longer templates, making the test more effective. In previous analyses, the chi-squared test was the most computationally costly part of the pipeline [18] . The PyCBC pipeline uses a more efficient algorithm for computing the chi-squared statistic, which vastly reduces the computational cost. Details of the chi-squared test are given in Section 3.4 .", "gold_evidence_draft": [{"evidence_unit_id": "arxiv_1508_02357_page_0006_HY_002", "document_id": "arxiv_1508_02357", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[140.0, 307.0, 1048.0, 565.0], [338.0, 581.0, 1044.0, 661.0], [140.0, 678.0, 1048.0, 1033.0]], "text": "Triggers generated by matched filtering the data against the template bank are subject to a chi-squared test that determines if the time-frequency distribution of power in the data is consistent with the expected power in the matching template waveform [16] . To construct this test, the template is split into $p$ frequency bins. These bins are constructed so that each contributes an equal amount of power to the total matched-filter SNR. The matched-filter SNR, $\\rho_i$ , is constructed for each of these $p$ bins. For a real signal, $\\rho_i$ should contain $1/p$ of the total power. The $\\chi^2$ statistic compares the expected to the measured power in each bin according to $$\\chi ^ { 2 } = p \\sum _ { i = 1 } ^ { p } \\left[ \\left( \\frac { \\rho _ { c o s } ^ { 2 } } { p } - \\rho _ { c o s , i } ^ { 2 } \\right) ^ { 2 } + \\left( \\frac { \\rho _ { s i n } ^ { 2 } } { p } - \\rho _ { s i n , i } ^ { 2 } \\right) ^ { 2 } \\right] , \\quad( 5 )$$ where $\\rho^2_{\\rm cos}$ and $\\rho^2_{\\rm sin}$ are the SNRs of the two orthogonal phases of the matched filter. Lower-mass binary systems, such as binary neutron stars, lose energy to gravitational waves more slowly than higher-mass systems. Consequently, the waveforms of lower mass systems are longer, having more gravitational-wave cycles in the sensitive band of the detector. The PyCBC pipeline allows the number of bins to be specified as a function of the intrinsic parameters of the template. This allows the search to use more bins in the chi-squared test for longer templates, making the test more effective. In previous analyses, the chi-squared test was the most computationally costly part of the pipeline [18] . The PyCBC pipeline uses a more efficient algorithm for computing the chi-squared statistic, which vastly reduces the computational cost. Details of the chi-squared test are given in Section 3.4 .", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/experiments/dolphin_v2_pilot/work/relation_first_fresh/images/relation_arxiv_1508_02357_page_0006.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_4/hybrid/shard_1/arxiv_1508_02357/page_0006/evidence_nodes.jsonl", "source_atom_ids": ["A_004", "A_005", "A_006"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "provenance_warning": "Legacy original PDFs were not uniformly verified; review against preserved page image and node text.", "reviewer_decision": null, "reviewer_notes": null, "corpus": "node_vqa_reuse_v1_20261113", "answer_status": "candidate_gold_requires_human_rewrite_and_approval"}, {"draft_id": "legacy_qa_review_v1::012", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "arxiv_1510_04615", "document_title": "arxiv_1510_04615", "question": "What substantive claim, mechanism, or result does the selected passage establish about arxiv_1510_04615? Include any condition that limits the claim.", "gold_answer_draft": "In Figure 1 and Table B3 we present the dependence of the merger rate density on the calculational method (method I, II, and III). For this exercise we have used one specific population synthesis model, so as to highlight the differences in our merger rate density calculations. In methods II and III we employ the evolutionary model V2 with low metallicity enrichment; this model utilizes re- stricted CE survival (see Sec. 3 ). In method I we use the same evolutionary model V2, but the metallicity evo- lution treatment is oversimplified. Additionally, in this case no merger redshift information is available, so only the intrinsic total merger masses are used. Obviously, if we assume — as we have — a constant comoving density of Milky Way-like galaxies (see eq. 1 ), we can draw from a random distribution of redshifts. However this modifica- tion is not applied to our calculations, as our intent is to emphasize the differences between the methods that use (or do not use) redshift information about the merg- ers. We find strikingly large differences between method I and the other two methods of merger rate density calcu- lation. For comparison we also include the expected ad- vanced LIGO/Virgo upper limits (see Sec. 4.2 ). We note that this curve represents the upper limits resulting from non-detection. When comparing these limits to the pre- dicted rates, there are two relevant points of comparison: the overall rate, and the mass distribution. Places where the predictions overlap significantly with the upper limit curve indicate that the models predict detections. In these cases, the predicted event rate of BH-BH mergers across all mass bins would be inconsistent with an absence of de- tections in advanced LIGO (as represented by the upper limit curve). In addition, by comparing the shape of the upper limit curve to the shape of the predictions, we are provided with a visual indication of how the mass selec- tion effects of the instruments impacts the predicted mass distributions of sources.", "gold_evidence_draft": [{"evidence_unit_id": "arxiv_1510_04615_page_0006_HY_007", "document_id": "arxiv_1510_04615", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[89.0, 1365.0, 603.0, 1500.0], [644.0, 98.0, 1159.0, 765.0]], "text": "In Figure 1 and Table B3 we present the dependence of the merger rate density on the calculational method (method I, II, and III). For this exercise we have used one specific population synthesis model, so as to highlight the differences in our merger rate density calculations. In methods II and III we employ the evolutionary model V2 with low metallicity enrichment; this model utilizes re- stricted CE survival (see Sec. 3 ). In method I we use the same evolutionary model V2, but the metallicity evo- lution treatment is oversimplified. Additionally, in this case no merger redshift information is available, so only the intrinsic total merger masses are used. Obviously, if we assume — as we have — a constant comoving density of Milky Way-like galaxies (see eq. 1 ), we can draw from a random distribution of redshifts. However this modifica- tion is not applied to our calculations, as our intent is to emphasize the differences between the methods that use (or do not use) redshift information about the merg- ers. We find strikingly large differences between method I and the other two methods of merger rate density calcu- lation. For comparison we also include the expected ad- vanced LIGO/Virgo upper limits (see Sec. 4.2 ). We note that this curve represents the upper limits resulting from non-detection. When comparing these limits to the pre- dicted rates, there are two relevant points of comparison: the overall rate, and the mass distribution. Places where the predictions overlap significantly with the upper limit curve indicate that the models predict detections. In these cases, the predicted event rate of BH-BH mergers across all mass bins would be inconsistent with an absence of de- tections in advanced LIGO (as represented by the upper limit curve). In addition, by comparing the shape of the upper limit curve to the shape of the predictions, we are provided with a visual indication of how the mass selec- tion effects of the instruments impacts the predicted mass distributions of sources.", "source_page_image": there is an underlying structure between elements (i.e., near-identical boxes). The first difficulty in these tasks is to avoid near-duplicates. Most current detectors use postprocessings such as non-maximal suppression to address this issue, but direct set prediction are postprocessing-free. They need global inference schemes that model interactions between all predicted elements to avoid redundancy. For constant-size set pre- diction, dense fully connected networks [ 9 ] are sufficient but costly. A general approach is to use auto-regressive sequence models such as recurrent neural net- works [ 48 ] . In all cases, the loss function should be invariant by a permutation of the predictions. The usual solution is to design a loss based on the Hungarian al- gorithm [ 20 ] , to find a bipartite matching between ground-truth and prediction. This enforces permutation-invariance, and guarantees that each target element has a unique match. We follow the bipartite matching loss approach. In contrast to most prior work however, we step away from autoregressive models and use transformers with parallel decoding, which we describe below.", "gold_evidence_draft": [{"evidence_unit_id": "detr_page_0003_HY_004", "document_id": "detr", "page_id": "page_0003", "element_type": "TEXT", "bbox": [[47.0, 346.0, 573.0, 671.0]], "text": "There is no canonical deep learning model to directly predict sets. The basic set prediction task is multilabel classification (see e.g., [ 40 , 33 ] for references in the context of computer vision) for which the baseline approach, one-vs-rest, does not apply to problems such as detection where there is an underlying structure between elements (i.e., near-identical boxes). The first difficulty in these tasks is to avoid near-duplicates. Most current detectors use postprocessings such as non-maximal suppression to address this issue, but direct set prediction are postprocessing-free. They need global inference schemes that model interactions between all predicted elements to avoid redundancy. For constant-size set pre- diction, dense fully connected networks [ 9 ] are sufficient but costly. A general approach is to use auto-regressive sequence models such as recurrent neural net- works [ 48 ] . In all cases, the loss function should be invariant by a permutation of the predictions. The usual solution is to design a loss based on the Hungarian al- gorithm [ 20 ] , to find a bipartite matching between ground-truth and prediction. This enforces permutation-invariance, and guarantees that each target element has a unique match. We follow the bipartite matching loss approach. In contrast to most prior work however, we step away from autoregressive models and use transformers with parallel decoding, which we describe below.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/output/deepseekocr2_split_render/detr/page_0003/page.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_2/hybrid/shard_1/detr/page_0003/evidence_nodes.jsonl", "source_atom_ids": ["A_007"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "provenance_warning": "Legacy original PDFs were not uniformly verified; review against preserved page image and node text.", "reviewer_decision": null, "reviewer_notes": null, "corpus": "node_vqa_reuse_v1_20261113", "answer_status": "candidate_gold_requires_human_rewrite_and_approval"}, {"draft_id": "legacy_qa_review_v1::016", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "entropy", "document_title": "entropy", "question": "What substantive claim, mechanism, or result does the selected passage establish about entropy? Include any condition that limits the claim.", "gold_answer_draft": "These artificial languages are useful in }}_{\\times}$ can be constrained to have the same chirality ( $\\iota$ -waves). A more narrow sub-class of $\\iota$ -waves are non- precessing binary systems, where the parameters $e[i]$ are related to the inclination angle of the source and there- fore $e[i]=const$ . The angles $\\psi[i]$ define the orientation of the reconstructed response vectors in the network plane. Assuming that the parameters $e[i]$ are free, the constraint $\\psi[i}=const$ describes a particular class of GW signals with the same direction of the network response vectors ( $\\Psi$ -waves). The elliptical, linear and circular waves are defined when both angles $e[i]$ and $\\psi[i]$ are constrained. The constraints for the $\\iota$ -waves and $\\Psi$ -waves, and their combinations characterizing different polarization mod- els are summarized in Table I . The simplest solution is for the waves with the circular polarization: $e[i] = \\pm 1$ . A less strict (loose) circular polarization constraint is when $\\boldsymbol{\\xi}_{\\times}=0$ . In this case the network responses are defined by the vectors $\\boldsymbol{\\xi}_{+}$ and $\\boldsymbol{\\xi}_{\\times}$ and the condition $e[i]=\\pm 1$ is not enforced. For linear waves $e[i] = 0$ and all $0^{\\circ}$ -phase response vectors are co-aligned, or $\\psi[i] = const$ . Respec- tively, a less strict (loose) linear polarization constraint is defined by the condition $\\tilde{\\pmb{\\xi}}_{\\times}=0$ when the condition $\\psi[i]=const$ is not enforced. The polarization constraints can be used to construct weakly modeled burst searches targeting broad classes of GW transients. The $\\iota$ -wave constraint can be applied to any rotating source. The el- liptical, circular and the $\\psi$ -wave constraints can be used to search for compact binary sources with different spin configurations.", "gold_evidence_draft": [{"evidence_unit_id": "gNtSaU-1511.05999v3_page_0006_HY_001", "document_id": "gNtSaU-1511.05999v3", "page_id": "page_0006", "element_type": al"}, {"draft_id": "legacy_qa_review_v1::018", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "gw150914_detection", "document_title": "gw150914_detection", "question": "What substantive claim, mechanism, or result does the selected passage establish about gw150914_detection? Include any condition that limits the claim.", "gold_answer_draft": "FIG. 1. The gravitational-wave event GW150914 observed by the LIGO Hanford (H1, left column panels) and Livingston (L1, right column panels) detectors. Times are shown relative to September 14, 2015 at 09:50:45 UTC. For visualization, all time series are filtered with a 35–350 Hz bandpass filter to suppress large fluctuations outside the detectors' most sensitive frequency band, and band-reject filters to remove the strong instrumental spectral lines seen in the Fig. 3 spectra. Top row, left: H1 strain. Top row, right: L1 strain. GW150914 arrived first at L1 and $6.9^{+0.5}_{-0.7}$ ms later at H1; for a visual comparison, the H1 data are also shown, shifted in time by this amount and inverted (to account for the detectors' relative orientations). Second row: Gravitational-wave strain projected onto each detector in the 35–350 Hz band. Solid lines show a numerical relativity waveform for a system with parameters consistent with those recovered from GW150914 [ 37 , 38 ] confirmed to 99.9 % by an independent calculation based on [ 15 ] . Shaded areas show 90 % credible regions for two independent waveform reconstructions. One (dark gray) models the signal using binary black hole template waveforms [ 39 ] . The other (light gray) does not use an astrophysical model, but instead calculates the strain signal as a linear combination of sine-Gaussian wavelets [ 40 , 41 ] . These reconstructions have a 94 % overlap, as shown in [ 39 ] . Third row: Residuals after subtracting the filtered numerical relativity waveform from the filtered detector time series. Bottom row:A time-frequency representation [ 42 ] of the strain data, showing the signal frequency increasing over time.", "gold_evidence_draft": [{"evidence_unit_id": "gw150914_detection_page_0002_HY_003", "document_id": "gw150914_detection", "page_id": "page_0002", "element_type": "COMPOSITE", "bbox": [[74.0, 856.0, 843.0, 1072.0], [79.0, 236.0, 837.0, 850.0]], "text": "FIG. 1. The gravitational-wave event GW150914 observed by the LIGO Hanford (H1, left column panels) and Livingston (L1, right column panels) detectors. Times are shown relative to September 14, 2015 at 09:50:45 UTC. For visualization, all time series are filtered with a 35–350 Hz bandpass filter to suppress large fluctuations outside the detectors' most sensitive frequency band, and band-reject filters to remove the strong instrumental spectral lines seen in the Fig. 3 spectra. Top row, left: H1 strain. Top row, right: L1 strain. GW150914 arrived first at L1 and $6.9^{+0.5}_{-0.7}$ ms later at H1; for a visual comparison, the H1 data are also shown, shifted in time by this amount and inverted (to account for the detectors' relative orientations). Second row: Gravitational-wave strain projected onto each detector in the 35–350 Hz band. Solid lines show a numerical relativity waveform for a system with parameters consistent with those recovered from GW150914 [ 37 , 38 ] confirmed to 99.9 % by an independent calculation based on [ 15 ] . Shaded areas show 90 % credible regions for two independent waveform reconstructions. One (dark gray) models the signal using binary black hole template waveforms [ 39 ] . The other (light gray) does not use an astrophysical model, but instead calculates the strain signal as a linear combination of sine-Gaussian wavelets [ 40 , 41 ] . These reconstructions have a 94 % overlap, as shown in [ 39 ] . Third row: Residuals after subtracting the filtered numerical relativity waveform from the filtered detector time series. Bottom row:A time-frequency representation [ 42 ] of the strain data, showing the signal frequency increasing over time.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/output/deepseekocr2_split_render/gw150914_detection/page_0002/page.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_1/hybrid/shard_0/gw150914_detection/page_0002/evidence_nodes.jsonl", "source_atom_ids": ["A_009"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "provenance_warning": "Legacy original PDFs were not uniformly verified; review against preserved page image and node text.", "reviewer_decision": null, "reviewer_notes": null, "corpus": "node_vqa_reuse_v1_20261113", "answer_status": "candidate_gold_requires_human_rewrite_and_approval"}, {"draft_id": "legacy_qa_review_v1::019", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "gw150914_gr_test", "document_title": "gw150914_gr_test", "question": "What substantive claim, mechanism, or result does the selected passage establish about gw150914_gr_test? Include any condition that limits the claim.", "gold_answer_draft": "We begin by constraining the level of coherent (i.e., GW- like) residual strain left after removing the most-probable GR waveform from the GW150914 data, and use this esti- mated level to bound GR violations which are not degener- ate with changes in the parameters of the binary. We then verify that the mass and spin parameters of the final black hole, as predicted from the binary's inspiral signal, are consis- tent with the final parameters inferred from the post-inspiral (merger and ringdown) signal. We find that the data fol- lowing the peak of GW150914 are consistent with the least- damped quasi-normal mode (QNM) inferred from the final black-hole's characteristics. Next, we perform targeted mea- surements of the PN and phenomenological coefficients ffi for transparency, we still quote the 90 % range of the uncut distributions. These numbers provide estimates of the order of magnitude of the potential systematic error). Assuming a normally distributed error is the least constraining choice [ 90 ] and gives a conservative estimate. The uncertainty from waveform modeling is less significant than the statistical uncertainty; therefore, we are confident that the results are robust against this potential systematic error. We consider this point in detail later in the Letter.", "gold_evidence_draft": [{"evidence_unit_id": "gw150914_properties_page_0006_HY_005", "document_id": "gw150914_properties", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[101.0, 1281.0, 604.0, 1453.0], [632.0, 99.0, 1135.0, 448.0]], "text": "In Table I , we also indicate how sensitive our results are to our choice of waveform. For each parameter, we give systematic errors on the boundaries of the 90 % credible intervals due to the uncertainty in the waveform models considered in the analysis; the quoted values are the 90 % range of a normal distribution estimated from the variance of results from the different models. (If $X$ were an edge of a credible interval, we quote systematic uncertainty $\\pm1.64\\sigma_\\text{sys}$ using the estimate $\\sigma_\\text{sys}^2=[(X_\\text{EOBNR}-X_\\text{Overall})^2+(X_\\text{IMRPhenom}-X_\\text{Overall})^2]/2$ . For parameters with bounded ranges, like the spins, the normal distributions should be truncated. However, for transparency, we still quote the 90 % range of the uncut distributions. These numbers provide estimates of the order of magnitude of the potential systematic error). Assuming a normally distributed error is the least constraining choice [ 90 ] and gives a conservative estimate. The uncertainty from waveform modeling is less significant than the statistical uncertainty; therefore, we are confident that the results are robust against this potential systematic error. We consider this point in detail later in the Letter.", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/experiments/dolphin_v2_pilot/work/relation_first_fresh/images/relation_gw150914_properties_page_0006.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_4/hybrid/shard_1/gw150914_properties/page_0006/evidence_nodes.jsonl", "source_atom_ids": ["A_009", "A_010"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "provenance_warning": "Legacy original PDFs were not uniformly verified; review against preserved page image and node text.", "reviewer_decision": null, "reviewer_notes": null, "corpus": "node_vqa_reuse_v1_20261113", "answer_status": "candidate_gold_requires_human_rewrite_and_approval"}, {"draft_id": "legacy_qa_review_v1::021", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "hallmarks_of_aging", "document_title": "hallmarks_of_aging", "question": "What substantive claim, mechanism, or result does the selected passage establish about hallmarks_of_aging? Include any condition that limits the claim.", "gold_answer_draft": "A prominent aging-associated alteration in intercellular communication is `inflammaging', i.e. a smoldering pro-inflammatory phenotype that accompanies aging in mammals (Salminen et al., 2012) . Inflammaging may result from multiple causes such as the accumulation of pro-inflammatory tissue damage, the failure of an ever more dysfunctional immune system to effectively clear pathogens and dysfunctional host cells, the propensity of senescent cells to secrete pro-inflammatory cytokines (see section on Cellular Senescence), the enhanced activation of the NF- $\\kappa$ B transcription factor, or the occurrence of a defective autophagy response (Salminen et al., 2012) . These alterations result in an enhanced activation of the NLRP3 inflammasome and other pro-inflammatory pathways, finally leading to increased production of IL-1 $\\beta$ , tumor necrosis factor and interferons (Green et al., 2011; Salminen et al., 2012) . Inflammation is also involved in the pathogenesis of obesity and type 2 diabetes, two conditions that contribute to, and correlate with aging in the human population (Barzilai et al., 2012) . Likewise, defective inflammatory responses play a critical role in atherosclerosis (Tabas, 2010) . The recent finding that age-associated inflammation inhibits epidermal stem cell function (Doles et al., 2012) , further supports the intricate concatenation of different hallmarks that reinforces the aging process. Paralleling inflammaging, the function of the adaptive immune system declines (Deeks, 2011) . This immunosenescence may aggravate the aging phenotype at the systemic level, due to the failure of the immune system to clear infectious agents, infected cells, and cells on the verge of malignant transformation. Moreover, one of the functions of the immune system is to recognize and eliminate senescent cells (see section on Stem Cell Exhaustion), as well as hyperploid cells that accumulate in aging tissues and premalignant lesions (Davoli and de Lange, 2011; Senovilla et al., 2012) .", "gold_evidence_draft": [{"evidence_unit_id": "hallmarks_of_aging_page_0018_HY_002", "document_id": "hallmarks_of_aging", "page_id": "page_0018", "element_type": "TEXT", "bbox": [[221.0, 309.0, 783.0, 724.0]], "text": "A prominent aging-associated alteration in intercellular communication is `inflammaging', i.e. a smoldering pro-inflammatory phenotype that accompanies aging in mammals (Salminen et al., 2012) . Inflammaging may result from multiple causes such as the accumulation of pro-inflammatory tissue damage, the failure of an ever more dysfunctional immune system to effectively clear pathogens and dysfunctional host cells, the propensity of senescent cells to secrete pro-inflammatory cytokines (see section on Cellular Senescence), the enhanced activation of the NF- $\\kappa$ B transcription factor, or the occurrence of a defective autophagy response (Salminen et al., 2012) . These alterations result in an enhanced activation of the NLRP3 inflammasome and other pro-inflammatory pathways, finally leading to increased production of IL-1 $\\beta$ , tumor necrosis factor and interferons (Green et al., 2011; Salminen et al., 2012) . Inflammation is also involved in the pathogenesis of obesity and type 2 diabetes, two conditions that contribute to, and correlate with aging in the human population (Barzilai et al., 2012) . Likewise, defective inflammatory responses play a critical role in atherosclerosis (Tabas, 2010) . The recent finding that age-associated inflammation inhibits epidermal stem cell function (Doles et al., 2012) , further supports the intricate concatenation of different hallmarks that reinforces the aging process. Paralleling inflammaging, the function of the adaptive immune system declines (Deeks, 2011) . This immunosenescence may aggravate the aging phenotype at the systemic level, due to the failure of the immune system to clear infectious agents, infected cells, and cells on the verge of malignant transformation. Moreover, one of the functions of the immune system is to recognize and eliminate senescent cells (see section on Stem Cell Exhaustion), as well as hyperploid cells that accumulate in aging tissues and premalignant lesions (Davoli and de Lange, 2011; Senovilla et al., 2012) .", "source_page_image": "/hkfs/home/project/hk-project-p0025545/dv3352/Project/parsing/output/deepseekocr2_split_render/hallmarks_of_aging/page_0018/page.png", "source_node_file": "/home/ka_anthropomatik/ka_dv3352/Project/EvidenceNet/output/hybrid_node_v2_61078/embedding_geometry/batch_0/hybrid/shard_1/hallmarks_of_aging/page_0018/evidence_nodes.jsonl", "source_atom_ids": ["A_006"], "future_node_mapping": "already_bound_to_legacy_node"}], "difficulty": "review_candidate", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "BOUND_TO_EXISTING_LEGACY_NODE", "provenance_warning": "Legacy original PDFs were not uniformly verified; review against preserved page image and node text.", "reviewer_decision": null, "reviewer_notes": null, "corpus": "node_vqa_reuse_v1_20261113", "answer_status": "candidate_gold_requires_human_rewrite_and_approval"}, {"draft_id": "legacy_qa_review_v1::022", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "nist_ai_rmf_1_0", "document_title": "nist_ai_rmf_1_0", "question": "What substantive claim, mechanism, or result does the selected passage establish about nist_ai_rmf_1_0? Include any condition that limits the claim.", "gold_answer_draft": "While there are myriad standards and best practices to help organizations mitigate the risks of traditional software or information-based systems, the risks posed by AI systems are in many ways unique (See Appendix B ). AI systems, for example, may be trained on data that can change over time, sometimes significantly and unexpectedly, affecting system function- ality and trustworthiness in ways that are hard to understand. AI systems and the contexts in which they are deployed are frequently complex, making it difficult to detect and respond to failures when they occur. AI systems are inherently socio-technical in nature, meaning they are influenced by societal dynamics and human behavior. AI risks – and benefits – can emerge from the interplay of technical aspects combined with societal factors related to how a system is used, its interactions with other AI systems, who operates it, and the social context in which it is deployed.", "gold_evidence_draft": [{"evidence_unit_id": "nist_ai_rmf_1_0_page_0006_HY_003", "document_id": "nist_ai_rmf_1_0", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[176.0, 635.0, 1060.0, 959.0]], "text": "While there are my eport", "question": "What substantive claim, mechanism, or result does the selected passage establish about nvidia_2026_annual_report? Include any condition that limits the claim.", "gold_answer_draft": "NVIDIA invents computing technologies that improve lives and address global challenges. Our goal is to integrate sound CS principles and practices across the Company. Our Board and management believe that environmental stewardship, social responsibility, and solid governance are important to our business strategy and long-term value creation. While the full Board has ultimate responsibility for CS matters that impact our business, each committee of the Board oversees CS matters across our business operations in the areas that align with their respective responsibilities. The NCGC is responsible for reviewing and discussing with management our policies, issues, and reporting related to sustainability, including overall sustainability strategy, risks, and opportunities, and related programs and initiatives. Our CS team updates the NCGC at least semiannually on these topics, as well as pertinent regulations and stakeholder inputs, and gathers feedback from the NCGC on issues such as climate change and human rights. The CS team also reports on sustainability issues to the full Board annually.", "gold_evidence_draft": [{"evidence_unit_id": "nvidia_2026_annual_report_page_0050_HY_003", "document_id": "nvidia_2026_annual_report", "page_id": "page_0050", "element_type": "TEXT", "bbox": [[80.0, 510.0, 1148.0, 734.0]], "text": "NVIDIA invents computing technologies that improve lives and address global challenges. Our goal is to integrate sound CS principles and practices across the Company. Our Board and management believe that environmental stewardship, social responsibility, and solid governance are important to our business strategy and long-term value creation. While the full Board has ultimate responsibility for CS matters that impact our business, each committee of the single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_004_batch_04_Spinoff2020::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_004_batch_04_Spinoff2020", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_04_Spinoff2020.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_004_batch_04_Spinoff2020, and what stated condition or consequence qualifies it?", "gold_answer_draft": "This was especially important for projects like the Two- Phase Flow Separator Experiment and the Packed Bed Reactor Experiment, both of which Motil oversaw. The former aimed to separate air and water through inertia by spinning them. The latter observed how air and water moved together through a packed bed reactor, a type of device that directs substances into a vessel packed with a catalyst to create desired reactions. Packed bed reactors are used on the International Space Station in air and water purification systems, fuel cells, and other devices, as well as in many applications on Earth. Currently, none of the packed bed reactors on the space station handle both liquid and gas, because scientists don't know how a two-phase system would perform in microgravity, but such a device would promise more efficient thermal-management and life-support systems.", "gold_evidence_draft": [{"evidence_unit_id": "real_004_batch_04_Spinoff2020:p0156:e005", "document_id": "real_004_batch_04_Spinoff2020", "page_number": 156, "element_index": 5, "element_type": "para", "bbox": [94, 625, 550, 1022], "text": "This was especially important for projects like the Two- Phase Flow Separator Experiment and the Packed Bed Reactor Experiment, both of which Motil oversaw. The former aimed to separate air and water through inertia by spinning them. The latter observed how air and water moved together through a packed bed reactor, a type of device that directs substances into a vessel packed with a catalyst to create desired reactions. Packed bed reactors are used on the International Space Station in air and water purification systems, fuel cells, and other devices, as well as in many applications on Earth. Currently, none of the packed bed reactors on the space station handle both liquid and gas, because scientists don't know how a two-phase system would perform in microgravity, but such a device would promise more efficient thermal-management and life-support systems.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_004_batch_04_Spinoff2020/pages/page_0156/output_json/page_0156.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_004_batch_04_Spinoff2020::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_004_batch_04_Spinoff2020", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_04_Spinoff2020.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_004_batch_04_Spinoff2020, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Foreword Even as NASA continues to unpack data from the most distant world ever visited—Ultima Thule, which the New Horizons probe zoomed past 4 billion miles from Earth at the start of last year—the Space Agency never takes its eyes off our home planet. In fact, the Agency's longest continually operated program is the Technology Transfer Program, which works to put the countless innovations that drive space exploration into the hands of U.S. companies and entrepreneurs. Now, as we gear up to send astronauts back to the Moon for the first time in more than half a century, those inven- tions and advances will only multiply. As always, NASA will rely on many commercial industry partners to help carry out this ambitious mission, which will see the first woman and next man set foot on the Moon and establish sustainable lunar exploration with our commercial and international partners by 2028. Just as the Apollo Program yielded some of NASA's most important commercial spinoffs and advanced the state of the Nation's technology, these new partnerships under the Artemis Program are sure to produce innovations that will benefit all Americans. Already, the Space Agency is partnering with com- panies to deliver payloads to the Moon through its new Commercial Lunar Payload Services program. Other companies are responding to calls to provide some of those payloads in the form of scientific instruments and technology investigations. We also selected 11 companies to study options and build prototype elements for landers as part of the Next Space Technologies for Exploration Partnerships program. These landers will carry astronauts from the lunar space station—named Gateway—to the Moon's surface. One day, companies will operate these landers commercially. NASA itself is also developing cutting edge technology demonstration payloads designed to prepare for our lunar future, including systems to prospect for resources, gather data on the environment, assist precision landing, and try out advanced solar arrays, among others. In the future, whether companies license technology NASA develops under Artemis, commercialize their own solutions to new lunar challenges, or use NASA scientific data or software in other applications, there are many avenues for these technologies to take on their own lives as commercial spinoffs benefiting the public. The Space Launch System, NASA's next-generation rocket that could make its first test run to the Moon as soon as this year, and the Orion capsule that's planned to carry astronauts to lunar orbit in 2022 have already led to several products documented in earlier editions of Spinoff with more to come. As you learn about the contributions that the 50 technologies featured in Spinoff 2020 have made to our economy, our planet, and our quality of life, imagine what might be possible in the future, as we take on the grand challenges of establishing a permanent human outpost on the natural satellite where humanity once briefly stepped. Jim Bridenstine Administrator National Aeronautics and Space Administration Spinoff 2020 5", "gold_evidence_draft": [{"evidence_unit_id": "real_004_batch_04_Spinoff2020:p0007:e000", "document_id": "real_004_batch_04_Spinoff2020", "page_number": 7, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "Foreword Even as NASA continues to unpack data from the most distant world ever visited—Ultima Thule, which the New Horizons probe zoomed past 4 billion miles from Earth at the start of last year—the Space Agency never takes its eyes off our home planet. In fact, the Agency's longest continually operated program is the Technology Transfer Program, which works to put the countless innovations that drive space exploration into the hands of U.S. companies and entrepreneurs. Now, as we gear up to send astronauts back to the Moon for the first time in more than half a century, those inven- tions and advances will only multiply. As always, NASA will rely on many commercial industry partners to help carry out this ambitious mission, which will see the first woman and next man set foot on the Moon and establish imagine what might be possible in the future, as we take on the grand challenges of establishing a permanent human outpost on the natural satellite where humanity once briefly stepped. Jim Bridenstine Administrator National Aeronautics and Space Administration Spinoff 2020 5", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_004_batch_04_Spinoff2020/pages/page_0007/output_json/page_0007.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_005_batch_05_Spinoff2019::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_005_batch_05_Spinoff2019", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_05_Spinoff2019.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_005_batch_05_Spinoff2019, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Benefits Calculations of crop coverage, type, health, and growth, and especially forecasts of crop productivity interest organi- zations like the U.S. Department of Agriculture's (USDA) Foreign Agricultural Service, which provides unbiased commodity estimates and forecasts to create a marketing edge for U.S. producers in world markets. As GDA amassed enough global crop data to develop commercial products, the agricultural service became its biggest customer, but others, such as agricultural insur- ance companies, grain and commodity traders, and food transporters, also became clients, Hulina says. \"Anybody who really needs to know where crops are, how they're progressing through the growing season, and what the output will be\" is a potential customer, she adds. For commercial customers, GDA offers real-time and historical image-based data for 16 major crops around the world. This \"agricultural intelligence\" includes maps of crop coverage, acreage totals, ground conditions, crop health, and forecasts of yield per acre and overall global protection. These can also be broken down to national and state levels. The system pulls imaging from multiple sensors on several satellites, which vary in resolution, spectral bands, how wide a swath they can see, and how often they pass over a given area, letting the company tailor products to meet a wide range of needs. GDA says it's the only company to combine all these capabilities on a global scale. Its relatively new GeoSynergy webGIS service puts them all in one place to let the user manipulate and analyze calibrated, full-resolution current and historical imagery and data. Varylu gin says the company plans to continue adding new capabilities, as well as new sources of imagery as they become available. The Foreign Agricultural Service uses GDA's tools, among other sources, to create its monthly production estimates for all major commodity crops, and Hulina notes that crop futures markets move according to those estimates. \"We are the only remote sensing firm supplying that line of evidence,\" she says. The estimates also help the service predict shortages to help direct its food aid programs. The company also counts the U.S. Geological Survey (USGS), the U.S. Forest Service, and the USDA's National Agricultural Statistics Service with its customers. But the company's success wouldn't be possible without two important Government initiatives, Varlyguin says. Earth-imaging analysis on a global scale wouldn't be feasible without free satellite im- agery. Landsat images, for example, cost hundreds to t erican Midwest, with deeper greens indicating higher correlation and reds showing less correlation. Areas with more complete historical data generate more consistent and accurate forecasts. Spoinoff 2019 Energy and Environment 123", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_005_batch_05_Spinoff2019/pages/page_0124/output_json/page_0124.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_005_batch_05_Spinoff2019::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_005_batch_05_Spinoff2019", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_05_Spinoff2019.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_005_batch_05_Spinoff2019, and what stated condition or consequence qualifies it?", "gold_answer_draft": "The X-57 team is also helping to shape safety and testing requirements for electric and hybrid aircraft by sharing its work with industry standards boards, Cobleigh says, noting that companies often would be reluctant to share such information. \"NASA makes sure everyone learns the lessons taxpayer dollars paid for.\" Benefits Electric motors are far more efficient than internal combustion engines and require much less maintenance, replacing the high heat and friction of combustion chambers and pistons with wound wires and magnets, Cobleigh points out. They are 90 percent efficient or better, meaning almost all the power is ement, a problem for a jacket intended for athletes. \"Every time you move you're losing thermal performance you never get back,\" he said. The second problem was that the silica aerogel itself tends to suck out moisture on contact, \"so if you touch it with your skin or your hand, it would dry out your skin. That meant we had to encapsulate the insulation, like a Ziploc baggie. That cut the breathability down to virtually zero. \"We said this is a really good first step and market validation for aerogel use. But it can still get better. We needed a flexible sheet that maintained its insulation, but that didn't shed with motion,\" Markesbery says. The company continued its research and ultimately came up with a new, proprietary way to utilize aerogel in a flexible polymer composite, which it says provides more structure and stability than the fiber blanket. It also increases breathability for comfort and reduces the overall weight of the insulation. As a result, the next-generation jacket is at least 40 percent lighter than the original, weighing in at just 2.5 pounds or less. Oros calls its new, proprietary insulation SolarCore and used it in its products in 2016 and 2017—a product line that has been extended to include gloves, leggings, snow pants, and base-layer shirts. Even the knit hats are insulated with SolarCore, which is knitted into the brim. The company brag the insulation is so warm, it has added zippered vents in the jacket and snow pants in case the wearer overheats—all with just 3 millimeters of insulation. The company continues its research into aerogel upgrades, with more improvements planned in the next release of products in fall 2018. But the original product line and core and inspiration for development started with aerogel's NASA roots. As Markesbery says: \"If it's good enough for space, shouldn't it be good enough for Earth?\"♖ \"If it's\" good enough for space, shouldn't it be good enough for Earth?\" — Michael Markesbery, Oros Oros makes extra-lightweight outwear lined with aerogel- infused insulation. NASA helped drive the innovations that made aerogel practical for apparel—in its original form, silica aerogel was extremely brittle, but it can be used in composites that are durable and flexible. Spinoff 2018 Consumer Goods 85", "gold_evidence_draft": [{"evidence_unit_id": "real_006_batch_06_Spinoff2018:p0086:e000", "document_id": "real_006_batch_06_Spinoff2018", "page_number": 86, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "But the young company wasn't ready to rest on its laurels. When we made the original jacket with these aerogel blankets, we learned that they were amazing insulators, and they were good for apparel—but not great,” Markesbery recalled. They noticed two main issues. First, the silica had a tendency to flake out of the fiber blanket with movement, a problem for a jacket intended for athletes. \"Every time you move you're losing thermal performance you never get back,\" he said. The second problem was that the silica aerogel itself tends to suck out moisture on contact, \"so if you touch it with your skin or your hand, it would dry out your skin. That meant we had to encapsulate the insulation, like a Ziploc baggie. That cut the breathability down to virtually zero. \"We said this is a really good first step and market validation for aerogel use. But it can still get better. We needed a flexible sheet that maintained its insulation, but that didn't shed with motion,\" Markesbery says. The company continued its research and ultimately came up with a new, proprietary way to utilize aerogel in a flexible polymer composite, which it says provides more structure and stability than the fiber blanket. It also increases breathability for comfort and reduces the overall weight of the insulation. As a result, the next-generation jacket is at least 40 percent lighter than the original, weighing in at just 2.5 pounds or less. Oros calls its new, proprietary insulation SolarCore and used it in its products in 2016 and 2017—a product line that has been extended to include gloves, leggings, snow pants, and base-layer shirts. Even the knit hats are insulated with SolarCore, which is knitted into the brim. The company brag the insulation is so warm, it has added zippered vents in the jacket and snow pants in case the wearer overheats—all with just 3 millimeters of insulation. The company continues its research into aerogel upgrades, with more improvements planned in the next release of products in fall 2018. But the original product line and core and inspiration for development started with aerogel's NASA roots. As Markesbery says: \"If it's good enough for space, shouldn't it be good enough for Earth?\"♖ \"If it's\" good enough for space, shouldn't it be good enough for Earth?\" — Michael Markesbery, Oros Oros makes extra-lightweight outwear lined with aerogel- infused insulation. NASA helped drive the innovations that made aerogel practical for apparel—in its original form, silica aerogel was extremely brittle, but it can be used in composites that are durable and flexible. Spinoff 2018 Consumer Goods 85", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_006_batch_06_Spinoff2018/pages/page_0086/output_json/page_0086.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_006_batch_06_Spinoff2018::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_006_batch_06_Spinoff2018", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_06_Spinoff2018.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_006_batch_06_Spinoff2018, and what stated condition or consequence qualifies it?", "gold_answer_draft": "2D Analysis Software Clarifies Medical, Weather, Intelligence Images NASA Technology ASA engineer Sennion Kizhner spent an entire week trying to understand the Hilbert-Huang Transform with the colleague who had devel- oped it, but to no avail. He hoped to develop a software that would get people using this powerful but complex new algorithm, he says, because he saw great potential in it that might require decades of development. Fortunately, no one needs to fully understand a transform to use it. \"I have no clue how intestines work, but that doesn't prevent me from eating,\" says Kizhner, now recently retired from Goddard Space Flight Center's Instrument Electronics Development Branch. A transform—essentially, a particular type of math- ematical formula—helps scientists gather information from complex data. For example, Kizhner says, he might not be able to interpret the raw data from an electrocardiogram reading, but transforming the data into the frequency domain might show that something is happening about once a second, which is the normal respiration rate—a clue suggesting the phenomenon is probably associated with breathing. \"You try to apply some known transform, and if you're lucky, it will give you something you understand,\" Kizhner says. One of the most commonly used transforms is the century-old Fourier Transform, originally devised to study heat transfer but now used in applications as diverse as quantum mechanics and digital image compression. The Fourier Transform, however, has severe limitations when it comes to analyzing natural phenomena. Kizhner had been looking for an alternative, and the Hilbert-Huang Transform (HHT), created by Goddard chief scientist for oceanography Norden Huang, seemed like a promising option. It's the product of the oceanographer's nearly four decades of attempts to come up with a transform that could make more sense of data on ocean waves and atmospheric turbulence. It breaks down a one-dimensional signal into a series of what Huang called intrinsic mode functions, isolating various frequencies, and then applies the preexisting one-dimensional Hilbert spectral analysis to decompose frequency components. Kizhner notes that the Royal Society of London published all of Huang's 100-page paper on the subject despite the organization's 10-page limit. \"Obviously, someone was impressed.\" Although Kizhner still struggled to understand the mechanics of the transform, he and one of his students, Karin Blank, were able to write software to apply it, with initial funding from Goddard's Internal Research and Development (IRAD) Program. The resulting HHT Data Processing System software for one-dimensional data, which can be licensed from Goddard, works well beyond oceanography. \"HHT1 works on data like nothing else before it, and people are using it all over the world,\" Kizhner says; including to help monitor blood flow in the brain after brain injuries (Spinoff 2010). In 2006, the Federal Laboratory Consortium's mid-Atlantic region named the software Best Technology of the Year. But Kizhner—and many others, including Huang himself—were looking for a way to use the transform in two dimensions to analyze images. \"There are certain things in image processing that cannot be done well with existing techniques, so we always strive to find something new,\" he says. Goddard engineer Sennion Kizhner's two-dimensional version of the Hilbert-Huang Transform was first tried out on the radiometer for NASA's Soil Moisture Active Passive (SMAP) satellite, where it eliminates radio interference from imagery. 122 Information Technology Spinoff 2018", "gold_evidence_draft": [{"evidence_unit_id": "real_ 006_batch_06_Spinoff2018/pages/page_0123/output_json/page_0123.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_007_batch_07_Spinoff2017::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_007_batch_07_Spinoff2017", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_07_Spinoff2017.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_007_batch_07_Spinoff2017, and what stated condition or consequence qualifies it?", "gold_answer_draft": "technology and adapting it for this market, designing custom manifolds with units to measure pressure change, installing temperature sensors, and creating displays that could operate in high-radiation environments, for example. After years of rigorous testing, verification, and certifica- tion, Graftel made its first balanced flow meter sale in 2013 and has been finding customers around the world ever since. The company gathers requirements and specifications from its customers and passes them on to A+ FlowTek, which uses its software to generate optimal flow plate designs. Graftel then manufactures, tests, certifies, and helps install the meters. Benefits The major benefit of the balanced flow meter is that, unlike single-hole flow plates and some other flow meters, it causes little to no drop in pressure in the fluid or gas passing through it. This is because it also acts as a flow conditioner, minimizing friction and passing along flows that have uniform velocity and pressure profiles. \" A regular flow plate with a single hole will have maybe 10 pounds of pressure drop,\" Van Buskirk says. \"That could mean hundreds or thousands of dollars in lost production per hour.\" By increasing flow efficiency, the meter pays for itself within weeks when compared to those based on a single-hole plate, he says. \"Balanced flow meters are typically considered a green technology due to the substantial reduction in fluid pump energy requirements,\" Kelley says. \"One company unof- ficially stated a savings of $5 million over three years of operation using a $5,000 unit.\" Other instruments commonly used in the nuclear industry, such as ultrasound flow meters, can produce inconsistent results, whereas balanced flow meters are consistently accurate. It's also the only flow meter that can obtain accurate results even when placed near a bend in a pipe, which causes flow disturbances, another plus for nuclear plants. \"In a lot of situations, the pipes in nuclear plants aren't just straight—they can be all over the place,\" Glover points out. The flow plates are cheaper than many alternatives, last longer, and are virtually maintenance-free. They are also resistant to the buildup that often plagues other flow meters. \"Instead of months, they'll work for 10, 15 years, probably forever,\" Van Buskirk says. And while single-hole flow plates can reach volumes up to 115 decibels—about as noisy as a loud rock concert—the plates A+ FlowTek designs are barely audible. \"It's a 100 percent increase in accuracy and pressure recovery and a 10-fold reduction in noise,\" says Glover. \"It's night-and-day-type stuff—like going from a Volkswagen bus to a Ferrari.\" The company is working to incorporate a wireless communication system into the flow meters, a concept it pioneered in its work for the Limerick Generating Station in Pennsylvania and which would let engineers read flow data from their desks. The system had to be specially designed to make it impervious to hackers. \"Graftel has really incorporated our plate into a total solution for the nuclear industry,\" Van Buskirk says. Breaking into the nuclear industry is slow work, but the company is beginning to see sales pick-up, Glover says, noting that Graftel recently reached an agreement to provide flow meters for all of Westinghouse's future AP1000 reactors outside of China. \"We foresee a big future with the nuclear industry, and that's worldwide,\" says Van Buskirk. ❖ Since the early 2000s, balanced flow meters created through Marshall Space Flight Center's partnership with Quality Efficiency and Control have increased the accuracy of flow readings and improved efficiency in plants across a variety of industries. Since 2013, Graftel LLC has introduced the technology to the nuclear power industry, which has its own strict rules, requirements, and procedures. Spinoff 2017 Energy and Environment 131", "gold_evidence_draft": [{"evidence_unit_id": "real_007_batch_07_Spinoff2017:p0132:e000", "document_id": "real_007_batch_07_Spinoff2017", "page_number": 132, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "technology and adapting it for this market, designing custom manifolds with units to measure pressure change, installing temperature sensors, and creating displays that could operate in high-radiation environments, for example. After years of rigorous testing, verification, and certifica- tion, Graftel made its first balanced flow meter sale in 2013 and has been finding customers around the world ever since. The company gathers requirements and specifications from its customers and passes them on to A+ FlowTek, which uses its software to generate optimal flow plate designs. Graftel then manufactures, tests, certifies, and helps install the meters. Benefits The major benefit of the balanced flow meter is that, unlike single-hole flow plates and some other flow meters, it causes little to no drop in pressure in the fluid or gas passing through it. This is because it also
