acture the composite blades for Carson Helicopters to sell. The commercial blades are due to fly on a U.S. Presidential VH-3 helicopter in late 2007, as part of the VH-3D Lift Improvement Program sponsored by the U.S. Naval Air Systems Command. Overseas, a customized set of blades is being tested for potential use on a British Sea King Royal Navy helicopter.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0053:e001", "document_id": "real_016_batch_16_basic_version_07", "page_number": 53, "element_index": 1, "element_type": "para", "bbox": [93, 781, 550, 1024], "text": "In 2003, Carson Helicopters signed a contract with Ducommun AeroStructures Inc., to have the Gardena, California-based firm manufacture the composite blades for Carson Helicopters to sell. The commercial blades are due to fly on a U.S. Presidential VH-3 helicopter in late 2007, as part of the VH-3D Lift Improvement Program sponsored by the U.S. Naval Air Systems Command. Overseas, a customized set of blades is being tested for potential use on a British Sea King Royal Navy helicopter.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0053/output_json/page_0053.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::033", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Typically, ice is removed from general aviation craft with either \"weeping wing\" liquid deicing systems or inflatable rubber bladders, called pneumatic boots, installed along the wings. Both of these methods have drawbacks, including the finite, limited effectiveness of the liquid deicers and the added weight and power usage of the boots. Collaborative research at Glenn focused on using expanded graphite foil heating element technol- ogy to effectively replace these standard methods with a method that was usually limited to use on jets with heated wings and leading edge surfaces. The super-thin graph- ite, which covers a large surface area without significant weight penalties and heats quickly to melt ice, proved a viable solution, and this new safety equipment has now been made available to the aerospace community.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0054:e004", "document_id": "real_016_batch_16_basic_version_07", "page_number": 54, "element_index": 4, "element_type": "para", "bbox": [93, 625, 550, 997], "text": "Typically, ice is removed from general aviation craft with either \"weeping wing\" liquid deicing systems or inflatable rubber bladders, called pneumatic boots, installed along the wings. Both of these methods have drawbacks, including the finite, limited effectiveness of the liquid deicers and the added weight and power usage of the boots. Collaborative research at Glenn focused on using expanded graphite foil heating element technol- ogy to effectively replace these standard methods with a method that was usually limited to use on jets with heated wings and leading edge surfaces. The super-thin graph- ite, which covers a large surface area without significant weight penalties and heats quickly to melt ice, proved a viable solution, and this new safety equipment has now been made available to the aerospace community.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0054/output_json/page_0054.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::034", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Moisture can lead to corrosion in an aircraft, and altered pH can indicate that corrosion is occurring. Intelligent Optical Systems Inc. (IOS), of Torrance, California, completed Phase I and II Small Business Innovation Research (SBIR) contracts with NASA's Langley Research Center to develop moisture- and pH- sensitive sensors to detect corrosion or pre-corrosive conditions. As opposed to typical inspection equipment, like ultrasound or X-ray imaging, this technique can warn of potentially dangerous conditions before significant structural damage occurs. This new type of sensor uses a specially manufactured optical fiber whose entire length is chemically sensitive, changing color in response to contact with its target. These sensor fibers, embedded directly in aluminum “lap joints,” have detected the location—to within 2 centimeters—and alkalinity of potentially corrosive moisture incursions.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0058:e007", "document_id": "real_016_batch_16_basic_version_07", "page_number": 58, "element_index": 7, "element_type": "para", "bbox": [571, 204, 1029, 629], "text": "Moisture can lead to corrosion in an aircraft, and altered pH can indicate that corrosion is occurring. Intelligent Optical Systems Inc. (IOS), of Torrance, California, completed Phase I and II Small Business Innovation Research (SBIR) contracts with NASA's Langley Research Center to develop moisture- and pH- sensitive sensors to detect corrosion or pre-corrosive conditions. As opposed to typical inspection equipment, like ultrasound or X-ray imaging, this technique can warn of potentially dangerous conditions before significant structural damage occurs. This new type of sensor uses a specially manufactured optical fiber whose entire length is chemically sensitive, changing color in response to contact with its target. These sensor fibers, embedded directly in aluminum “lap joints,” have detected the location—to within 2 centimeters—and alkalinity of potentially corrosive moisture incursions.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0058/output_json/page_0058.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::035", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Uses for the DICAST cables abound in security and industrial applications. They can be used to protect buildings and structures, like subway stations, automotive tunnels, high-rise office buildings, arenas, and convention centers, when employed in ventilation ducts, stairwells, or even in large open spaces. The reduction in complexity and increased security provided by these continuous-cable chemical detection sensors make the DICAST system an ideal choice for these applications. A single cable running through a main return air duct, for example, is a more cost effective and efficient method for chemical detection than the installation of point sensors in each room's inlet to that duct.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0059:e005", "document_id": "real_016_batch_16_basic_version_07", "page_number": 59, "element_index": 5, "element_type": "para", "bbox": [571, 384, 1028, 699], "text": "Uses for the DICAST cables abound in security and industrial applications. They can be used to protect buildings and structures, like subway stations, automotive tunnels, high-rise office buildings, arenas, and convention centers, when employed in ventilation ducts, stairwells, or even in large open spaces. The reduction in complexity and increased security provided by these continuous-cable chemical detection sensors make the DICAST system an ideal choice for these applications. A single cable running through a main return air duct, for example, is a more cost effective and efficient method for chemical detection than the installation of point sensors in each room's inlet to that duct.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0059/output_json/page_0059.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::036", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Over the years, the group has established that many materials burn very differently in microgravity than they do on Earth. For example, attempting to stomp out a flame in microgravity could possibly accelerate combus- tion, at least temporarily (because an airflow is being created that did not exist before). Other interesting findings indicate that microgravity fires can spread faster upstream than downstream, opposite of the behavior of fire spreading on Earth, and that fire is actually weaker in microgravity. As a matter of fact, the weakest flames ever generated were done so in space. During the “Structure of Flame Balls at Low Lewis-number” (SOFBALL) experi- mental trials conducted during missions STS-83 (April 1997), STS-94 (July 1997), and STS-107 (January 2003), flames were generated in space with power as low as 1 watt—about 50 times weaker than a candle flame.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0060:e003", "document_id": "real_016_batch_16_basic_version_07", "page_number": 60, "element_index": 3, "element_type": "para", "bbox": [93, 428, 551, 823], "text": "Over the years, the group has established that many materials burn very differently in microgravity than they do on Earth. For example, attempting to stomp out a flame in microgravity could possibly accelerate combus- tion, at least temporarily (because an airflow is being created that did not exist before). Other interesting findings indicate that microgravity fires can spread faster upstream than downstream, opposite of the behavior of fire spreading on Earth, and that fire is actually weaker in microgravity. As a matter of fact, the weakest flames ever generated were done so in space. During the “Structure of Flame Balls at Low Lewis-number” (SOFBALL) experi- mental trials conducted during missions STS-83 (April 1997), STS-94 (July 1997), and STS-107 (January 2003), flames were generated in space with power as low as 1 watt—about 50 times weaker than a candle flame.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0060/output_json/page_0060.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::037", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "One of the NASA experiments testing this solution was the BioHome, an early experiment in what the Agency called “closed ecological life support systems.” The BioHome, a tightly sealed building constructed entirely of synthetic materials, was designed as suitable for one person to live in, with a great deal of the interior occupied by houseplants. Before the houseplants were added, though, anyone entering the newly constructed facility would experience burning eyes and respiratory difficulties, two of the most common symptoms of Sick Building Syndrome. Once the plants were intro- duced to the environment, analysis of the air quality indicated that most of the VOCs had been removed, and the symptoms disappeared.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0062:e013", "document_id": "real_016_batch_16_basic_version_07", "page_number": 62, "element_index": 13, "element_type": "para", "bbox": [1050, 312, 1507, 654], "text": "One of the NASA experiments testing this solution was the BioHome, an early experiment in what the Agency called “closed ecological life support systems.” The BioHome, a tightly sealed building constructed entirely of synthetic materials, was designed as suitable for one person to live in, with a great deal of the interior occupied by houseplants. Before the houseplants were added, though, anyone entering the newly constructed facility would experience burning eyes and respiratory difficulties, two of the most common symptoms of Sick Building Syndrome. Once the plants were intro- duced to the environment, analysis of the air quality indicated that most of the VOCs had been removed, and the symptoms disappeared.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0062/output_json/page_0062.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::038", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Another one of Wolverton's discoveries is that the more air that is allowed to circulate through the roots of the plants, the more effective they are at cleaning polluted air. To take advantage of this science, Wolverton has teamed with the Japanese company, Actree Corporation, to develop what the Japanese firm is marketing as the EcoPlanter. Using high-efficiency carbon filters and a root-level circulation system, the pot allows the plant to remove approximately 200 times more VOCs than a single traditionally-potted plant can remove.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0063:e001", "document_id": "real_016_batch_16_basic_version_07", "page_number": 63, "element_index": 1, "element_type": "para", "bbox": [93, 416, 550, 668], "text": "Another one of Wolverton's discoveries is that the more air that is allowed to circulate through the roots of the plants, the more effective they are at cleaning polluted air. To take advantage of this science, Wolverton has teamed with the Japanese company, Actree Corporation, to develop what the Japanese firm is marketing as the EcoPlanter. Using high-efficiency carbon filters and a root-level circulation system, the pot allows the plant to remove approximately 200 times more VOCs than a single traditionally-potted plant can remove.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0063/output_json/page_0063.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::039", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "NASA research improves our quality of life. The technologies featured in this section: • Restore artwork • Enhance education and recreation • Reduce fat while improving flavor • Transform paint into insulation • Protect machines and the environment", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0065:e000", "document_id": "real_016_batch_16_basic_version_07", "page_number": 65, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "NASA research improves our quality of life. The technologies featured in this section: • Restore artwork • Enhance education and recreation • Reduce fat while improving flavor • Transform paint into insulation • Protect machines and the environment", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0065/output_json/page_0065.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::040", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "It is not just paint and ink that the Glenn team is experimenting on, though. The gas has biomedical applications as well. Atomic oxygen technology can be used to decontaminate orthopedic surgical hip and knee implants prior to surgery. As a result of handling, fabrication, and exposure to air, the surfaces of these implants are often contaminated with endotoxins (naturally occurring compounds found within bacteria) and other biologically active contaminants. Such contaminants contribute to inflammation, which can lead to joint loosening, pain, and even the necessity to remove the implant. Previously, there was no known chemical process which fully removed these inflammatory endotoxins without damaging the implants. Atomic oxygen, however, can oxidize endotoxins and any other organic contaminants to convert them into harmless gasses, leaving a contaminant-free surface.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0067:e006", "document_id": "real_016_batch_16_basic_version_07", "page_number": 67, "element_index": 6, "element_type": "para", "bbox": [1050, 164, 1508, 578], "text": "It is not just paint and ink that the Glenn team is experimenting on, though. The gas has biomedical applications as well. Atomic oxygen technology can be used to decontaminate orthopedic surgical hip and knee implants prior to surgery. As a result of handling, fabrication, and exposure to air, the surfaces of these implants are often contaminated with endotoxins (naturally occurring compounds found within bacteria) and other biologically active contaminants. Such contaminants contribute to inflammation, which can lead to joint loosening, pain, and even the necessity to remove the implant. Previously, there was no known chemical process which fully removed these inflammatory endotoxins without damaging the implants. Atomic oxygen, however, can oxidize endotoxins and any other organic contaminants to convert them into harmless gasses, leaving a contaminant-free surface.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0067/output_json/page_0067.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::041", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Earth from space—swirling wisps of white against a backdrop of deep azure, punctuated with brown and green swatches of land, all etched on one orb surrounded by black space, floating, seemingly isolated, but teeming with humanity and other forms of life. It is an iconic image, first captured November 10, 1967, by the Applications Technology Satellite (ATS)-3, an unmanned craft conducting payload experiments and examining the space environment. Since then, astronauts and spacecraft have sent back hundreds of pictures of Earth, and each one has had the same breathtaking effect.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0068:e002", "document_id": "real_016_batch_16_basic_version_07", "page_number": 68, "element_index": 2, "element_type": "para", "bbox": [93, 204, 550, 484], "text": "Earth from space—swirling wisps of white against a backdrop of deep azure, punctuated with brown and green swatches of land, all etched on one orb surrounded by black space, floating, seemingly isolated, but teeming with humanity and other forms of life. It is an iconic image, first captured November 10, 1967, by the Applications Technology Satellite (ATS)-3, an unmanned craft conducting payload experiments and examining the space environment. Since then, astronauts and spacecraft have sent back hundreds of pictures of Earth, and each one has had the same breathtaking effect.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0068/output_json/page_0068.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::042", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Utilizing available technology of the mid-1980s, the original EarthBall design was derived from an artist's compilation of NASA photographs and National Oceanic and Atmospheric Administration (NOAA) weather satel- lite faxes. Over the following 2 decades, as 3-D imaging software, more powerful computers, and superwide inkjet printers became readily available, Orbis employed these evolving capabilities to develop larger and more accurate world globes. Applying proprietary cartographic software to transform flat-map imagery into multiple gories (2-D tapered sections) for creating spherical globes, Orbis now designs and produces the most visually authentic replicas of Earth ever created.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0069:e004", "document_id": "real_016_batch_16_basic_version_07", "page_number": 69, "element_index": 4, "element_type": "para", "bbox": [93, 705, 551, 1022], "text": "Utilizing available technology of the mid-1980s, the original EarthBall design was derived from an artist's compilation of NASA photographs and National Oceanic and Atmospheric Administration (NOAA) weather satel- lite faxes. Over the following 2 decades, as 3-D imaging software, more powerful computers, and superwide inkjet printers became readily available, Orbis employed these evolving capabilities to develop larger and more accurate world globes. Applying proprietary cartographic software to transform flat-map imagery into multiple gories (2-D tapered sections) for creating spherical globes, Orbis now designs and produces the most visually authentic replicas of Earth ever created.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0069/output_json/page_0069.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::043", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Giant Orbis globes have been put on permanent dis- play at schools, churches, museums, libraries, and a variety of other locations. Orbis recently installed a 10-foot- diameter, internally illuminated, rotating globe in the edu- cation center at Washington's Fairchild Air Force Base; an 8-foot-diameter rotating world globe at the entrance to the new Evolving Planet exhibit in Chicago's Field Museum; and another 8-foot-diameter rotating world globe with NightGlow Cities in the new Ripley's Believe It or Not! museum in New York City's Times Square.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0071:e003", "document_id": "real_016_batch_16_basic_version_07", "page_number": 71, "element_index": 3, "element_type": "para", "bbox": [93, 821, 550, 1071], "text": "Giant Orbis globes have been put on permanent dis- play at schools, churches, museums, libraries, and a variety of other locations. Orbis recently installed a 10-foot- diameter, internally illuminated, rotating globe in the edu- cation center at Washington's Fairchild Air Force Base; an 8-foot-diameter rotating world globe at the entrance to the new Evolving Planet exhibit in Chicago's Field Museum; and another 8-foot-diameter rotating world globe with NightGlow Cities in the new Ripley's Believe It or Not! museum in New York City's Times Square.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0071/output_json/page_0071.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::044", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Diversified Services Corporation, a minority-owned business based out of Cleveland, Ohio, was able to take advantage of this NASA program for technology acquisition and development, and for introductions to potential customers and strategic partners, such as the NASA Food Technology Commercial Space Center, at Iowa State University (the center closed December 31, 2005), for taste tests and performance studies. Fresh ground beef (90-percent lean) was used to prepare hamburger patties formulated with or without 10-percent fat substitute. Hamburger patties without the added fat substitute served as the control in each experiment. Patties were weighed for evaluation of cooking yield, and then cooked to an internal temperature of 72 °C. The cooked product with or without fat sub tasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "NASA's research helps sustain the Earth and its resources. The technologies featured in this section: • Map, monitor, and manage Earth’s resources • Provide environmental data • Save energy and prolong motor life • Prevent corrosion in steel and concrete structures", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0081:e000", "document_id": "real_016_batch_16_basic_version_07", "page_number": 81, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "NASA's research helps sustain the Earth and its resources. The technologies featured in this section: • Map, monitor, and manage Earth’s resources • Provide environmental data • Save energy and prolong motor life • Prevent corrosion in steel and concrete structures", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0081/output_json/page_0081.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::051", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "SpecTIR's “ HyperSpecTIR ” suite of hyperspectral instruments incorporate visible and near infrared (VNIR) and short wavelength infrared (SWIR) sensors to capture broad, detailed imagery. The benefit of the dual-sensor approach includes a greater insight into the spectral and spatial content of a scene that is often not possible from single sources of imagery, according to SpecTIR. In agriculture, for instance, any two plants can appear similar to the casual observer, but hyperspectral imagery can reveal important spectral and spatial differences that other image sources cannot, such as chemical composition. The spatial accuracy of the imagery products conforms to accepted international mapping standards and can be incorporated into commonly used analysis packages.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0083:e010", "document_id": "real_016_batch_16_basic_version_07", "page_number": 83, "element_index": 10, "element_type": "para", "bbox": [1050, 164, 1507, 509], "text": "SpecTIR's “ HyperSpecTIR ” suite of hyperspectral instruments incorporate visible and near infrared (VNIR) and short wavelength infrared (SWIR) sensors to capture broad, detailed imagery. The benefit of the dual-sensor approach includes a greater insight into the spectral and spatial content of a scene that is often not possible from single sources of imagery, according to SpecTIR. In agriculture, for instance, any two plants can appear similar to the casual observer, but hyperspectral imagery can reveal important spectral and spatial differences that other image sources cannot, such as chemical composition. The spatial accuracy of the imagery products conforms to accepted international mapping standards and can be incorporated into commonly used analysis packages.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0083/output_json/page_0083.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::052", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Telemedicine, the remote delivery of medical care, is important to the Space Agency, because often times those who are in need of clinical care and monitoring are as far away as the International Space Station (ISS), orbit- ing roughly 240 miles above the Earth. Researchers on the ISS often have backgrounds in aeronautics, physics, geology, and engineering, and are expected to conduct a wide variety of experiments in these fields, as well as perform sophisticated repairs and construction projects. While these astronauts are always well skilled and capable, what they are usually not, are medical doctors. Even if a crewmember were a doctor, though, the strict equipment weight restrictions and tight quarters aboard the orbiting laboratory would prevent the station from supporting a clinic full of medical testing equipment. The approach of telemedicine, then, aims to give astronauts in space access to a full range of medical expertise and tests, while leaving bulky equipment and large medical staffs on the ground.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0084:e003", "document_id": "real_016_batch_16_basic_version_07", "page_number": 84, "element_index": 3, "element_type": "para", "bbox": [93, 476, 551, 923], "text": "Telemedicine, the remote delivery of medical care, is important to the Space Agency, because often times those who are in need of clinical care and monitoring are as far away as the International Space Station (ISS), orbit- ing roughly 240 miles above the Earth. Researchers on the ISS often have backgrounds in aeronautics, physics, geology, and engineering, and are expected to conduct a wide variety of experiments in these fields, as well as perform sophisticated repairs and construction projects. While these astronauts are always well skilled and capable, what they are usually not, are medical doctors. Even if a crewmember were a doctor, though, the strict equipment weight restrictions and tight quarters aboard the orbiting laboratory would prevent the station from supporting a clinic full of medical testing equipment. The approach of telemedicine, then, aims to give astronauts in space access to a full range of medical expertise and tests, while leaving bulky equipment and large medical staffs on the ground.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0084/output_json/page_0084.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_a an use this system to track supplies of ARV drugs and ensure that sufficient supplies are in areas where the drugs are currently most needed, as well as conduct virtual training classes. With these classes, doc- tors at hospitals can telementor clinic staff and spread the medical expertise from hospitals to the remote villages. Like in Vietnam, this Ethiopian network will also be used to track the spread of bird flu.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0087:e011", "document_id": "real_016_batch_16_basic_version_07", "page_number": 87, "element_index": 11, "element_type": "para", "bbox": [1050, 631, 1508, 1047], "text": "The InteleCell sensors designed for this deployment interface with PDA sensors that provide patient infor- mation, interact with radio frequency identification tags on medical and blood product packages, and also provide real-time, two-way, self-powered video telecom- munication. They are part of a large-scale antiretroviral (ARV) study, for which patients receiving treatment are regularly monitored at clinics, and the information is then collected, reviewed, and analyzed at the hospitals. The hospitals can use this system to track supplies of ARV drugs and ensure that sufficient supplies are in areas where the drugs are currently most needed, as well as conduct virtual training classes. With these classes, doc- tors at hospitals can telementor clinic staff and spread the medical expertise from hospitals to the remote villages. Like in Vietnam, this Ethiopian network will also be used to track the spread of bird flu.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0087/output_json/page_0087.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::055", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Escalators and elevators with motor-generator (MG) sets are prime examples of the types of machinery that benefit from energy savings the device provides. Take, for example, an escalator: Sometimes it is full of people; sometimes it may have a single passenger; and other times it may be empty. The motor inside the escalator must be large enough to handle the maximum possible load — a full escalator — but that rarely happens. When the escalator has few passengers, the motor driving it is lightly loaded and wasting energy. This waste of energy is addressed by the Power Efficiency energy-saving soft start, as it senses the load and instructs the motor to use just the right amount of energy (usually much less) for the job.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0088:e012", "document_id": "real_016_batch_16_basic_version_07", "page_number": 88, "element_index": 12, "element_type": "para", "bbox": [1050, 342, 1507, 668], "text": "Escalators and elevators with motor-generator (MG) sets are prime examples of the types of machinery that benefit from energy savings the device provides. Take, for example, an escalator: Sometimes it is full of people; sometimes it may have a single passenger; and other times it may be empty. The motor inside the escalator must be large enough to handle the maximum possible load — a full escalator — but that rarely happens. When the escalator has few passengers, the motor driving it is lightly loaded and wasting energy. This waste of energy is addressed by the Power Efficiency energy-saving soft start, as it senses the load and instructs the motor to use just the right amount of energy (usually much less) for the job.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0088/output_json/page_0088.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::056", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Direct customers of Power Efficiency Corporation's energy-saving soft start include Seattle-Tacoma International Airport and Honolulu International Airport, as well as the Toronto and Anchorage airports. In airports, the devices often control escalators and moving walkways. The device can also be found ractical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Surrteat is the ideal partner to bring this technology to the public, as the company has a proven record of providing full-service, innovative, and technical solutions for the restoration and prevention of deterioration and corrosion in steel-reinforced concrete structures. Their Total Performance System provides diagnostic testing and site analysis to identify the scope of problems for each project, manufactures and prescribes site-specific solutions, controls material application, and verifies performance through follow-up testing and analysis.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0091:e003", "document_id": "real_016_batch_16_basic_version_07", "page_number": 91, "element_index": 3, "element_type": "para", "bbox": [94, 865, 551, 1122], "text": "Surrteat is the ideal partner to bring this technology to the public, as the company has a proven record of providing full-service, innovative, and technical solutions for the restoration and prevention of deterioration and corrosion in steel-reinforced concrete structures. Their Total Performance System provides diagnostic testing and site analysis to identify the scope of problems for each project, manufactures and prescribes site-specific solutions, controls material application, and verifies performance through follow-up testing and analysis.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0091/output_json/page_0091.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::058", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Techniques for system tests include using Finite Elements (FE) and FE model updating tools, system identification, and using various other tools for performing optical analyses. These techniques, however, do not provide for analysis of cross-disciplinary results. Therefore, the conventional approach is to develop a requirement budget that assigns error allocations to each of the modeling teams. This approach is extremely limiting in that it does not allow requirements to be freely traded among subsystems. NASA, intent on sending larger, more powerful optics into space, resolved to find a better way to test them.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0094:e007", "document_id": "real_016_batch_16_basic_version_07", "page_number": 94, "element_index": 7, "element_type": "para", "bbox": [571, 385, 1029, 677], "text": "Techniques for system tests include using Finite Elements (FE) and FE model updating tools, system identification, and using various other tools for performing optical analyses. These techniques, however, do not provide for analysis of cross-disciplinary results. Therefore, the conventional approach is to develop a requirement budget that assigns error allocations to each of the modeling teams. This approach is extremely limiting in that it does not allow requirements to be freely traded among subsystems. NASA, intent on sending larger, more powerful optics into space, resolved to find a better way to test them.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0094/output_json/page_0094.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::059", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "The Toolbox allows the definition of process parameters as explicit functions of the coupled model, further enabling the exact definition of sensitivities. It also includes a number of functions that analyze the coupled system model and provide for redesign, including: critical parameter analysis that formally identifies the design variables that have the highest influence on system performance, risk, and cost; optimization of design objective functions subject to constraints on design variables; formal system trading using an isoperformance", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0095:e004"  "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::068", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "In the realm of sports, there is one unique application that may eventually see the light of day as a commercial product. Under the tutelage of Jensen, a group of BYU engineering students used the intertwining IsoTruss composite materials (carbon fiber and Kevlar, in this case) to construct a mountain bike. The longitudinal frame tubes were designed to resist all axial and bending loads, while other IsoTruss parts were used to support transverse sheer and torsion loads. A clear sheathing was placed over some of the tubes to protect them from the dirt and mud that can kick up during a ride. The students involved with the project are touting the bike frame to be lighter, more aerodynamic, and less breakable than many top-of-the- line carbon fiber frames.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0109:e012", "document_id": "real_016_batch_16_basic_version_07", "page_number": 109, "element_index": 12, "element_type": "para", "bbox": [1050, 675, 1507, 1014], "text": "In the realm of sports, there is one unique application that may eventually see the light of day as a commercial product. Under the tutelage of Jensen, a group of BYU engineering students used the intertwining IsoTruss composite materials (carbon fiber and Kevlar, in this case) to construct a mountain bike. The longitudinal frame tubes were designed to resist all axial and bending loads, while other IsoTruss parts were used to support transverse sheer and torsion loads. A clear sheathing was placed over some of the tubes to protect them from the dirt and mud that can kick up during a ride. The students involved with the project are touting the bike frame to be lighter, more aerodynamic, and less breakable than many top-of-the- line carbon fiber frames.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0109/output_json/page_0109.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::069", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "In 2003, Epitaxial Technologies LLC was awarded a Small Business Innovation Research (SBIR) contract from Goddard Space Flight Center to help NASA address its need for advanced sensor components and systems for deep space and Mars missions. A Baltimore-based manufacturer and supplier of highly differentiated sensor components for the aerospace, defense, and telecommunications industries, Epitaxial Technologies had previously developed an ultra-sensitive photoreceiver for the U.S. Air Force and the U.S. Department of Defense's Defense Advanced Research Projects Agency (DARPA). According to the company, this photoreceiver was based on the monolithic integration of photodiode detectors, optical amplifiers, and electronic amplifiers on a single chip; possessed a level of sensitivity higher than competing sensors; and could transmit an extremely high rate of data from extremely far distances.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0110:e010", "document_id": "real_016_batch_16_basic_version_07", "page_number": 110, "element_index": 10, "element_type": "para", "bbox": [1050, 405, 1508, 825], "text": "In 2003, Epitaxial Technologies LLC was awarded a Small Business Innovation Research (SBIR) contract from Goddard Space Flight Center to help NASA address its need for advanced sensor components and systems for deep space and Mars missions. A Baltimore-based manufacturer and supplier of highly differentiated sensor components for the aerospace, defense, and telecommunications industries, Epitaxial Technologies had previously developed an ultra-sensitive photoreceiver for the U.S. Air Force and the U.S. Department of Defense's Defense Advanced Research Projects Agency (DARPA). According to the company, this photoreceiver was based on the monolithic integration of photodiode detectors, optical amplifiers, and electronic amplifiers on a single chip; possessed a level of sensitivity higher than competing sensors; and could transmit an extremely high rate of data from extremely far distances.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0110/output_json/page_0110.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::070", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "There is also great potential for Epitaxial Technologies' photoreceiver in military and civilian active laser imaging and free-space laser communication. These two applications focus on the transmission of laser energy through the atmosphere. During these transmissions, many problems related to signal reception and interference can occur, affecting functions such as laser pointing, tracking, and speckle (light patterns resulting from the reflection of coherent light at rough surfaces), as well as information processing. Typically, electronic amplification of the received optical signal is applied to alleviate these problems; however, this approach can create more noise. Epitaxial Technologies' answer to this is to apply optical amplification techniques at the chip level to increase signal strength with minimum noise amplification and, thus, increase the transmission distance and overcome atmospheric attenuation.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0111:e003", "document_id": "real_016_batch_16_basic_version_07", "page_number": 111, "element_index": 3, "element_type": "para", "bbox": [93, 699, 550, 1120], "text": "There is also great potential for Epitaxial Technologies' photoreceiver in military and civilian active laser imaging and free-space laser communication. These two applications focus on the transmission of laser energy through the atmosphere. During these transmissions, many problems related to signal reception and interference can occur, affecting functions such as laser pointing, tracking, and speckle (light patterns resulting from the reflection of coherent light at rough surfaces), as well as information processing. Typically, electronic amplification of the received optical signal is applied to alleviate these problems; however, this approach can create more noise. Epitaxial Technologies' answer to this is to apply optical amplification techniques at the chip level to increase signal strength with minimum noise amplification and, thus, increase the transmission distance and overcome atmospheric attenuation.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0111/output_json/page_0111.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::071", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "The technique Valenzuela developed was an advanced form of micro-electrical discharge machining (micro- EDM) to make tiny holes in the ammonia evaporator. The evaporator relied on droplet impingement cooling to achieve high heat flux and low thermal resistance. Many thousands of small nozzles were required to “ print ” a thin layer of ammonia over the surface of the evaporator. However, no technology existed at that time for the fabri- cation of suitably shaped micro-nozzles in metals. Mikros' micro-EDM technology was developed to meet this need. Micro-EDM is an erosion process, in which electrical discharges between two electrodes (one on the tool, and the other on the conductive work surface) machine very small holes, channels, and cavities.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0113:e002", "document_id": "real_016_batch_16_basic_version_07", "page_number": 113, "element_index": 2, "element_type": "para", "bbox": [93, 314, 550, 656], "text": "The technique Valenzuela developed was an advanced form of micro-electrical discharge machining (micro- EDM) to make tiny holes in the ammonia evaporator. The evaporator relied on droplet impingement cooling to achieve high heat flux and low thermal resistance. Many thousands of small nozzles were required to “ print ” a thin layer of ammonia over the surface of the evaporator. However, no technology existed at that time for the fabri- cation of suitably shaped micro-nozzles in metals. Mikros' micro-EDM technology was developed to meet this need. Micro-EDM is an erosion process, in which electrical discharges between two electrodes (one on the tool, and the other on the conductive work surface) machine very small holes, channels, and cavities.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0113/output_json/page_0113.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::072", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Engineers at NASA's Stennis Space Center work with the Institute for Technology Development (ITD), a nonprofit research company located onsite at Stennis, to develop new hyperspectral imaging technologies. ITD has been at the forefront of imaging technologies since it opened nearly 20 years ago, revolutionizing the fields of high-resolution imaging and measurement technology, with a focus on transferring this newfound technology to industry. Recent work led to reduced sensor sizes, elimi- nation of the need for either the sensor or target to be in motion in order to obtain images, and the development of a portable hyperspectral imaging device applicable for a wide variety of uses.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0114:e005", "document_id": "real_016_batch_16_basic_version_07", "page_number": 114, "element_index": 5, "element_type": "para", "bbox": [93, 799, 550, 1121], "text": "Engineers at NASA's Stennis Space Center work with the Institute for Technology Development (ITD), a nonprofit research company located onsite at Stennis, to develop new hyperspectral imaging technologies. ITD has been at the forefront of imaging technologies since it opened nearly 20 years ago, revolutionizing the fields of high-resolution imaging and measurement technology, with a focus on transferring this newfound technology to industry. Recent work led to reduced sensor sizes, elimi- nation of the need for either the sensor or target to be in motion in order to obtain images, and the development of a portable hyperspectral imaging device applicable for a wide variety of uses.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0114/output_json/page_0114.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::073", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "The EagleEye VNIR 100E spans the spectrum from the visible to infrared, measuring the reflected energy of the target at hundreds of narrow wavelengths. It incorpo- rates a patented line-scanning technique that eliminates the need for relative movement between the target and the sensor, which eliminates the need for liquid crystal tunable filters, which suffer from relatively low through- put. The EagleEye uses a prism-grating prism to separate incoming light into component wavelengths, a method that loses less energy and is, therefore, especially useful in situations where high signal-to-noise ratios are important. Each image created by the VNIR 100E contains a com- plete reflectance spectrum from 400 to 1,000 nanometers for every picture element in the image.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0115:e001", "document_id": "real_016_batch_16_basic_version_07", "page_number": 115, "element_index": 1, "element_type": "para", "bbox": [93, 264, 551, 605], "text": "The EagleEye VNIR 100E spans the spectrum from the visible to infrared, measuring the reflected energy of the target at hundreds of narrow wavelengths. It incorpo- rates a patented line-scanning technique that eliminates the need for relative movement between the target and the sensor, which eliminates the need for liquid crystal tunable filters, which suffer from relatively low through- put. The EagleEye uses a prism-grating prism to separate incoming light into component wavelengths, a method that loses less energy and is, therefore, especially useful in situations where high signal-to-noise ratios are important. Each image created by the VNIR 100E contains a com- plete reflectance spectrum from 400 to 1,000 nanometers for every picture element in the image.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0115/output_json/page_0115.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::074", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "The composites have been used in industrial heating applications, the automotive and aerospace industries, as well as in glass manufacturing and on semiconductors. C-C composites have been used in industrial heating fixtures in the form of structural flat panels, structural members for panel support, and for nuts and bolts. In the automotive industry, the composites have been useful for engine components, brakes, cylinder liners, and panels. Aerospace applications have included missile bodies, leading edges, and structured components. Applications also include transfer components for glass manufacturing and structural members for carrier support in semiconductor processing. $\\diamond$", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0117:e010", "document_id": "real_016_batch_16_basic_version_07", "page_number": 117, "element_index": 10, "element_type": "para", "bbox": [1049, 677, 1508, 992], "text": "T ese are just a few examples of the highly specialized equipment the researchers at the Mechanical Components Branch have at their disposal.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0118/output_json/page_0118.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::076", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "While the product is available in a variety of sizes, ranging from 1 square inch to 100-foot lengths, the company notes that it is most efficient over large spaces, as this allows the user to get the most advantage of its unique cost- and energy-saving properties. Thin-film flexibility allows it to be mounted to a variety of objects, and it maintains flexibility through a full range of temperatures. The company has services to assist customers with determining the right dimensions and designs they will require for a specific job.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0119:e014", "document_id": "real_016_batch_16_basic es in the manufacturing process, ultimately enhancing the process by increasing yield and production capacity. Once the process was tweaked, ISM was ready to com- mercialize its products, and the inexpensive, robust nanotubes are now in the hands of the scientists who will create the next generation of composite polymers, metals, and ceramics that will impact the way we live. In fact, researchers are examining ways for these newfound materials to be used in the manufacture of transistors and fuel cells, large screen televisions, ultra-sensitive sensors, high-resolution atomic force microscopy probes, super- capacitors, transparent conducting films, drug carriers, catalysts, and advanced composite materials, to name just a few.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0121:e004", "document_id": "real_016_batch_16_basic_version_07", "page_number": 121, "element_index": 4, "element_type": "para", "bbox": [93, 700, 550, 1121], "text": "Once the license was granted, ISM then worked with Benavides and the University of Idaho's Electron Microscopy Center to examine and improve upon vari- ables in the manufacturing process, ultimately enhancing the process by increasing yield and production capacity. Once the process was tweaked, ISM was ready to com- mercialize its products, and the inexpensive, robust nanotubes are now in the hands of the scientists who will create the next generation of composite polymers, metals, and ceramics that will impact the way we live. In fact, researchers are examining ways for these newfound materials to be used in the manufacture of transistors and fuel cells, large screen televisions, ultra-sensitive sensors, high-resolution atomic force microscopy probes, super- capacitors, transparent conducting films, drug carriers, catalysts, and advanced composite materials, to name just a few.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_ . If one applies a voltage to the MFC it will stretch, and if attached to a structure it will cause the surface to bend. The major advantages of a piezofiber composite actuator are higher performance, flexibility, and durability, compared to a traditional piezoceramic actuator.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0122/output_json/page_0122.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::079", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "A NASA partnership gives a small company access to research and technologies that allow it to compete with larger corporations. According to Thomas Daue, with Smart Material Corporation, “ For a small business, it is almost not possible anymore to spend the money for basic research in high tech products. Licensing technology from the leading research facilities in this country is a very cost effective way to become a player in a new technology field. Many developments ready for licensing at govern- ment-owned facilities have a
