ploration.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0128/output_json/page_0128.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::083", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "New Horizons came to within 1.4 million miles of Jupiter on February 28, 2007, using the planet's gravity to trim 3 years from its travel time to Pluto. For several weeks before and after this closest approach, the piano- sized robotic probe trained its 7 cameras and sensors on Jupiter and its 4 largest moons, storing data from nearly 700 observations on its digital recorders and gradually sending that information back to Earth. Nearly all of the expected 34 gigabits of data has come back so far, radioed to NASA's largest antennas over more than 600 million miles. This activity confirmed the successful testing of the instruments and operating software the spacecraft will use at Pluto.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0130:e004", "document_ on.", "gold_answer_draft": "The hot gas in this collision was slowed by a drag force, similar to air resistance. In contrast, the dark matter was not slowed by the impact, because it does not interact directly with itself or the gas except through gravity. This produced the separation of the dark and normal matter seen in the data. If hot gas was the most massive com- ponent in the clusters, as proposed by alternative gravity theories, such a separation would not have been seen. Instead, dark matter is required.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0131:e010", "document_id": "real_016_batch_16_basic_version_07", "page_number": 131, "element_index": 10, "element_type": "para", "bbox": [1050, 729, 1508, 949], "text": "The hot gas in this collision was slowed by a drag force, similar to air resistance. In contrast, the dark matter was not slowed by the impact, because it does not interact directly with itself or the gas except through gravity. This produced the separation of the dark and normal matter seen in the data. If hot gas was the most massive com- ponent in the clusters, as proposed by alternative gravity theories, such a separation would not have been seen. Instead, dark matter is required.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0131/output_json/page_0131.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::085", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113 /datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0133/output_json/page_0133.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::086", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Each Voyager logs approximately 1 million miles per day and carries five science instruments that study the solar wind, energetic particles, magnetic fields, and radio waves as they cruise through this unexplored region of deep space. While the spacecraft are now too far from the Sun to use solar power, their long-lived radioisotope ther- moelectric generators provide the necessary power of less than 300 watts (the amount of power needed to light up a bright light bulb). The Voyagers call home via NASA's Deep Space Network, a system of antennas around the world. The spacecraft are so distant that commands from Earth, traveling at light speed, take 14 hours one-way to reach Voyager 1 and 12 hours to reach Voyager 2.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0134:e008", "document_id": "real_016_batch_16_basic_version_07", "page_number": 134, "element_index": 8, "element_type": "para", "bbox": [1049, 653, 1509, 973], "text": "Each Voyager logs approximately 1 million miles per day and carries five science instruments that study the solar wind, energetic particles, magnetic fields, and radio waves as they cruise through this unexplored region of deep space. While the spacecraft are now too far from the Sun to use solar power, their long-lived radioisotope ther- moelectric generators provide the necessary power of less than 300 watts (the amount of power needed to light up a bright light bulb). The Voyagers call home via NASA's Deep Space Network, a system of antennas around the world. The spacecraft are so distant that commands from Earth, traveling at light speed, take 14 hours one-way to reach Voyager 1 and 12 hours to reach Voyager 2.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0134/output_json/page_0134.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::087", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Driven by the Vision for Space Exploration and guided by the NASA Authorization Act of 2005, the United States will take the next steps in human space exploration with thoughtful preparation and global partnership. NASA is tackling the challenging questions of how, why, and when the United States will return to the Moon. To date, NASA has worked with more than 1,000 people around the world to craft an initial strategy. NASA has sought perspectives on exploration strategy from 13 international space agencies, as well as U.S. entities including the space industry, academia, and other government organizations. The Agency issued a request for information and held international meetings, teleconferences, and bilateral exchanges. From the process, NASA characterized 6 strategic themes and prioritized 188 objectives that were synthesized from 800 potential strategic objectives.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0135:e005", "document_id": "real_016_batch_16_basic_version_07", "page_number": 135, "element_index": 5, "element_type": "para", "bbox": [93, 610, 552, 1001], "text": "Driven by the Vision for Space Exploration and guided by the NASA Authorization Act of 2005, the United States will take the next steps in human space exploration with thoughtful preparation and global partnership. NASA is tackling the challenging questions of how, why, and when the United States will return to the Moon. To date, NASA has worked with more than 1,000 people around the world to craft an initial strategy. NASA has sought perspectives on exploration strategy from 13 international space agencies, as well as U.S. entities including the space industry, academia, and other government organizations. The Agency issued a request for information and held international meetings, teleconferences, and bilateral exchanges. From the process, NASA characterized 6 strategic themes and prioritized 188 objectives that were synthesized from 800 potential strategic o c explorers and the ability to perform preliminary chemical and mineralogical analyses on geologic samples. The geoscience activities performed on the Moon will help provide the equipment and techniques that will enable the efficient geologic exploration of Mars and other destinations in the solar system. In addition, the knowledge gained on the basic geologic processes, such as meteoritic impact and volcanism, will help scientists better understand how these processes occur throughout the solar system. NASA can also pursue other science such as space physics and astronomy under this architecture. The science that is pursued will be under the purview and selection processes of NASA's Science Mission Directorate.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0138:e004", "document_id": "real_016_batch_16_basic_version_07", "page_number": 138, "element_index": 4, "element_type": "para", "bbox": [572, 164, 1030, 558], "text": "investigation of the layered nature and formation process of the lunar regolith and study of lunar volatiles. Field operations will include use of teleoperated robotic explorers and the ability to perform preliminary chemical and mineralogical analyses on geologic samples. The geoscience activities performed on the Moon will help provide the equipment and techniques that will enable the efficient geologic exploration of Mars and other destinations in the solar system. In addition, the knowledge gained on the basic geologic processes, such as meteoritic impact and volcanism, will help scientists better understand how these processes occur throughout the solar system. NASA can also pursue other science such as space physics and astronomy under this architecture. The science that is pursued will be under the purview and selection processes of NASA's Science Mission Directorate.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_ rivate sector, including the engineering expertise and manufacturing infrastructure to support large scale production. Some of this economic spinoff will be realized by existing large-scale energy providers. However, as with any new technological development, new players also emerge — both small and large. Further, the basic technology for alternative avia- tion fuels is likely to apply to other markets as well. In fact, the broader the general markets for the technology and fuel products, the lower the costs and greater the benefits to the aviation community.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0141:e002", "document_id": "real_016_batch_16_basic_version_07", "page_number": 141, "element_index": 2, "element_type": "para", "bbox": [93, 629, 550, 1022], "text": "If this work is successful, it has the potential to gener- ate significant commercial opportunities that can extend well beyond the aviation community. NASA will not produce new fuels, nor will the Federal government, in general. The knowledge and capability to produce alternative fuels will reside in the private sector, including the engineering expertise and manufacturing infrastructure to support large scale production. Some of this economic spinoff will be realized by existing large-scale energy providers. However, as with any new technological development, new players also emerge — both small and large. Further, the basic technology for alternative avia- tion fuels is likely to apply to other markets as well. In fact, the broader the general markets for the technology and fuel products, the lower the costs and greater the benefits to the aviation community.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0141/output_json/page_0141.json", "future_node_mapping": "pending_evidence_node_assembly"}], "dif ads. The light ema- nating from the pads can deter the adults from coming ashore to lay their eggs and disorient the hatchlings as they emerge from their nests and head toward the moonlit sea. To help preserve the balance of its natural surroundings, Kennedy's environmental management system has as one of its goals to minimize controllable impacts to wildlife, including the nesting sea turtles.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0143:e003", "document_id": "real_016_batch_16_basic_version_07", "page_number": 143, "element_index": 3, "element_type": "para", "bbox": [93, 509, 550, 900], "text": "On Launch Pad 39A at NASA's Kennedy Space Center, the Space Shuttle Endeavour sat bathed in glow- ing light, silhouetting the vehicle against the dark night sky over the seaside complex. An awesome scene in an idyllic location, and a striking counterpoint to the nesting sea turtles and their newly hatched babies on the nearby shore. During their summer nesting season, these turtles emerge from the ocean along the pristine beach within 200 yards of the space shuttle launch pads. The light ema- nating from the pads can deter the adults from coming ashore to lay their eggs and disorient the hatchlings as they emerge from their nests and head toward the moonlit sea. To help preserve the balance of its natural surroundings, Kennedy's environmental management system has as one of its goals to minimize controllable impacts to wildlife, including the nesting sea turtles.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0143/output_json/page_0143.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false s/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "“ Through numerous studies, we have shown the effectiveness of the data generated by this sensor for many scientific uses, including carbon removal, fire prediction, and habitat identification, ” said LVIS project researcher Ralph Dubayah, a professor in the University of Maryland's Department of Geography. “ Lidar technology like LVIS measures the vertical structure of the trees and ground, setting it apart from other remote-sensing systems that provide detailed horizontal information that tells us little about whether a green patch of forest is short or tall, for example. When identifying habitats, the vertical structure of the vegetation is of paramount importance to many species, including a bird like the ivory-bill. ”", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0156:e009", "document_id": "real_016_batch_16_basic_version_07", "page_number": 156, "element_index": 9, "element_type": "para", "bbox": [572, 705, 1030, 1023], "text": "“ Through numerous studies, we have shown the effectiveness of the data generated by this sensor for many scientific uses, including carbon removal, fire prediction, and habitat identification, ” said LVIS project researcher Ralph Dubayah, a professor in the University of Maryland's Department of Geography. “ Lidar technology like LVIS measures the vertical structure of the trees and ground, setting it apart from other remote-sensing systems that provide detailed horizontal information that tells us little about whether a green patch of forest is short or tall, for example. When identifying habitats, the vertical structure of the vegetation is of paramount importance to many species, including a bird like the ivory-bill. ”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0156/output_json/page_0156.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::102", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "This image depicts amounts of plant life on Earth. On land, the dark greens show where there is abundant vegetation, and the tan colors show relatively sparse plant cover. In the ocean, red, yellow, and green areas show higher levels of phytoplankton, and these are regions of the ocean that are the most productive over time, while blue and purple areas show where there is very little phytoplankton.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0157:e001", "document_id": "real_016_batch_16_basic_version_07", "page_number": 157, "element_index": 1, "element_type": "cap", "bbox": [93, 716, 1020, 796], "text": "This image depicts amounts of plant life on Earth. On land, the dark greens show where there is abundant vegetation, and the tan colors show relatively sparse plant cover. In the ocean, red, yellow, and green areas show higher levels of phytoplankton, and these are regions of the ocean that are the most productive over time, while blue and purple areas show where there is very little phytoplankton.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0157/output_json/page_0157.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::103", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "Why the hyperbole? The temperature variations (about 10 parts per million) make life possible. Without them, no stars or galaxies or planets would have formed. These variations—a little more heat here, a little less there—pointed to density differences, regions with a little more matter and a little less matter. Through gravity, over the course of billions of years—in a cosmic take on the “rich get richer” idea—those denser and warmer pock- ets attracted more matter and heat, which ultimately gave rise to the stars, galaxies, and hierarchical structure we see today.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0159:e012", "document_id": "real_016_batch_16_basic_version_07", "page_number": 159, "element_index": 12, "element_type": "para", "bbox": [571, 838, 1028, 1121], "text": "Why the hyperbole? The temperature variations (about 10 parts per million) make life possible. Without them, no stars or galaxies or planets would have formed. These variations—a little more heat here, a little less there—pointed to density differences, regions with a little more matter and a little less matter. Through gravity, over the course of billions of years—in a cosmic take on the “rich get richer” idea—those denser and warmer pock- ets attracted more matter and heat, which ultimately gave rise to the stars, galaxies, and hierarchical structure we see today.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0159/output_json/page_0159.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::104", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "In August 2006, Mather and the COBE team won the 2006 Gruber Cosmology Prize, also for the Big Bang discoveries. Along with the scientists mentioned above, the recipients of this award include the members of the COBE Science Working Group: Eli Dwek, S. Harvey Moseley, Robert F. Silverberg, and Nancy Boggess (retired), of Goddard; Edward Cheng, formerly with Goddard and now president of Conceptual Analytics LLC; Samuel Gulkis and Michael A. Janssen, of NASA's Jet Propulsion Laboratory (JPL); Rainer Weiss, of the Massachusetts Institute of Technology; Stephan Meyer, of the University of Chicago; Philip Lubin, of the University of California, Santa Barbara; Edward Wright, of the University of California, Los Angeles; Thomas Murdock, of Frontier Technology Inc.; and the estate of the late David T. Wilkinson, of Princeton University.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0160:e006", "document_id": "real_016_batch_16_basic_version_07", "page_number": 160, "element_index": 6, "element_type": "para", "bbox": [571, 164, 1030, 567], "text": "In August 2006, Mather and the COBE team won the 2006 Gruber Cosmology Prize, also for the Big Bang discoveries. Along with the scientists mentioned above, the recipients of this award include the members of the COBE Science Working Group: Eli Dwek, S. Harvey Moseley, Robert F. Silverberg, and Nancy Boggess (retired), of Goddard; Edward Cheng, formerly with Goddard and now president of Conceptual Analytics LLC; Samuel Gulkis and Michael A. Janssen, of NASA's Jet Propulsion Laboratory (JPL); Rainer Weiss, of the Massachusetts Institute of Technology; Stephan Meyer, of the University of Chicago; Philip Lubin, of the University of California, Santa Barbara; Edward Wright, of the University of California, Los Angeles; Thomas Murdock, of Frontier Technology Inc.; and the estate of the late David T. Wilkinson, of Princeton University.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0160/output_json/page_0160.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::105", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "To find out how well NASA satellites could detect these factors, researchers first sampled live fuel mois- ture, a critical measure for assessing fire danger, from several different plant species in sites across Los Angeles County. The ground-based data, collected by the Los Angeles County Fire Department over a 5-year period, were then compared to greenness and moisture mea- sures from NASA's Moderate Resolution Imaging Spectroradiometer (MODIS) and Airborne Visible/ Infrared Imaging Spec-trometer (AVIRIS) instruments. The space-based data were often closely linked to the field measurements, suggesting the instruments can be used to determine when conditions are favorable for wildfires.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0162:e009", "document_id": "real_016_batch_16_basic_ : "Developed at Johnson to provide microbial control for drinking water systems for the space shuttle and the International Space Station, the Microbial Check Valve is now an integral component in water purification systems in rural areas and developing countries around the world. Johnson engineers joined the Water Security Corporation, of Sparks, Nevada, and Umpqua Research Company, of Myrtle Creek, Oregon, as inductees for developing the technology. Retired NASA employee Richard Sauer received an individual award for his work on the Microbial Check Valve while he was the manager of Shuttle Water Quality at Johnson.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0163:e003", "document_id": "real_016_batch_16_basic_version_07", "page_number": 163, "element_index": 3, "element_type": "para", "bbox": [93, 780, 551, 1072], "text": "Developed at Johnson to provide microbial control for drinking water systems for the space shuttle and the International Space Station, the Microbial Check Valve is now an integral component in water purification systems in rural areas and developing countries around the world. Johnson engineers joined the Water Security Corporation, of Sparks, Nevada, and Umpqua Research Company, of Myrtle Creek, Oregon, as inductees for developing the technology. Retired NASA employee Richard Sauer received an individual award for his work on the Microbial Check Valve while he was the manager of Shuttle Water Quality at Johnson.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0163/output_json/page_0163.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candidate", "question_design": "dense_magazine_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "dense_magazine_v1::real_016_batch_16_basic_version_07::107", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "In the section “this article”, what technical mechanism, constraint, comparison, or practical outcome is established by the cited passage? Include any condition that qualifies the conclusion.", "gold_answer_draft": "The Innovative Partnerships Program creates partnerships with industry, academia, and other sources to develop and transfer technology in support of national priorities and NASA's missions. The programs and activities resulting from the partnerships engage innovators and enterprises to fulfill NASA's mission needs and promote the potential of NASA technology.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0165:e000", "document_id": "real_016_batch_16_basic_version_07", "page_number": 165, "element_index": 0, "element_type": "para", "bbox": [0, 406, 1598, 1123], "text": "The Innovative Partnerships Program creates partnerships with industry, academia, and other sources to develop and transfer technology in support of national priorities and NASA's missions. The programs and activities resulting from the partnerships engage innovators and enterprises to fulfill NASA's mission needs and promote the potential of NASA technology.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0165/output_json/page_0165.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "dense_review_candid function render(){const q=search.value.toLowerCase(),c=corpus.value,d=doc.value,s=statusSel.value;const visible=rows.filter(r=>{const hay=[r.question,r.gold_answer_draft,r.document_id,...r.gold_evidence_draft.map(e=>e.text)].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!c||r.corpus===c)&&(!d||r.document_id===d)&&(!s||status(r)===s)});const pages=Math.max(1,Math.ceil(visible.length/PAGE_SIZE));pageNo=Math.min(pageNo,pages-1);const shown=visible.slice(pageNo*PAGE_SIZE,(pageNo+1)*PAGE_SIZE);count.textContent=`显示 ${visible.length} / ${rows.length} 条 · 第 ${pageNo+1}/${pages} 页 · 已接受 ${rows.filter(r=>status(r)==='ACCEPT').length} · 已标记问题 ${rows.filter(r=>status(r)==='FLAG').length}`;cards.innerHTML=shown.length?shown.map(r=>{const rv=get(r),ev=r.gold_evidence_draft.map(e=>`<div class="unit"><div class="tags"><span class="tag">${esc(e.evidence_unit_id)}</span><span class="tag">${esc(e.page_number??e.page_id)}</span><span class="tag">${esc(e.element_type)}</span></div><div class="quote">${esc(e.text)}</div><div class="path">${esc(e.source_json||e.source_node_file||'')}</div>${e.source_page_image?`<div class="path">page image: ${esc(e.source_page_image)}</div>`:''}</div>`).join('');const issue=['unsupported_answer','weak_evidence','ambiguous_question','too_easy','too_hard','duplicate','other'].map(x=>`<label><input type="checkbox" data-id="${esc(r.draft_id)}" data-issue="${x}" ${(rv.issues||[]).includes(x)?'checked':''}> ${x}</label>`).join('');return `<article class="card ${esc(status(r))}"><div class="meta"><span class="tag">${esc(r.draft_id)}</span><span class="tag">${esc(r.corpus)}</span><span class="tag">${esc(r.document_id)}</span><span class="tag">${esc(r.question_type_actual)}</span></div><div class="q">${esc(r.question)}</div><div class="answer"><b>Candidate gold answer</b><br>${esc(r.gold_answer_draft)}</div><div class="evidence"><b>Evidence</b>${ev}</div><div class="review"><select class="decision" data-id="${esc(r.draft_id)}"><option>UNREVIEWED</option><option>ACCEPT</option><option>REVISE</option><option>FLAG</option><option>REJECT</option></select><textarea class="notes" data-id="${esc(r.draft_id)}" placeholder="直接写下要修改什么、答案哪里不对、应补什么证据…">${esc(rv.notes||'')}</textarea></div><div class="issues">${issue}</div></article>`}).join(''):'<p class="empty">没有符合筛选条件的条目。</p>';document.querySelectorAll('.decision').forEach(x=>{x.value=status({draft_id:x.dataset.id});x.onchange=()=>{state[x.dataset.id]={...(state[x.dataset.id]||{}),status:x.value,updated_at:new Date().toISOString()};save();render()}});document.querySelectorAll('.notes').forEach(x=>x.oninput=()=>{state[x.dataset.id]={...(state[x.dataset.id]||{}),notes:x.value,updated_at:new Date().toISOString()};save()});document.querySelectorAll('[data-issue]').forEach(x=>x.onchange=()=>{let a=state[x.dataset.id]||{};let z=new Set(a.issues||[]);x.checked?z.add(x.dataset.issue):z.delete(x.dataset.issue);state[x.dataset.id]={...a,issues:[...z],updated_at:new Date().toISOString()};save()});}
const search=document.querySelector('#search'),corpus=document.querySelector('#corpus'),doc=document.querySelector('#doc'),statusSel=document.querySelector('#status'),count=document.querySelector('#count'),cards=document.querySelector('#cards');[search,corpus,doc,statusSel].forEach(x=>x.oninput=x.onchange=()=>{pageNo=0;render()});document.querySelector('#prev').onclick=()=>{pageNo=Math.max(0,pageNo-1);render();scrollTo(0,0)};document.querySelector('#next').onclick=()=>{pageNo++;render();scrollTo(0,0)};document.querySelector('#export').onclick=()=>{const out=rows.map(r=>({...r,review:{status:status(r),issues:get(r).issues||[],notes:get(r).notes||'',updated_at:get(r).updated_at||null}}));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='all_qa_review_decisions.json';a.click();URL.revokeObjectURL(a.href)};document.querySelector('#clear').onclick=()=>{if(confirm('清除本浏览器的全部审阅标记？')){try{localStorage.removeItem(KEY)}catch(e){} location.reload()}};render();
</script></body></html>
