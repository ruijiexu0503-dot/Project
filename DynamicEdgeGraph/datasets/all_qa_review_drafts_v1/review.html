 engineers read flow data from their desks. The system had to be specially designed to make it impervious to hackers. \"Graftel has really incorporated our plate into a total solution for the nuclear industry,\" Van Buskirk says. Breaking into the nuclear industry is slow work, but the company is beginning to see sales pick-up, Glover says, noting that Graftel recently reached an agreement to provide flow meters for all of Westinghouse's future AP1000 reactors outside of China. \"We foresee a big future with the nuclear industry, and that's worldwide,\" says Van Buskirk. ❖ Since the early 2000s, balanced flow meters created through Marshall Space Flight Center's partnership with Quality Efficiency and Control have increased the accuracy of flow readings and improved efficiency in plants across a variety of industries. Since 2013, Graftel LLC has introduced the technology to the nuclear power industry, which has its own strict rules, requirements, and procedures. Spinoff 2017 Energy and Environment 131", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_007_batch_07_Spinoff2017/pages/page_0132/output_json/page_0132.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_007_batch_07_Spinoff2017::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_007_batch_07_Spinoff2017", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_07_Spinoff2017.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_007_batch_07_Spinoff2017, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Power Amplifiers Boost Radar, Communications, Defense Systems NASA Technology NORMALLY, state-of-the-art technology comes at a cost. But when QuinStar Technology was subcontracted in 2009 to build a power ampli- fier for one of NASA Jet Propulsion Laboratory's (JPL) radars, what the company delivered was not only more compact and reliable than the amplifiers typically used in such instruments but also less expensive. Remote Sensing Solutions (RSS), the prime contractor, had issued rigorous specifications for a solid-state power amplifier (SSPA) to boost signals from a radar operating at Ka-band frequencies—a slice of the microwave spectrum between 26 and 40 gigahertz—to be used in the calibration and validation of an instrument that would one day fly on the Surface Water Ocean Topography (SWOT) mission. The project, a cooperative effort between NASA and the French and Canadian space agencies, will use radar interferometers to create the first topographical map of Earth's oceans, lakes, and rivers, determining and monitoring the global distribution of freshwater, and examining how ocean currents interplay with climate change, among other studies. Before its 2020 satellite launch, the equipment has to be tested. So, in 2008, JPL granted the first of two Small Business Innovation Research (SBIR) contracts to RSS to design and build the Ka-Band SWOT Phenomenology Airborne Radar (KaSPAR), which is testing key SWOT instrument subsystems and measurement approach aboard a turboprop plane. Until recently, power amplifiers for such radars have generally been tube-based, but for KaSPAR, RSS wanted a highly efficient, compact, solid-state amplifier that could operate at high altitude and only required conduction cooling. The SBIR proposal for the project notes that a state-of-the-art SSPA would not only improve the surface- mapper’s performance but also open the way for such technology to fly on long-term unmanned aerial vehicle QuinStar and NASA shared the cost of developing a high-power W-band solid-state power amplifier for Goddard Space Flight Center's Cloud Radar System, which flew on the ER-2 high-altitude Earth science aircraft as part of the 2014 Integrated Precipitation and Hydrology Experiment. The power amplifier helped researchers collect data on precipitation distribution in clouds to improve understanding of precipitation over mountainous terrain, such as this supercell thunderstorm, photographed from the ER-2 as it passed over North Carolina on the evening of May 23, 2014. 152 Information Technology (UAV) missions. And power amplifiers have a multitude of applications, from communications to electronic warfare, so advancements could play out across a range of technologies. The subcontractor initially hired to build the ampli- fier wasn't able to complete the work, so RSS turned to Torrance, California-based QuinStar, which already had a history of pushing the boundaries of SSPA technology for other Government agencies. Technology Transfer There was little money left on the SBIR contract, and QuinStar, eager to advance its SSPA capabilities, invested a chunk of its own money to develop an amplifier of unprecedented efficiency. \"The one we developed is very highly advanced and very potent,\" says Naresh Deo, vice president of business development for QuinStar, adding that technology is \"unique and unprecedented and can serve some purposes it couldn't before.\" An SSPA routes a signal through an array of amplifiers, each of which boosts its portion of the signal, and then recombines the channels into a single, intensified output. The problem is that power is lost as the signal is recombined, with more channels meaning more energy dissipated when the signal is funneled back into a single pulse. \"What's different about our power combiners is they're extremely efficient,\" Deo says, noting that, while most SSPAs lose around 20 percent of their amplified energy at recombination, QuinStar's now lose only 8 percent. Following delivery of the KaSPAR amplifier, RSS ordered another SSPA from QuinStar for JPL's Airborne Glacier and Land Ice Surface Topography Interferometer. \"With that success, NASA started ordering all their SSPAs from us,\" Deo says. Spinoff 2017", "gold_evidence_draft": [{"evidence_unit_id": "real_007_batch_07_Spinoff2017:p0153:e000", "document_id": "real_007_batch_07_Spinoff2017", "page_number": 153, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "Power Amplifiers Boost Radar, Communications, Defense Systems NASA Technology NORMALLY, state-of-the-art technology comes at a cost. But when QuinStar Technology was subcontracted in 2009 to build a power ampli- fier for one of NASA Jet Propulsion Laboratory's (JPL) radars, what the company delivered was not only more compact and reliable than the amplifiers typically used in such instruments but also less expensive. Remote Sensing Solutions (RSS), the prime contractor, had issued rigorous specifications for a solid-state power amplifier (SSPA) to boost signals from a radar operating at Ka-band frequencies—a slice of the microwave spectrum between 26 and 40 gigahertz—to be used in the calibration and validation of an instrument that would one day fly on the Surface Water Ocean Topography (SWOT) mission. The project, a cooperative effort between NASA and the French and Canadian space agencies, will use radar interferometers to create the first topographical map of Earth's oceans, lakes, and rivers, determining and monitoring the global distribution of freshwater, and examining how ocean currents interplay with climate change, among other studies. Before its 2020 satellite launch, the equipment has to be tested. So, in 2008, JPL granted the first of two Small Business Innovation Research (SBIR) contracts to RSS to design and build the Ka- _answer_draft": "Benefits A sample of the scenarios DTI has been testing is a loop of flight traffic data provided to the company, showing a swarm of red, yellow, and white airplanes massing along the Eastern Seaboard of the United States, with each color indicating whether a plane was landing, taking off, or in mid-flight. In standard display mode, the planes appear and blink off the map in real time. \"What you've got is an incredible beehive of data that doesn't serve the pilot too well, nor the copilot, in terms of quick, intuitive understanding of what they are facing,\" Lagergren says. But switched into 3D mode, the clustered information is sorted and clarified. It's possible to determine whether one yellow plane is flying at a higher altitude than another, and whether two planes might be using the same runway at a busy airport. The 3D capability without glasses, thanks to eye-tracking technology, should help NASA ensure pilots have all the information they need to navigate increasingly busy airports, which are already struggling with higher demand for runway space, Ellis says. \"Traffic densities are going up by three or four times, projected, in terms of air travel, in the next 20 years or so. That causes a lot of problems. How do we take four times the amount of aircraft we have now flying into Chicago-O'Hare, Boston-Logan or Reagan National in Washington, DC,\" he says. \"You can't build another Reagan because DC's pretty densely populated. The only thing you can do is improve the efficiency of it.\" DTI isn't only thinking about pilots with this glassless 3D technology. Already the displays have been presented at two large digital visual arts conferences—Immersed in Toronto and SIGGRAPH in Vancouver—to rave reviews. At Immersed, DTI set up a console with the action role-playing game Skyrim, which features mountains, rivers, fields, and animals, including dragons and woolly mammoths. \"We had these woolly mammoths walking over the terrain, up and down the mountain, into valleys, and it seemed like you could see forever,\" Lagergren says. \"People were awed by it.\" The successful demonstration earned the company an invite to several technology conferences to show off its monitors. DTI also took its displays to the NVIDIA GPU Technology Conference and Emerging Companies Summit, in 2015, which highlights applications that are breaking new ground and pushing the boundaries of visual computing. Games built to be played or viewed in 3D rely on glasses, or players must remain in a \"sweet spot\" to get the full effect, but DTI has eliminated both those constraints, he says. \"Now you can walk around and the monitor will track you and keep the 3D at your eyes. There's no loss of resolution or brightness, no restriction in head movement, and it works for two players.\" DTI's latest display, sold commercially as the DTI Mission Critical 2D/3D monitor, has also been met with enthusiasm from 3D animators, including James Stewart. His award-winning stop-motion short film, Foxed!, is among the clips used by DTI when demonstrating the monitor. Finally, there's been interest from car manufacturers as well, which could lead to 2D/3D displays as part of the center console, driver instrument cluster, and seattrack entertainment packages. \"This thing is starting to take off,\" Lagergren says. \"The market's ready to accept it.\" Spinoff 2016 Consumer Goods 101", "gold_evidence_draft": [{"evidence_unit_id": "real_008_batch_08_Spinoff2016:p0102:e000", "document_id": "real_008_batch_08_Spinoff2016", "page_number": 102, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "Benefits A sample of the scenarios DTI has been testing is a loop of flight traffic data provided to the company, showing a swarm of red, yellow, and white airplanes massing along the Eastern Seaboard of the United States, with each color indicating whether a plane was landing, taking off, or in mid-flight. In standard display mode, hat causal, technical, or comparative relationship does the selected passage establish in real_008_batch_08_Spinoff2016, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Open Innovation NASA's challenges, prizes, and crowdsourcing efforts result in groundbreaking achievements The Power of Prizes Most people recognize Charles Lindbergh as the man who achieved worldwide fame New York City to Paris in 1927. But relatively few people know that Lindbergh did it to win a $25,000 prize (worth approximately $340,000 today) offered by a New York City-based hotel owner—or that Lindbergh was virtually unknown in aviation circles before his historic achievement and that he narrowly outcompeted several teams of experienced airmen to achieve victory. Lindbergh's story unfolded nearly a century ago, but it continues to serve as an example of the extraor- dinary things people can accomplish when incentivized by awards, public honors, and cash prizes, as well as the ingenuity unleashed by competition on a level playing field, where underdogs can make their mark. Recognizing the power of this principle, in 2009 President Obama urged Federal agencies to pursue \"high-risk, high-reward policy tools such as prizes and challenges to solve tough problems.\" Answering this call, NASA has increasingly turned to public competitions as a source of fresh ideas to help meet engineering challenges in aeronautics and space exploration. \"Prize competitions have become a key component in NASA's toolkit for developing technology and solv- ing problems,\" says Gladys Henderson, executive of the Agency's Prizes and Challenges Program. \"Because we only pay for success, we have found them to be remark- ably efficient in terms of getting the job done—which is a win not just for NASA but ultimately for taxpayers.\" Henderson notes that the open nature of competitions tends to make them popular among \"nontraditional audiences\"—that is, those outside the aerospace commu- nity—and that the high difficulty of NASA's objectives tends to bring in top talent, tempted by the chance to tackle a unique problem. The Agency's flagship effort in prize competitions dates to 2005, when the Centennial Challenges Program was established to engage the public in advancing technologies relevant to NASA missions. After proposing a set challenge for competitors—say, to build a robot capable of finding and collecting geological samples from a large field with varied terrain—along with precise criteria for success, NASA holds an event. Teams use either their own funds or outside investments to develop A robot scouts the field looking for samples to collect and return Return the 2014 Sample Return Robot Challenge. Eighteen million NASA prize purse at the competition. Many of the Centennial Challenges are annual events held over multiple years. The criteria for victory are focused on a significant advancement of the current tech- nology, such that it can take two to five years to award a prize. During the last 10 years, the program has overseen 20 competitions that have disbursed more than $6 mil- lion in awards and resulted in innovations in everything from robotics, fuel-efficient flight, and spaceship gloves to regolith excavators and ascent vehicles for Mars. And the entrants' technological achievements are often staggering: for example, the two winners of the 2011 Green Flight 198 Award-Winning Technologies Spinoff 2016", "gold_evidence_draft": [{"evidence_unit_id": "real_008_batch_08_Spinoff2016:p0199:e000", "document_id": "real_008_batch_08_Spinoff2016", "page_number": 199, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "Open Innovation NASA's challenges, prizes, and crowdsourcing efforts result in groundbreaking achievements The Power of Prizes Most people recognize Charles Lindbergh as the man who achieved worldwide fame New York City to Paris in 1927. But relatively few people know that Lindbergh did it to batch_09_Spinoff2015, and what stated condition or consequence qualifies it?", "gold_answer_draft": "developed from off-the-shelf products,\" he says. \"It's an industry-enabling technology.\" Now, he says, even many companies in the business of aerial imaging don't calibrate properly. \"Many don't understand it, and it's expensive, so they don't do it.\" But proper radiometric calibration turns a camera into a scientific tool, Pagnutti says, explaining that in a calibrated camera, the digital number (DN) in each pixel can be assigned a reliable radiance value for each image. It becomes a measuring device. \"You want more than a pretty picture. You want to know that DN value depicts a certain amount of radiance.\" When using digital satellite imagery to assess crop health or water resource management, for example, Stanley says, proper radiometry is essential. The same is true when using handheld units to determine the health of plants or human tissue. With the cost of calibration technology reduced, he says he foresees a day when cell phone cameras can become scientific instruments. Indeed, NASA and I2R are already using the com- pany's integrating spheres to calibrate cell phone-grade imaging technology for use in monitoring indoor lighting under an STTR contract. This technology might be used on the International Space Station (ISS) one day. As the ISS has changed its lighting to LEDs, astronauts have found they have a harder time sleeping. Under STTR, I2R will work to moderate lighting to either be conducive to sleep, or to induce focus or creative thinking—task- specific lighting. Stanley calls it—possibly to develop a lighting system for the space station. He notes that three groups at Johnson Space Center were already keeping track of this LED lighting project before Pagnutti had even written her final report on the integrating sphere. \"One contract award doesn't generally lead to a suc- cessful product,\" he says, noting that I2R's work seems to be an exception. ❖ Spinoff 2015 Proper radiometric calibration is essential for satellite cameras used to monitor crop health, among other applications. Industrial Productivity 141", "gold_evidence_draft": [{"evidence_unit_id": "real_009_batch_09_Spinoff2015:p0142:e000", "document_id": "real_009_batch_09_Spinoff2015", "page_number": 142, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "developed from off-the-shelf products,\" he says. \"It's an industry-enabling technology.\" Now, he says, even many companies in the business of aerial imaging don't calibrate properly. \"Many don't understand it, and it's expensive, so they don't do it.\" But proper radiometric calibration turns a camera into a scientific tool, Pagnutti says, explaining that in a calibrated camera, the digital number (DN) in each pixel can be assigned a reliable radiance value for each image. It becomes a measuring device. \"You want more than a pretty picture. You want to know that DN value depicts a certain amount of radiance.\" When using digital satellite imagery to assess crop health or water resource management, for example, Stanley says, proper radiometry is essential. The same is true when using handheld units to determine the health of plants or human tissue. With the cost of calibration technology reduced, he says he foresees a day when cell phone cameras can become scientific instruments. Indeed, NASA and I2R are already using the com- pany's integrating spheres to calibrate cell phone-grade imaging technology for use in monitoring indoor lighting under an STTR contract. This technology might be used on the International Space Station (ISS) one day. As the ISS has changed its lighting to LEDs, astronauts have found they have a harder time sleeping. Under STTR, I2R will work to moderate lighting to either be conducive to sleep, or to induce focus or creative thinking—task- specific lighting. Stanley calls it—possibly to develop a lighting system for the space station. He notes that three groups at Johnson Space Center were already keeping track of this LED lighting project before Pagnutti had even written her final report on the integrating sphere. \"One contract award doesn't generally lead to a suc- cessful product,\" he says, noting that I2R's work seems to be an exception. ❖ Spinoff 2015 Proper radiometric calibration is essential for satellite cameras used to monitor crop health, among other applications. Industrial Productivity 141", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_009_batch_09_Spinoff2015/pages/page_0142/output_json/page_0142.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_009_batch_09_Spinoff2015::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_009_batch_09_Spinoff2015", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_09_Spinoff2015.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_009_batch_09_Spinoff2015, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Ionospheric Mapping Software Ensures Accuracy of Pilots' GPS NASA Technology T o permit safe and reliable aircraft navigation over North America using the Global Positioning System (GPS), the Federal Aviation Administration (FAA) has developed the Wide Area Augmentation System (WAAS), which improves the accuracy, availability, continuity, and integrity of GPS positioning enough to ensure its safe use by pilots to determine their locations. The early development of WAAS relied on software developed at NASA's Jet Propulsion Laboratory (JPL), particularly the GPS-Inferred Positioning System (GIPSY) and the Global Ionospheric Mapping (GIM) software packages. The former has been licensed by hundreds of commercial and noncommercial organizations (Spinoff 1999 and 2010). More recently the continued development of WAAS has relied on companion software also developed at JPL. The SuperTruth and IonoSTAGE packages allow the system to address the threat to accurate positioning posed by code delays and phase advances due to refraction in Earth's ionosphere. More than about 50 miles above the planet's surface, electrons can be separated from atoms, resulting in positive ions and free electrons. Ionization of the upper atmosphere is much more active in the daytime since it's largely driven by the sun's ultraviolet radiation and the solar wind, which rip electrons off of neutral particles. Earth wind patterns and electrodynamics in the atmo- sphere help make the electron distribution irregular and patchy, resulting in \"space weather\" that can interfere with signals. GPS signal delays caused by activity in the ionosphere are measured in meters, with large delays being on the order of 40 meters, says Lawrence Sparks, senior technologist with the Ionospheric and Atmospheric Remote Sensing Group at JPL. While it doesn't take long for signals traveling at the speed of light to cover 40 meters, he says, even a delay of a small fraction of a second can make a significant difference in determining the position of a fast-moving plane. \"It is crucial to bound the positioning errors accurately for landing an aircraft safely in fog, for example.\" GIM allows Raytheon Corporation, the prime con- tractor of the system, to map ionospheric disruption in real time by processing the delays between GPS satel- lites and the 38 WAAS reference stations around North America. Each signal includes a sort of time stamp, making it possible to determine how long it took to travel from the satellite to the receiver, Sparks says. WAAS broadcasts vertical ionospheric grid delays for regularly spaced points across the coverage area. The observations are also used to calculate and broadcast the grid ionospheric vertical error (GIVE) for those same points. The GIVEs bound the range of possible error in pilot positions derived from GPS—that is, they let users know how reliable the information provided by WAAS really is. \"Only part of the ionosphere is sampled by WAAS at any given time,\" Sparks explains. \"A disturbance can be overlooked because its location hasn't been sampled. To protect the user from such errors, WAAS relies on an ionospheric threat model.\" The threat model—one factor in calculating GIVE— is constructed from a sort of worst-case scenario based on historical data generated by SuperTruth, including records of severe ionospheric storms. \"We try to quantify what kinds of ionospheric disturbances the system could have possibly missed.\" Sparks says. \"For every possible satellite configuration, we determine the worst-case errors we've ever seen.\" These are usually caused by coronal mass ejections—huge bursts of solar wind and magnetic fields on the surface of the sun that can cause dramatic increases in the number of ions in Earth's upper atmosphere. Sparks designed and wrote the computer code comprising the Ionospheric Slant TEC Analysis Using GNSS-Based Estimation (IonoSTAGE) software package, 50 Transportation Spinoff 2015", "gold_evidence_draft": [{"evidence_unit_id": "real_009_batch_09_Spinoff2015:p0051:e000", "document_id": "real_009_batch_09_Spinoff2015", "page_number": 51, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "Ionospheric Mapping Software Ensures Accuracy of Pilots' GPS NASA Technology T o permit safe and reliable aircraft navigation over North America using the Global Positioning System (GPS), the Federal Aviation Administration (FAA) has developed the Wide Area Augmentation System (WAAS), which improves the accuracy, availability, continuity, and integrity of GPS positioning enough to ensure its safe use by pilots to determine their locations. The early development of WAAS relied on software developed at NASA's Jet Propulsion Laboratory (JPL), particularly the GPS-Inferred Positioning System (GIPSY) and the Global Ionospheric Mapping (GIM) software packages. The former has been licensed by hundreds of commercial and noncommercial organizations (Spinoff 1999 and 2010). More recently the continued development of WAAS has relied on companion software also developed at JPL. The SuperTruth and IonoSTAGE packages allow the system to address the threat to accurate positioning posed by code delays and phase advances due to refraction in Earth's ionosphere. More than about 50 miles above the planet's surface, electrons can be separated from atoms, resulting in positive ions and free electrons. Ionization of the upper atmosphere is much more active in the daytime since it's largely driven by the sun's ultraviolet radiation and the solar wind, which rip electrons off of neutral particles. Earth wind patterns and electrodynamics in the atmo- sphere help make the electron distribution irregular and patchy, resulting in \"space weather\" that can interfere with signals. GPS signal delays caused by activity in the ionosphere are measured in meters, with large delays being on the order of 40 meters, says Lawrence Sparks, senior technologist with the Ionospheric and Atmospheric Remote Sensing Group at JPL. While it doesn't take long for signals traveling at the speed of light to cover 40 meters, he says, even a delay of a small fraction of a second can make a significant difference in determining the position of a fast-moving plane. \"It is crucial to bound the positioning errors accurately for landing an aircraft safely in fog, for example.\" GIM allows Raytheon Corporation, the prime con- tractor of the system, to map ionospheric disruption in real time by processing the delays between GPS satel- lites and the 38 WAAS reference stations around North America. Each signal includes a sort of time stamp, making it possible to determine how long it took to travel from the satellite to the receiver, Sparks says. WAAS broadcasts vertical ionospheric grid delays for regularly spaced points across the coverage area. The observations are also used to calculate and broadcast the grid ionospheric vertical error (GIVE) for those same points. The GIVEs bound the range of possible error in pilot positions derived from GPS—that is, they let users know how reliable the information provided by WAAS really is. \"Only part of the ionosphere is sampled by WAAS at any given time,\" Sparks explains. \"A disturbance can be overlooked because its location hasn't been sampled. To protect the user from such errors, WAAS relies on an ionospheric threat model.\" The threat model—one factor in calculating GIVE— is constructed from a sort of worst-case scenario based on historical data generated by SuperTruth, including records of severe ionospheric storms. \"We try to quantify what kinds of ionospheric disturbances the system could have possibly missed.\" Sparks says. \"For every possible satellite configuration, we determine the worst-case errors we've ever seen.\" These are usually caused by coronal mass ejections—huge bursts of solar wind and magnetic fields on the surface of the sun that can cause dramatic increases in the number of ions in Earth's upper atmosphere. Sparks designed and wrote the computer code comprising the Ionospheric Slant TEC Analysis Using GNSS-Based Estimation (IonoSTAGE) software package, 50 Transportation Spinoff 2015", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_009_batch_09_Spinoff2015/pages/page_0051/output_json/page_0051.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_010_batch_10_Spinoff2013::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_010_batch_10_Spinoff2013", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_10_Spinoff2013.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_010_batch_10_Spinoff2013, and what stated condition or consequence qualifies it?", "gold_answer_draft": "When executing a procedure, PRIDE assists the opera- tor with a variety of tools to simplify and streamline the process of following instructions. It can format proce- dures for display in any number of media, for example, so that astronauts can use what they have on hand to read them, regardless of the platform used to write them. In electronic formats, an operator can check off steps as they are performed, which can be tracked (and later audited) by others managing the mission. NASA has turned to PRIDE for a variety of needs: In 2008 it was used to author medical procedures for the ISS. Capabilities to write procedures for EVAs were integrated in 2111, and in 2012 it powered the proce- dure-writing for Morpheus, a rapid prototype lander project designed to test a range of capabilities. Perhaps most importantly, NASA is using PRIDE to author pro- cedures for the prototype electronic procedure display for the Orion Multipurpose Crew Vehicle, the spacecraft scheduled to take astronauts beyond Earth's orbit for the first time since the Apollo Program. Benefits NASA may have been PRIDE's first user, but it won't be its last: in 2013 TRACLabs announced that it was marketing its software to private industry, starting with oil companies. As Dave Kortenkamp, president of TRACLabs, says, \"We recognized pretty early on that procedures are ubiquitous, and any environment where there is some level of high dynamics and risk, people want to think things through. We live in Houston, where oil and gas is a very large industry, so it was a natural next step.\" TRACLabs is now working with a number of large companies in the oil and gas industry—\"names you see on gas station signs as you drive down the street,\" says Kortenkamp—as well as with companies that provide services to them. The company will sell both the software and support services and is already on pace to generate millions of dollars through its entry into the market. On oil rigs with heavy machinery, any failure to strictly follow instructions can cause disaster. \"After the Deepwater Horizon oil spill in 2011, these companies want to make sure that everything they're doing is according to best practices,\" says Kortenkamp. \"Part of the problem in diagnosing what went wrong was that they weren't always sure who was doing what when. They're serious about making sure they're auditing procedures and keeping track of what's being done in the field.\" Using procedures written with PRIDE, oil compa- nies can better manage and audit oil rig operations. For example, when an expert authors procedures for a piece of drilling equipment, PRIDE captures that instruction in language the software understands. (Currently, such procedures are written in ordinary word processors.) \"When the procedure is sent to the operator of that piece of equipment,\" says Kortenkamp, \"the operator has some training but isn't necessarily an expert on that tool. With PRIDE, the operator can check off steps as he moves through them and use the software to branch off certain points in the procedure where there are questions that need to be answered.\" At the same time, PRIDE can draw relevant sensor data coming from the equipment and display context both for the operator and anyone monitoring the work remotely. Using industry-standard interfaces that are compatible with PRIDE, multiple people can use the same procedure on multiple rigs, and as they carry out their instructions, all of their interactions are stored in a remote database so that the company can review what's happening. If an operator breaks from his or her given instructions, support software can send out alerts so that appropriate actions can be taken—whether that means halting the operation or flagging it for further review. In the future, TRACLabs hopes to sell PRIDE in other markets, as it can easily be applied in many fields. For now, however, NASA's early adoption of PRIDE is helping the company get a foot in the door with an industry whose difficult environments and high risks sometimes resemble those of the space agency's. \"It's widely recognized that NASA is at the cutting edge of operating complex things safely,\" says Kortenkamp. \"It's fact that this is the direction NASA is moving for its procedures tells the oil and gas industry that it's a direction they should be moving as well.\" Spinoff 2013 103", "gold_evidence_draft": [{"evidence_unit_id": "real_010_batch_10_Spinoff2013:p0104:e000", "document_id": "real_010_batch_10_Spinoff2013", "page_number": 104, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "When executing a procedure, PRIDE assists the opera- tor with a variety of tools to simplify and streamline the process of following instructions. It can format proce- dures for display in any number of media, for example, so that astronauts can use what they have on hand to read them, regardless of the platform used to write them. In electronic formats, an operator can check off steps as they are performed, which can e in the field.\" Using procedures written with PRIDE, oil compa- nies can better manage and audit oil rig operations. For example, when an expert authors procedures for a piece of drilling equipment, PRIDE captures that instruction in language the software understands. (Currently, such procedures are written in ordinary word processors.) \"When the procedure is sent to the operator of that piece of equipment,\" says Kortenkamp, \"the operator has some training but isn't necessarily an expert on that tool. With PRIDE, the operator can check off steps as he moves through them and use the software to branch off certain points in the procedure where there are questions that need to be answered.\" At the same time, PRIDE can draw relevant sensor data coming from the equipment and display context both for the operator and anyone monitoring the work remotely. Using industry-standard interfaces that are compatible with PRIDE, multiple people can use the same procedure on multiple rigs, and as they carry out their instructions, all of their interactions are stored in a remote database so that the company can review what's happening. If an operator breaks from his or her given instructions, support software can send out alerts so that appropriate actions can be taken—whether that means halting the operation or flagging it for further review. In the future, TRACLabs hopes to sell PRIDE in other markets, as it can easily be applied in many fields. For now, however, NASA's early adoption of PRIDE is helping the company get a foot in the door with an industry whose difficult environments and high risks sometimes resemble those of the space agency's. \"It's widely recognized that NASA is at the cutting edge of operating complex things safely,\" says Kortenkamp. \"It's fact that this is the direction NASA is moving for its procedures tells the oil and gas industry that it's a direction they should be moving as well.\" Spinoff 2013 103", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_010_batch_10_Spinoff2013/pages/page_0104/output_json/page_0104.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_010_batch_10_Spinoff2013::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_010_batch_10_Spinoff2013", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_10_Spinoff2013.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_010_batch_10_Spinoff2013, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Programs Visualize Earth and Space for Interactive Education NASA Technology Incredible sights are being seen, thanks to the devel- opment of technology both inside and outside of NASA. With just a few clicks, NASA's Eyes on the Earth web application lets you see what it's like to fly around Earth with a satellite. A separate program—Eyes on the Solar System—allows you to wander through space and stop at any planet or spacecraft you see. Last but not least, NASA's Eyes on Exoplanets provides a close-up view of the stars and planets inside the Milky Way. No longer do such sights have to come only from your imagination. It all started in 2004 when Kevin Hussey, the manager of visualization technology applications and develop- ment at the Jet Propulsion Laboratory (JPL), was talking to a colleague who wondered, \"Wouldn't it be cool if you could ride along with a spacecraft while it's doing its thing—especially if it is in a precarious situation or something noteworthy is going on?\" Fascinated by the idea, Hussey set out to collaborate with others at JPL to produce a prototype in the appli- cation programming interface called DirectX 9 to show the orbit insertion of Cassini, the first spacecraft to orbit Saturn, in real time. Soon after, Hussey's team used Unity3D, a game development program for creating interactive video-game style content, to advance the visu- alization and incorporate interactivity. Upon completion of the Cassini Saturn interactive explorer, Hussey received requests to develop similar programs encompassing all of the spacecraft in orbit around Earth and then all of the spacecraft in the Solar System. Nearly a decade later, there are now 12 people in Hussey's group creating new ways of seeing what is happening in space and supporting the incredible tools that already exist. And Hussey is ecstatic about the results. \"During the Mars Curiosity landing, over a 3-day period, there were approximately 1.2 million visitors to Eyes on the Solar System! During the asteroid DA14 close encounter in 2013, there were more than 350,000 users of Eyes on the Earth and over 84,000 people using Eyes on the Solar System! People are using it all over the world.\" One of the many mind-boggling features of the pro- grams is the capability to show real-time progress. Armed with information on the projected path of the space- craft—what is going to happen and when—Hussey's team uses game engine technology to show what is predicted to happen in real time. \"For Curiosity, our real time visualization, which is based on the predicted telemetry, was only .6 seconds early in landing than the real thing,\" says Hussey. \"As people around the world were watching Curiosity touch down, it was less than a second off.\" Technology Transfer After completing Eyes on the Earth in 2008, Hussey was asked to assist in the redesign of an administrative lobby at JPL. His first idea was to use projected imag- ery to create a visual experience like being in space. He began researching companies online to help his idea come to life when he found Milwaukee, Wisconsin-based The Elumenati. Hussey contacted the company and spoke with Hilary McVicker, the director of communications at The Elumenati, who explained how the company's domes, projection systems, and software can create immersive environments. Their patented optics fill ultra-wide screens in any shape and size with images, video, and interactive content, from fully-enclosed domes that create planetarium-like experiences to panoramas for simulating flight and exploring planetary surfaces. \"Completely surrounding your audience with imagery creates a sense of presence in a virtual world that can't be replicated on a flat screen,\" says McVicker. \"This makes our immersive environments uniquely effective in creating teachable moments, spaces for collaborative dialogue, and a 'wow' factor.\" 110 Energy and Environment Spinoff 2013", "gold_evidence_draft": [{"evidence_unit_id": "real_010_batch_10_Spinoff2013:p0111:e000", "document_id": "real_010_batch_10_Spinoff2013", "page_number": 111, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "Programs Visualize Earth and Space for Interactive Education NASA Technology Incredible sights are being seen, thanks to the devel- opment of technology both inside and outside of NASA. With just a few clicks, NASA's Eyes on the Earth web application lets you see what it's like to fly around Earth with a satellite. A separate program—Eyes on the Solar System—allows you to wander through space and stop at any planet or spacecraft you see. Last but not least, NASA's Eyes on Exoplanets provides a close-up view of the stars and planets inside the Milky Way. No longer do such sights have to come only from your imagination. It all started in 2004 when Kevin Hussey, the manager of visualization technology applications and develop- ment at the Jet Propulsion Laboratory (JPL), was talking to a colleague who wondered, \"Wouldn't it be cool if you could ride along with a spacecraft while it's doing its thing—especially if it is in a precarious situation or something noteworthy is going on?\" Fascinated by the idea, Hussey set out to collaborate with others at JPL to produce a prototype in the appli- cation programming interface called DirectX 9 to show the orbit insertion of Cassini, the first spacecraft to orbit Saturn, in real time. Soon after, Hussey's team used Unity3D, a game development program for creating interactive video-game style content, to advance the visu- alization and incorporate interactivity. Upon completion of the Cassini Saturn interactive explorer, Hussey received requests to develop similar programs encompassing all of the spacecraft in orbit around Earth and then all of the spacecraft in the Solar System. Nearly a decade later, there are now 12 people in Hussey's group creating new ways of seeing what is happening in space and supporting the incredible tools that already exist. And Hussey is ecstatic about the results. \"During the Mars Curiosity landing, over a 3-day period, there were approximately 1.2 million visitors to Eyes on the Solar System! During the asteroid DA14 close encounter in 2013, there were more than 350,000 users of Eyes on the Earth and over 84,000 people using Eyes on the Solar System! People are using it all over the world.\" One of the many mind-boggling features of the pro- grams is the capability to show real-time progress. Armed with information on the projected path of the space- craft—what is going to happen and when—Hussey's team uses game engine technology to show what is predicted to happen in real time. \"For Curiosity, our real time visualization, which is based on the predicted telemetry, was only .6 seconds early in landing than the real thing,\" says Hussey. \"As people around the world were watching Curiosity touch down, it was less than a second off.\" Technology Transfer After completing Eyes on the Earth in 2008, Hussey was asked to assist in the redesign of an administrative lobby at JPL. His first idea was to use projected imag- ery to create a visual experience like being in space. He began researching companies online to help his idea come to life when he found Milwaukee, Wisconsin-based The Elumenati. Hussey contacted the company and spoke with Hilary McVicker, the director of communications at The Elumenati, who explained how the company's domes, projection systems, and software can create immersive environments. Their patented optics fill ultra-wide screens in any shape and size with images, video, and interactive content, from fully-enclosed domes that create planetarium-like experiences to panoramas for simulating flight and exploring planetary surfaces. \"Completely surrounding your audience with imagery creates a sense of presence in a virtual world that can't be replicated on a flat screen,\" says McVicker. \"This makes our immersive environments uniquely effective in creating teachable moments, spaces for collaborative dialogue, and a 'wow' factor.\" 110 Energy and Environment Spinoff 2013", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_010_batch_10_Spinoff2013/pages/page_0111/output_json/page_0111.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_011_batch_11_Spinoff2012::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_011_batch_11_Spinoff2012", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_11_Spinoff2012.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_011_batch_11_Spinoff2012, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Archiving Innovations Preserve Essential Historical Records NASA Technology The Moon hosts perhaps the most fascinating museum that no one ever visits. From reflecto meters to space boots, the lunar module's descent stage, and the famous first footprints left behind by Neil Armstrong, the Apollo 11 mission alone left over 100 artifacts on the Moon's surface. Among the items at rest in the lunar regolith is an aluminum capsule containing a simple silicon disc about the size of a half-dollar coin. The disc displays messages of goodwill from 73 countries and four US presidents, all inscribed in letters a quarter of the width of a human hair, visible only under a microscope. In order to compile the commemorative messages into a format that would not significantly add to Apollo 11's payload, while also being able to endure the wild tem- perature extremes of the Moon's surface, NASA partnered with Worcester, Massachusetts-based Sprague Electric Company. The company, which had already worked with the Agency to produce multiple components for the Apollo 11 mission, applied semiconductor manufacturing techniques to etch the messages on silicon, sizing them down until each individual message was smaller than the head of a pin. Sprague patented the technique in 1971, but it would be decades later when a pair of innovators would build upon the NASA-derived technology to create a spinoff that is now preserving vital records on Earth in the same way that the world's support of Apollo 11 is preserved on the Moon. Technology Transfer In 2006, P.R. Mukund, professor of electrical engineering at Rochester Institute of Technology, and PhD student Ajay Pasupuleti took on a task working with a material not typical to their field—palm leaves. The pair joined a project to preserve the content of the Sarvamoola Grantha, an ancient work of Hindu spiritual scholarship The famous Apollo 11 mission left behind over 100 artifacts on the Moon, including a small silicon disc inscribed with messages of goodwill from 73 countries (below). Spinoff 2012", "gold_evidence_draft": [{"evidence_unit_id": "real_011_batch_11_Spinoff2012:p0128:e000", "document_id": "real_011_batch_11_Spinoff2012", "page_number": 128, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "Archiving Innovations Preserve Essential Historical Records NASA Technology The Moon hosts perhaps the most fascinating museum that no one ever visits. From reflecto meters to space boots, the lunar module's descent stage, and the famous first footprints left behind by Neil Armstrong, the Apollo 11 mission alone left over 100 artifacts on the Moon's surface. Among the items at rest in the lunar regolith is an aluminum capsule containing a simple silicon disc about the size of a half-dollar coin. The disc displays messages of goodwill from 73 countries and four US presidents, all inscribed in letters a quarter of the width of a human hair, visible only under a microscope. In order to compile the commemorative messages into a format that would not significantly add to Apollo 11's payload, while also being able to endure the wild tem- perature extremes of the Moon's surface, NASA partnered with Worcester, Massachusetts-based Sprague Electric Company. The company, which had already worked with the Agency to produce multiple components for the Apollo 11 mission, applied semiconductor manufacturing techniques to etch the messages on silicon, sizing them down until each individual message was smaller than the head of a pin. Sprague patented the technique in 1971, but it would be decades later when a pair of innovators would build upon the NASA-de enefits Unpeeled starts with a kombucha base, to which Johnson adds his own blend of four different probiotics. The bacteria and yeast naturally form a cellulose matrix, or a balanced growth configuration, which allows the organisms to inhabit the same medium without killing each other off. The probiotics remain live and active to the time the consumer opens a bottle. Once consumed, the drink's bacteria propagate in the gastro-intestinal (GI) tract, aiding in digestion and reducing inflammation that causes muscle and joint pain. Unpeeled also helps balance the body's pH levels by alkalizing them. (The human body has a tendency to become oarcidic under the influence of the typical modern diet.) Johnson stresses that it is the quality of bacteria, not the quantity, that matters. Once the GI tract is seeded with good bacteria, they multiply on their own and crowd out pathogens. Each bottle of Unpeeled thus contains three servings' worth of probiotics, which he recommends be consumed throughout the day. From Unpeeled's earliest batches, customers have responded favorably to its health benefits. \"This beverage is saving my life,\" one customer says. \"It makes swell- ing go down [and] promotes good digestion. I don't know how I could do without it.\" Another of Johnson's customers—and longtime patient—has been faithfully drinking Unpeeled since before it had a name, and says the tea helps her manage her painful joints. Unpeeled currently comes in six flavors, which begin with the same green tea kombucha and are differentiated using natural flavorings such as raw ginger, cranberry, mango, seal salt, and juices from various organic fruits. In addition to enhancing flavor, these natural ingredients impart enzymes that bolster the drink's health benefits further. Johnson will soon release a second probiotic beverage line made from a coconut-water base, also to be available in a variety of flavors. Business has been booming for Unpeeled. What began as a back-of-the-office be s in science, technology, engineering, and mathematics education. Festival of Learning More than 500 science organizations gathered in the Nation's capital in 2010 as part of the first national Science and Engineering Festival—and NASA was one of them. Nearly 1 million people participated in the two-week event that began with activities in local schools and ended with a two-day expo attended by nearly 500,000 people. NASA booths at the expo featured hands-on activities, demonstrations, and exhibits. The event also marked the culmination of NASA's Summer of Innovation education initiative, aimed at engaging middle school students in science, technology, engineering, and math activities during the summer break. During its inaugural year, the program reached more than 75,000 middle-school students. The Science and Engineering Festival began with activities in local schools and ended with a 2-day expo on the National Mall and surrounding areas. 180 Education News Spinoff 2011", "gold_evidence_draft": [{"evidence_unit_id": "real_012_batch_12_Spinoff2011:p0182:e000", "document_id": "real_012_batch_12_Spinoff2011", "page_number": 182, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "USA y Tu W hile NASA is committed to preparing the next gen- eration of scientists, engineers, and technologists, leading Spanish-language media company Univision Communications Inc. is focused on improving graduation rates and preparing Hispanic students for college. Together, NASA and Univision are launching an on-air and online initiative to help engage Hispanic students in science, technology, engineering, and mathematics (STEM) education. In October 2010, Univision aired a series of Spanish-language educational video segments produced by NASA entitled NASA y Tu (NASA and You). Featuring Hispanic employees from NASA, the 30-second videos present new perspectives on education and STEM careers. Among many featured NASA staff members are astronaut Jose etary studies. page 132 Virtual Reality System Offers a Wide Perspective As part of an SBIR agreement to improve the telepresence of Johnson Space Center's Robonaut, Baltimore-based Sensics Inc. created a head-mounted display with a high-resolution, three-dimensional pan- orama. The Sensics piSight is now being sold commercially for high-end virtual reality applications. Virtual surroundings appear in the viewfinder and respond to head movements. page 134 Software Simulates Sight: Flat Panel Mura Detection Radiant Imaging Inc., of Duvall, Washington, licensed the Spatial Standard Observer (SSO) software from Ames Research Center. The SSO simulates a simplified model of human spatial vision, operating on a pair of images that are viewed at a specific viewing distance with pixels having a known relation to lumi- nance. The SSO software was used to develop the TrueMURA Analysis Module, incorporated into Radiant Imaging's ProMetric 9.1 system. When used in con- junction with the ProMetric Series Imaging Colorimeters, the new software module provides a complete characterization and testing system for flat panel displays, es- pecially LCD panels and displays. page 136 Inductive System Monitors Tasks The Inductive Monitoring System is software developed at Ames Research Center that uses artificial intelligence and data mining techniques to build system- monitoring knowledge bases from archived or simulated sensor data. This information is then used to detect unusual or anomalous behavior that may indicate an impending system failure. iSagacy Inc., based out of Portland, Maine, executed a nonexclusive license and is now offering it for use for water treatment plants, water heating and cooling in the process industry, oil refiner- ies, public water distribution, and power generation plants. page 138 Mars Mapping Technology Brings Main Street to Life Berkeley, California-based earthmine inc., licensed 3-D data-generation software and algorithms from NASA's Jet Propulsion Laboratory originally used to create a 3-D representation of the local terrain to allow autonomous routing of the Mars Exploration Rovers. earthmine combined the software and algorithms with its unique capture hardware and Web deliv- ery technology in a system that integrates the information to deliver accurate street- level geospatial data through a Web-based interface. Complete municipalities are collected through high-quality, 3-D pan- oramic images—including every road, alley, and freeway—to create a complete, con- sistent, and publicly accessible geospatial view of cities for official and commercial applications. page 140 Intelligent Memory Module Overcomes Harsh Environments 3D Plus USA Inc., of McKinney, Texas, licensed Radiation Tolerant Intelligent Memory Stack technology from Langley Research Center for systems and methods to detect a failure event in field program- mable gate arrays. In partnership with Langley, 3D Plus developed the first high-density and fast access time memory module tolerant of space radiation effects. This module decreases design complex- ity for space-based electronics requiring memory with its simple interface and internal radiation tolerance management. Expected applications include commercial or scientific geostationary missions and deep space scientific exploration, and high-reliability computing in other radia- tion-intensive environments like nuclear facilities. page 142 Integrated Circuit Chip Improves Network Efficiency Under a 2002 Space Act Agreement, Rockville, Maryland-based BAE Systems Inc. worked with Goddard Space Flight Center to create a SpaceWire-based application-specific integrated circuit (ASIC) chip for bridging existing space electronics and Goddard's new link- and-switch routers. BAE Systems' ASIC integrates easily into an onboard system and also decreases the part count, overall system complexity, ongoing costs, and power requirements for the system's board while also improving speed and reliability. page 144 38 al, ceramics, and forensics. Additional applications include character- izing materials that cannot be ground to a fine size, such as explosives and research pharmaceuticals. pase 152 NASA Design Strengthens Wells Fiction Stir Welding (FSW) is a solid- state joining process—a combination of extruding and forging—ideal for use when the original metal characteristics must remain as unchanged as possible. While exploring ways to improve the use of FSW in manufacturing, engineers at Marshall Space Flight Center created technologies to address the method's shortcomings. MTS Systems Corporation, of Eden Prairie, Minnesota, discovered the NASA-developed technology and then signed a co-exclusive license agreement to commercialize Marshall's design for use in high-strength structural alloys. The result- ing process offers the added bonuses of being cost-competitive, efficient, and most importantly, versatile. pase 154 Polyimide Boosts High- Temperature Performance Maverick Corporation, of Blue Ash, Ohio, licensed DMBZ-15 polyimide technol- ogy from Glenn Research Center. This ultrahigh-temperature material provides substantial weight savings and reduced machining costs compared to the same component made with more traditional metallic materials. DMBZ-15 has a wide range of applications from aerospace (air- craft engine and airframe components, space transportation systems, and missiles) to non-aerospace (oil drilling, rolling mill), and is particularly well-suited to use as face sheets with honeycombs or thermal protec- tion systems for reusable launch vehicles, which encounter elevated temperatures during launch and reentry. pase 156 NASA Innovation Builds Better Nanotubes Nanotailor Inc., based in Austin, Texas, licensed Goddard Space Flight Center's unique single-walled carbon nanotube (SWCNT) fabrication process with plans to make high-quality, low-cost SWCNTs available commercially. Carbon nanotubes are being used in a wide variety of applica- tions, and NASA's improved production method will increase their applicability in medicine, microelectronics, advanced materials, and molecular containment. Nanotailor built and tested a prototype based on Goddard's process, and is using this technique to lower the cost and improve the integrity of nanotubes, offering a better product for use in biomaterials, advanced materials, space exploration, highway and building construction, and many other applications. pase 158", "gold_evidence_draft": [{"evidence_unit_id": "real_015_batch_15_spinoff2008:p0041:e000", "document_id": "real_015_batch_15_spinoff2008", "page_number": 41, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "Spinoff 2008 39 Portable Device Analyzes Rocks and Minerals inXitu Inc., of Mountain View, California, entered into a Phase Ⅱ SBIR contract with Ames Research Center to develop technol- ogies for the next generation of scientific instruments for materials analysis. The work resulted in a sample handling system that could find a wide range of applica- tions in research and industrial laboratories as a means to load powdered samples for analysis or process control. Potential industries include chemical, cement, inks, pharmaceutical, ceramics, and forensics. Additional applications include character- izing materials that cannot be ground to a fine size, such as explosives and research pharmaceuticals. pase 152 NASA Design Strengthens Wells Fiction Stir Welding (FSW) is a solid- state joining process—a combination of extruding and forging—ideal for use when the original metal characteristics must remain as unchanged as possible. While exploring ways to improve the use of FSW in manufacturing, engineers at Marshall Space Flight Center created technologies to address the method's shortcomings. MTS Systems Corporation, of Eden Prairie, Minnesota, discovered the NASA-developed technology and then signed a co-exclusive license agreement to commercialize Marshall's design for use in high-stre oping a 3-D version of RHSEG to pro- duce pixel-level views of a tumor or lesion, and identify plaque build-up in arteries and density levels of microcalcification in mammographics. page 40 10 Spinoff 2007", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0012/output_json/page_0012.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_016_batch_16_basic_version_07::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_016_batch_16_basic_version_07, and what stated condition or consequence qualifies it?", "gold_answer_draft": "Transportation Comprehensive Software Eases Air Traffic Management NASA's Future Air Traffic Management Concepts Evaluation Tool, developed for air traffic control centers to improve the safety and efficiency of the National Airspace System software, was licensed by Flight Explorer Inc. The software now offers automatic alerts of events such as weather conditions and potential airport delays, and real-time flight coverage over Canada, the United Kingdom, New Zealand, and sections of the Atlantic and Pacific Oceans. Flight Explorer Inc. recently formed several partnerships to expand cover- age worldwide. Modeling Tool Advances Rotorcraft Design SBIR contracts helped Continuum Dynamics Inc. develop the Comprehensive Hierarchical Aeromechanics Rotorcraft Model (CHARM) tool for studying helicopter and tiltrotor unsteady free wake modeling, including distributed and integrated loads and perfor- mance prediction. CHARM has been used to model a broad spectrum of rotorcraft attri- butes, including performance, blade loading, blade-vortex interaction noise, air flow fields, and hub loads, and is currently in use by all major rotorcraft manufacturers, NASA, the U.S. Army, and the U.S. Navy. Page 46 Sagem Avionics Inc. licensed two NASA- developed software systems: Morning Report, defined atypicalities without pre- defined parameters, and the Aviation Data Integration System, which integrates data from disparate sources into the flight data analysis process. These were incorporated into its flight operations monitoring system designed to support any aircraft and flight data recorders. The new system considers technical evolutions and needs, and each air- line can perform specific treatments and build its own flight data analysis system. Page 48 Advanced Airfoils Boost Helicopter Performance Carson Helicopters Inc. licensed the NASA- developed Langley RC4 series of airfoils to develop a replacement main rotor blade for Sikorsky S-61 helicopters. The result- ing design allows the helicopters to carry heavier loads and fly faster and farther, and the main rotor blades have twice the previous service life. In aerial firefighting, the perfor- mance-boosting airfoils have helped the U.S. Department of Agriculture's Forest Service control the spread of wildfires. Page 50 Deicing System Protects General Aviation Aircraft Kelly Aerospace Thermal Systems LLC collaborated with NASA scientists on deicing technology with assistance from the SBIR program. New and previous work combined in the development of a lightweight, easy- to-install, and reliable wing and tail deicing system called Thermawing, a DC-powered air conditioner for single-engine aircraft called Thermacool, and high-output alternators to run them both. Page 52 Public Safety Chemical-Sensing Cables Detect Potential Threats SBIR contracts helped Intelligent Optical Systems Inc. (IOS) develop moisture- and pH-sensitive sensors to detect corrosion or pre-corrosive conditions before significant structural damage occurs. The company sub- sequently worked with the U.S. Department of Defense to continue development of the sensors for detecting chemical warfare agents. IOS has also sold the technology to major automotive and aerospace companies, who are finding a variety of uses for the devices. page 56 Infrared Imaging Sharpens View in Critical Situations Innovative Engineering and Consulting Infrared Systems received NASA assistance to develop commercial infrared imaging systems that better differentiate the intensity of heat sources. The research resulted in the NightStalkIR and IntrudIR Alert Systems, now being used abroad to locate personnel stranded in emergency situations and protect high-value operations. The company is also applying its thermal imaging techniques to medical and pharmaceutical products. page 58 Spinnoff 2007 11", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0013:e000", "document_id": "real_016_batch_16_basic_version_07", "page_number": 13, "element_index": 0, "element_type": "distorted_page", "bbox": [0, 0, 1600, 1237], "text": "Transportation Comprehensive Software Eases Air Traffic Management NASA's Future Air Traffic Management Concepts Evaluation Tool, developed for air traffic control centers to improve the safety and efficiency of the National Airspace System software, was licensed by Flight Explorer Inc. The software now offers automatic alerts of events such as weather conditions and potential airport delays, and real-time flight coverage over Canada, the United Kingdom, New Zealand, and sections of the Atlantic and Pacific Oceans. Flight Explor tweight, easy- to-install, and reliable wing and tail deicing system called Thermawing, a DC-powered air conditioner for single-engine aircraft called Thermacool, and high-output alternators to run them both. Page 52 Public Safety Chemical-Sensing Cables Detect Potential Threats SBIR contracts helped Intelligent Optical Systems Inc. (IOS) develop moisture- and pH-sensitive sensors to detect corrosion or pre-corrosive conditions before significant structural damage occurs. The company sub- sequently worked with the U.S. Department of Defense to continue development of the sensors for detecting chemical warfare agents. IOS has also sold the technology to major automotive and aerospace companies, who are finding a variety of uses for the devices. page 56 Infrared Imaging Sharpens View in Critical Situations Innovative Engineering and Consulting Infrared Systems received NASA assistance to develop commercial infrared imaging systems that better differentiate the intensity of heat sources. The research resulted in the NightStalkIR and IntrudIR Alert Systems, now being used abroad to locate personnel stranded in emergency situations and protect high-value operations. The company is also applying its thermal imaging techniques to medical and pharmaceutical products. page 58 Spinnoff 2007 11", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0013/output_json/page_0013.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_020_batch_20_spin03::1", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_020_batch_20_spin03", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_20_spin03.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_020_batch_20_spin03, and what stated condition or consequence qualifies it?", "gold_answer_draft": "NASA's Offices of Space Flight and Aerospace Technology, through the NASA Quest program, spon- sored a separate robot-design initiative called the Robotic Helper Design Challenge. In May, the 2-month educational activity brought students and NASA experts together for a live Webcast to review the progress of the students' designs, intended to help astronauts living and working on the ISS. Through the Webcast, the students engaged in a virtual tour of the ISS, learned about micro- gravity, and had questions about their designs answered by NASA experts. An estimated 2,500 students in 100 classrooms (representing 26 states and 7 countries) took part in the final design challenge. Entries included a Space Pet Involving Kinetic Energy (SPIKE) robot that uses propellers to steer itself while floating through low- gravity atmospheres (created by eighth graders at Barkalow Middle School in Freehold, New Jersey), and “Mr. Helper,” which comes equipped with a homing device so that it can return to its docking bay to recharge, and a large storage compartment for astronauts’ tools (created by fourth, fifth, and sixth grade students at the K.R. Smith Elementary School in San Jose, California). The inspiration for the design challenge was NASA's prototype Personal Satellite Assistant, an astronaut- support tool devised to move and operate autonomously or by remote control in the microgravity environment of the Space Shuttle, ISS, or a future space vehicle.", "gold_evidence_draft": [{"evidence_unit_id": "real_020_batch_20_spin03:p0128:e001", "document_id": "real_020_batch_20_spin03", "page_number": 128, "element_index": 1, "element_type": "para", "bbox": [85, 242, 551, 903], "text": "NASA's Offices of Space Flight and Aerospace Technology, through the NASA Quest program, spon- sored a separate robot-design initiative called the Robotic Helper Design Challenge. In May, the 2-month educational activity brought students and NASA experts together for a live Webcast to review the progress of the students' designs, intended to help astronauts living and working on the ISS. Through the Webcast, the students engaged in a virtual tour of the ISS, learned about micro- gravity, and had questions about their designs answered by NASA experts. An estimated 2,500 students in 100 classrooms (representing 26 states and 7 countries) took part in the final design challenge. Entries included a Space Pet Involving Kinetic Energy (SPIKE) robot that uses propellers to steer itself while floating through low- gravity atmospheres (created by eighth graders at Barkalow Middle School in Freehold, New Jersey), and “Mr. Helper,” which comes equipped with a homing device so that it can return to its docking bay to recharge, and a large storage compartment for astronauts’ tools (created by fourth, fifth, and sixth grade students at the K.R. Smith Elementary School in San Jose, California). The inspiration for the design challenge was NASA's prototype Personal Satellite Assistant, an astronaut- support tool devised to move and operate autonomously or by remote control in the microgravity environment of the Space Shuttle, ISS, or a future space vehicle.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0128/output_json/page_0128.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_new_expansion::real_020_batch_20_spin03::2", "review_status": "NEEDS_HUMAN_REVIEW", "corpus": "real_documents_v1_20261113", "document_id": "real_020_batch_20_spin03", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_20_spin03.pdf", "question": "What causal, technical, or comparative relationship does the selected passage establish in real_020_batch_20_spin03, and what stated condition or consequence qualifies it?", "gold_answer_draft": "This year, NASA and the National Highway Traffic Safety Administration (NHTSA) joined forces to, literal- ly, take vehicles out for a spin. The NHTSA currently employs a consumer rating system that uses an engineer- ing formula to determine rollover resistance, but wanted to research new methods through NASA. Goddard Space Flight Center's High Capacity Centrifuge, used to test spacecraft before they are sent into space, was exactly what was needed to spin up some unique and original vehicle testing. Vehicles were positioned on the High Capacity Centrifuge's test platform, and spun until iner- tia and centrifugal force caused them to tip. A crash-test dummy was along for the ride in each vehicle to increase the realism and accuracy of the test results. The High Capacity Centrifuge is a big machine, more than 150 feet in diameter, filling an entire circular building. With two powerful motors running at full tilt, the outer edge of the test arm can reach speeds of more than 200 miles per hour, producing a force 30 times Earth's gravity. At rest, the giant multi-ton arm sits on bearings so smooth just two or three people can push it around the room. NASA and the NHTSA expect this first-of-its-kind test will", "gold_evidence_draft": [{"evidence_unit_id": "real_020_batch_20_spin03:p0133:e003", "document_id": "real_020_batch_20_spin03", "page_number": 133, "element_index": 3, "element_type": "para", "bbox": [193, 488, 659, 1045], "text": "This year, NASA and the National Highway Traffic Safety Administration (NHTSA) joined forces to, literal- ly, take vehicles out for a spin. The NHTSA currently employs a consumer rating system that uses an engineer- ing formula to determine rollover resistance, but wanted to research new methods through NASA. Goddard Space Flight Center's High Capacity Centrifuge, used to test spacecraft before they are sent into space, was exactly what was needed to spin up some unique and original vehicle testing. Vehicles were positioned on the High Capacity Centrifuge's test platform, and spun until iner- tia and centrifugal force caused them to tip. A crash-test dummy was along for the ride in each vehicle to increase the realism and accuracy of the test results. The High Capacity Centrifuge is a big machine, more than 150 feet in diameter, filling an entire circular building. With two powerful motors running at full tilt, the outer edge of the test arm can reach speeds of more than 200 miles per hour, producing a force 30 times Earth's gravity. At rest, the giant multi-ton arm sits on bearings so smooth just two or three people can push it around the room. NASA and the NHTSA expect this first-of-its-kind test will", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0133/output_json/page_0133.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "review_candidate", "question_design": "auto_source_bound_expansion", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null}, {"draft_id": "auto_legacy_expansion::CERNCourier2022NovDec-
