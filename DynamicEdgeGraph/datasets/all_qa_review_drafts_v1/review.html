/real_005_batch_05_Spinoff2019/pages/page_0152/output_json/page_0152.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::037", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_006_batch_06_Spinoff2018", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_06_Spinoff2018.pdf", "question": "Which two forms of communication uncertainty must be controlled before avionics can share a common network?", "gold_answer_draft": "It had to make message timing and delivery deterministic, eliminating the possibility that messages would interrupt one another, be lost, or be damaged; this enabled a single network for critical Orion systems.", "gold_evidence_draft": [{"evidence_unit_id": "real_006_batch_06_Spinoff2018:p0051:e003", "document_id": "real_006_batch_06_Spinoff2018", "page_number": 51, "element_index": 3, "element_type": "para", "bbox": [93, 353, 550, 527], "text": "Until recently, though, Ethernet could never be used for critical systems like the spacecraft avionics responsible for navigation, communication, and other essential functions, because it's imprecise. There's no guarantee how long it will take to transmit a message or even whether it will arrive at its intended destination. Messages can interrupt each other or be lost or damaged.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_006_batch_06_Spinoff2018/pages/page_0051/output_json/page_0051.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_006_batch_06_Spinoff2018:p0051:e004", "document_id": "real_006_batch_06_Spinoff2018", "page_number": 51, "element_index": 4, "element_type": "para", "bbox": [93, 527, 550, 675], "text": "But a sophisticated deterministic Ethernet system devel- oped for NASA's new Orion space capsule allows all the spacecraft's systems to communicate on a single Ethernet network—and the technology is also being applied to integrate systems for self-driving cars, industrial applications, defense programs, commercial spacecraft, and more.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_006_batch_06_Spinoff2018/pages/page_0051/output_json/page_0051.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::038", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_006_batch_06_Spinoff2018", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_06_Spinoff2018.pdf", "question": "Why do unexpected rover and lander failures make high-fidelity planetary simulants a mission-design requirement?", "gold_answer_draft": "Phoenix could not deliver sticky icy soil and Spirit became stuck in hidden soft sulfate; accurate simulants are needed because hardware sent to other worlds is only as good as the environments used to test it.", "gold_evidence_draft": [{"evidence_unit_id": "real_006_batch_06_Spinoff2018:p0083:e002", "document_id": "real_006_batch_06_Spinoff2018", "page_number": 83, "element_index": 2, "element_type": "para", "bbox": [91, 202, 551, 458], "text": "After the Phoenix lander settled into the northern polar region of Mars in 2008, its operators dis- covered that icy soil scraped from the planet's surface was too sticky to deliver from the probe's scoop to one of its instruments, forcing them to content them- selves with only analyzing dry soil. A little over a year later, near the planet's equator, the Spirit rover got stuck in a deposit of soft iron sulfate hidden under a layer of normal-looking Martian soil, putting an end to more than five years of roaming.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_006_batch_06_Spinoff2018/pages/page_0083/output_json/page_0083.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_006_batch_06_Spinoff2018:p0083:e003", "document_id": "real_006_batch_06_Spinoff2018", "page_number": 83, "element_index": 3, "element_type": "para", "bbox": [92, 458, 551, 662], "text": "These and other unexpected difficulties that have confronted rovers and landers on other worlds might be avoided in future missions if engineers building them have more accurate testing environments, including “simulants” imitating the dirt, dust, and rock of a given planet. As a 2012 paper out of NASA’s Marshall Space Flight Center notes, technology sent to other planets and moons “is only as good as the simulants used to test it.”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_006_batch_06_Spinoff2018/pages/page_0083/output_json/page_0083.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::039", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_007_batch_07_Spinoff2017", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_07_Spinoff2017.pdf", "question": "What performance tradeoff made the early silver-zinc battery technology potentially valuable despite its shorter cycle life?", "gold_answer_draft": "It managed only 400–500 shallow cycles versus 10,000 for nickel-cadmium, but could produce batteries one-third the size, saving substantial weight.", "gold_evidence_draft": [{"evidence_unit_id": "real_007_batch_07_Spinoff2017:p0098:e000", "document_id": "real_007_batch_07_Spinoff2017", "page_number": 98, "element_index": 0, "element_type": "para", "bbox": [93, 75, 550, 294], "text": "By 1972 Lewis had tested and proven silver-zinc cells based on a specific inorganic separator and a specially prepared zinc electrode, which were able to function as a rechargeable battery after heat sterilization. The cells were still only reliable up to 400 to 500 shallow discharge cycles, as opposed to the 10,000-cycle life of the nickel-cadmium batteries commonly used in space applications of the time, but they could result in batteries one-third the size of nickel- cadmium units, a substantial saving in weight.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_007_batch_07_Spinoff2017/pages/page_0098/output_json/page_0098.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::040", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_007_batch_07_Spinoff2017", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_07_Spinoff2017.pdf", "question": "Why must exploration-mission diagnostics be both rapid and compact rather than relying on terrestrial laboratory equipment?", "gold_answer_draft": "Spaceflight can suppress immunity and increase bacterial virulence, while emergency return from Mars could take months; terrestrial lab technologies are too large for exploration missions.", "gold_evidence_draft": [{"evidence_unit_id": "real_007_batch_07_Spinoff2017:p0041:e002", "document_id": "real_007_batch_07_Spinoff2017", "page_number": 41, "element_index": 2, "element_type": "para", "bbox": [93, 201, 551, 452], "text": "NASA astronauts are screened for sound health, among a slew of other requirements, but no one is invulnerable, especially in space. For reasons not fully understood, space travel appears to suppress the human immune system, while some bacteria become heartier and more virulent in microgravity. Meanwhile, aboard the International Space Station, the nearest medi- cal doctor is on the other side of atmospheric reentry. On a future mission to Mars, any emergency return would likely take months.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_007_batch_07_Spinoff2017/pages/page_0041/output_json/page_0041.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_007_batch_07_Spinoff2017:p0041:e004", "document_id": "real_007_batch_07_Spinoff2017", "page_number": 41, "element_index": 4, "element_type": "para", "bbox": [93, 602, 551, 873], "text": "“ We don't currently have lab technologies we use terrestrially that are of a size that would be acceptable for use in space, at least not on an exploration mission, ” Shaw says. Blood work, for example, normally involves a few samples being taken and sent to different locations where they're analyzed using the kind of heavy, bulky tabletop equipment that would cost a fortune to launch into space. What Shaw and her colleagues want instead would more resemble a home pregnancy test, with a single sample analyzed by one small device that produces results within minutes.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_007_batch_07_Spinoff2017/pages/page_0041/output_json/page_0041.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::041", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_008_batch_08_Spinoff2016", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_08_Spinoff2016.pdf", "question": "Why can hydrogen storage outperform batteries for remote solar-powered telecommunications sites in hot climates?", "gold_answer_draft": "Hydrogen can store excess renewable power without the idle losses of alkaline batteries and without rapid-draw heat losses, while solar-linked batteries can suffer performance problems in hot locations.", "gold_evidence_draft": [{"evidence_unit_id": "real_008_batch_08_Spinoff2016:p0126:e003", "document_id": "real_008_batch_08_Spinoff2016", "page_number": 126, "element_index": 3, "element_type": "para", "bbox": [93, 684, 550, 975], "text": "It's the first electrolyzer to be competitive with bat- teries and even provides some advantages. For example, unused alkaline batteries lose energy over time, whereas a cylinder of pressurized hydrogen gas will keep virtually indefinitely without losses. Batteries also lose energy to heat if power is drawn from them rapidly, which is not the case with hydrogen fuel cells. At telecommunication towers in remote parts of Africa or India, which are often powered by solar energy, batteries have performance issues due to the heat. “ Our panels love heat, ” Guerra says. “ The hotter the electrolyte, the more efficient they get. ”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_008_batch_08_Spinoff2016/pages/page_0126/output_json/page_0126.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::042", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_008_batch_08_Spinoff2016", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_08_Spinoff2016.pdf", "question": "Why do liquid-hydrogen launch systems require both extreme thermal control and highly sensitive leak detection?", "gold_answer_draft": "Hydrogen must stay below −423 °F to remain liquid, but its atoms escape through tiny cracks and high-pressure leaks can cause combustion because the gas is highly flammable.", "gold_evidence_draft": [{"evidence_unit_id": "real_008_batch_08_Spinoff2016:p0073:e003", "document_id": "real_008_batch_08_Spinoff2016", "page_number": 73, "element_index": 3, "element_type": "para", "bbox": [92, 353, 552, 674], "text": "But harnessing that energy requires a great deal of technological know-how on the Agency's part. For one, keeping hydrogen in its liquid state means maintaining it at a temperature below -423 °F. The element must also be insulated from external heat sources during launch, lest it begin to evaporate. Then there's the persistent threat of leakage. As the smallest and lightest of atoms, hydrogen escapes through the tiniest of cracks. That makes it a hazard, as the element is highly flammable, to the point where high-pressure joint leaks can cause combustion. As a result, detecting leaks is a top priority, but it's also a challenge, because the gas — and the flame it emits — are odorless and colorless.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_008_batch_08_Spinoff2016/pages/page_0073/output_json/page_0073.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::043", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_009_batch_09_Spinoff2015", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_09_Spinoff2015.pdf", "question": "What sequence of environmental and biological measurements converts a general atmospheric loss estimate into crop-level irrigation guidance?", "gold_answer_draft": "A crop coefficient for a crop and growth stage multiplies ETo for a field-specific estimate; Landsat and MODIS vegetation data can be used to derive those coefficients.", "gold_evidence_draft": [{"evidence_unit_id": "real_009_batch_09_Spinoff2015:p0111:e001", "document_id": "real_009_batch_09_Spinoff2015", "page_number": 111, "element_index": 1, "element_type": "para", "bbox": [93, 214, 550, 532], "text": "As helpful as ETo data is, farmers and irrigators must still perform additional calculations to convert the ETo information into a number specific to their fields and crops. For example, the utility of ETo information is increased when paired with another piece of data called the crop coefficient. Specific to the crop type and its stage of growth, the number, when multiplied by ETo, results in a more refined measurement of evapotranspiration specific to a particular crop and field. As it turns out, in recent years NASA and the US Department of Agriculture (USDA) together were discovering that Landsat and MODIS data could be used to map vegetation conditions and, from that, derive crop coefficients.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_009_batch_09_Spinoff2015/pages/page_0111/output_json/page_0111.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::044", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_009_batch_09_Spinoff2015", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_09_Spinoff2015.pdf", "question": "Why does WATEX need to combine multiple remote-sensing and geophysical inputs rather than reading groundwater directly from one image?", "gold_answer_draft": "Its processing removes surface obstacles from SAR and SIR imagery while preserving soil-wetness signals, then combines geophysical, geological, and Landsat inputs to infer groundwater.", "gold_evidence_draft": [{"evidence_unit_id": "real_009_batch_09_Spinoff2015:p0060:e004", "document_id": "real_009_batch_09_Spinoff2015", "page_number": 60, "element_index": 4, "element_type": "para", "bbox": [93, 369, 550, 563], "text": "a proprietary process Gachet developed that removes surface obstacles from NASA SAR data and SIR data without harming the soil wetness signal. In other words, the WATEX processes NASA SAR imagery so that information about groundwater can be inferred without the interference of surface features such as infrastructure, rocks, or vegetation. This process is combined with several other inputs, such as geophysical and geological data.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_009_batch_09_Spinoff2015/pages/page_0060/output_json/page_0060.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::045", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_010_batch_10_Spinoff2013", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_10_Spinoff2013.pdf", "question": "What did the private reentry-vehicle developer gain that addressed a scale-up risk absent in an earlier capsule?", "gold_answer_draft": "SpaceX could draw on 40–50 years of NASA heat-shield knowledge, while Dragon faced a scaling challenge that Stardust's much smaller sample-return capsule did not.", "gold_evidence_draft": [{"evidence_unit_id": "real_010_batch_10_Spinoff2013:p0065:e001", "document_id": "real_010_batch_10_Spinoff2013", "page_number": 65, "element_index": 1, "element_type": "para", "bbox": [93, 459, 550, 728], "text": "Having seen the Stardust capsule's successful reentry, the company was very interested in the choice of PICA as a material for their heat shield. Fortunately, under the provisions of the contract, in addition to financial funding SpaceX also had access to NASA's brain trust of engineers for technical consultation, which the firm made full use of. “The group of people we worked with had basically designed every American heat shield since the Apollo days,” says Andrew Chambers, the company's project lead in this arena. “We were able to tap 40–50 years of knowl- edge and experience, which was absolutely invaluable.”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_010_batch_10_Spinoff2013/pages/page_0065/output_json/page_0065.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_010_batch_10_Spinoff2013:p0065:e002", "document_id": "real_010_batch_10_Spinoff2013", "page_number": 65, "element_index": 2, "element_type": "para", "bbox": [93, 728, 551, 1121], "text": "Over the next few years Ames and SpaceX worked closely with one another, and throughout much of 2008 Rasky worked half-time for SpaceX through an Interagency Personnel Assignment agreement. With this particular heat shield, Dragon's designers would have to contend with a challenge that Stardust didn't pose—size. Stardust's Sample Return Capsule only required a PICA shield that was a little over 1 meter in diameter; to protect the much bulkier Dragon a 4-meter version was needed. With the 1-meter shield, Rasky and his team worked with Fiber Materials Incorporated to fabricate a single piece of PICA, but that wouldn't be possible with the larger Dragon cargo transporter. To solve that problem they devised an efficient and cost-effective method for manu- facturing smaller PICA tiles, which were then fabricated into a single heat shield.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_010_batch_10_Spinoff2013/pages/page_0065/output_json/page_0065.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::046", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_010_batch_10_Spinoff2013", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_10_Spinoff2013.pdf", "question": "Why did Robonaut need human-like dexterity instead of simply mobile-robot obstacle avoidance?", "gold_answer_draft": "It was designed to work alongside astronauts and use existing human-serviceable hardware and tools, which required hands capable of the same task-oriented manipulation as people.", "gold_evidence_draft": [{"evidence_unit_id": "real_010_batch_10_Spinoff2013:p0075:e003", "document_id": "real_010_batch_10_Spinoff2013", "page_number": 75, "element_index": 3, "element_type": "para", "bbox": [94, 378, 550, 576], "text": "In collaboration with the Defense Advanced Research Projects Agency (DARPA), Johnson aimed to build Robonaut 1—a humanoid robot complete with dexterous manipulation, or a capability to use its hands—to work alongside its human counterparts. In order to lend a help- ing hand, Robonaut needed to be able to use the same tools as astronauts to service space flight hardware, which was designed for human servicing.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_010_batch_10_Spinoff2013/pages/page_0075/output_json/page_0075.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::047", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_011_batch_11_Spinoff2012", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_11_Spinoff2012.pdf", "question": "Why is rotorcraft pressure measurement both technically harder and more expensive than conventional wind-tunnel sensing?", "gold_answer_draft": "Rotor blades flex and experience rapid pressure changes; conventional sensors sample only discrete locations and cannot work on moving rotors, while dynamic alternatives can raise costs fivefold.", "gold_evidence_draft": [{"evidence_unit_id": "real_011_batch_11_Spinoff2012:p0056:e002", "document_id": "real_011_batch_11_Spinoff2012", "page_number": 56, "element_index": 2, "element_type": "para", "bbox": [92, 202, 549, 354], "text": "The rotors of certain helicopters can spin at speeds as high as 500 revolutions per minute. As the blades slice through the air, they flex, moving into the wind and back out, experiencing pressure changes on the order of thousands of times a second and even higher.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_011_batch_11_Spinoff2012/pages/page_0056/output_json/page_0056.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_011_batch_11_Spinoff2012:p0056:e004", "document_id": "real_011_batch_11_Spinoff2012", "page_number": 56, "element_index": 4, "element_type": "para", "bbox": [93, 577, 550, 800], "text": "“Typical static pressure instrumentation can’t handle that,” explains Neal Watkins, electronics engineer in Langley Research Center’s Advanced Sensing and Optical Measurement Branch. “There are dynamic pressure taps, but your costs go up by a factor of five to ten if you use those. In addition, recovery of the pressure tap readings is accomplished through slip rings, which allow only a limited amount of sensors and can require significant maintenance throughout a typical rotor test.”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_011_batch_11_Spinoff2012/pages/page_0056/output_json/page_0056.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::048", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_011_batch_11_Spinoff2012", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_11_Spinoff2012.pdf", "question": "What technical pipeline allowed 1-megapixel Mars-rover cameras to yield 96-megapixel panoramic images later used commercially?", "gold_answer_draft": "A NASA automated tripod captured multiple smaller shots and photo-processing software stitched them into a high-resolution composite, a technology later brought to market with Carnegie Mellon.", "gold_evidence_draft": [{"evidence_unit_id": "real_011_batch_11_Spinoff2012:p0088:e003", "document_id": "real_011_batch_11_Spinoff2012", "page_number": 88, "element_index": 3, "element_type": "para", "bbox": [93, 380, 549, 528], "text": "While the rovers each took a mere 1 megapixel camera for the journey, the pictures they have become famous for measure up to 96 megapixels in size. This was made pos- sible by a NASA-built automated tripod, which with the help of photo processing software seamlessly integrates a series of smaller shots into one large image.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_011_batch_11_Spinoff2012/pages/page_0088/output_json/page_0088.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_011_batch_11_Spinoff2012:p0088:e006", "document_id": "real_011_batch_11_Spinoff2012", "page_number": 88, "element_index": 6, "element_type": "para", "bbox": [93, 674, 550, 849], "text": "Through multiple commercial partnerships, NASA and Carnegie Mellon University first brought the supersized digital picture technology to the market as the GigaPan robotic platform ( Spinoff 2008) . Soon after it had spun off into consumer applications, the technology's potential caught the eye of Major League Baseball Advanced Media (MLBAM) LP, based in New York City.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_011_batch_11_Spinoff2012/pages/page_0088/output_json/page_0088.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::049", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_012_batch_12_Spinoff2011", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_12_Spinoff2011.pdf", "question": "How did digital fly-by-wire progress from NASA test flights to commercial-aircraft benefits?", "gold_answer_draft": "After more than 200 DFBW flights, Airbus 320 adopted it in 1987 and Boeing 777 in 1994; replacing heavy mechanical systems improved fuel efficiency or cargo capacity and made flights smoother.", "gold_evidence_draft": [{"evidence_unit_id": "real_012_batch_12_Spinoff2011:p0079:e000", "document_id": "real_012_batch_12_Spinoff2011", "page_number": 79, "element_index": 0, "element_type": "para", "bbox": [93, 164, 550, 265], "text": "The DFBW program's final flight occurred on April 2, 1985—the last of more than 200 successful flights that collectively provided the impetus for changing the way aircraft are designed and flown around the world.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_012_batch_12_Spinoff2011/pages/page_0079/output_json/page_0079.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_012_batch_12_Spinoff2011:p0079:e003", "document_id": "real_012_batch_12_Spinoff2011", "page_number": 79, "element_index": 3, "element_type": "para", "bbox": [93, 461, 550, 779], "text": "The first commercial airliner to fly with DFBW was the Airbus 320 in 1987, followed by Boeing's 777 in 1994. Today, the technology features in a number of aircraft from both manufacturers. For commercial air- craft, the technology replaces heavy mechanical systems, allowing airlines to benefit from greater fuel efficiency or carry more passengers and cargo. The heightened responsiveness of DFBW-enabled aircraft allows pilots to provide a smoother flight, and the system's redundan- cies help ensure safe operation of the vehicle. Mechanical maintenance needs are also reduced, saving costs and time spent on upkeep and repairs of the mechanical systems and reducing the chance of failures.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_012_batch_12_Spinoff2011/pages/page_0079/output_json/page_0079.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::050", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_012_batch_12_Spinoff2011", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_12_Spinoff2011.pdf", "question": "What material class offers a solar-device designer simultaneous gains in conductivity, heat transport, and strength at microscopic dimensions?", "gold_answer_draft": "They are about 50,000 times finer than a human hair while combining high electrical and thermal conductivity with exceptional mechanical strength.", "gold_evidence_draft": [{"evidence_unit_id": "real_012_batch_12_Spinoff2011:p0150:e003", "document_id": "real_012_batch_12_Spinoff2011", "page_number": 150, "element_index": 3, "element_type": "para", "bbox": [93, 474, 550, 646], "text": "To build upon existing photovoltaic technology, NASA's Glenn Research Center has worked on a variety of innovative designs and materials to incorporate into photovoltaic cells, the building blocks of solar power sys- tems. One of these materials is the carbon nanotube—a tiny structure about 50,000 times finer than the average human hair, with notably high electrical and thermal con-", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_012_batch_12_Spinoff2011/pages/page_0150/output_json/page_0150.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::051", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_013_batch_13_Spinoff2010", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_13_Spinoff2010.pdf", "question": "How can a physical scale model yield transferable flight-control results rather than merely imitate flight virtually?", "gold_answer_draft": "Its structural scaling matches mass distribution and density as well as geometry, yielding faster but otherwise identical flight-dynamic and aerodynamic responses, while telemetry links it to control computers.", "gold_evidence_draft": [{"evidence_unit_id": "real_013_batch_13_Spinoff2010:p0162:e002", "document_id": "real_013_batch_13_Spinoff2010", "page_number": 162, "element_index": 2, "element_type": "para", "bbox": [101, 259, 273, 564], "text": "The unmanned vehicles in the AirSTAR facility are only about 1/20th the size of the transport aircraft they are built to represent.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_013_batch_13_Spinoff2010/pages/page_0162/output_json/page_0162.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_013_batch_13_Spinoff2010:p0162:e004", "document_id": "real_013_batch_13_Spinoff2010", "page_number": 162, "element_index": 4, "element_type": "para", "bbox": [93, 583, 549, 778], "text": "a careful structural design that scales the mass distribu- tion and density along with the geometry, these sub-scale flight vehicles provide flight-dynamic and aerodynamic responses that are faster, but otherwise identical, to their full-scale counterparts. This retains relevance to the target application, and allows experiments to be conducted that have more risk and incur larger structural loads than would be feasible on a full-scale transport.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_013_batch_13_Spinoff2010/pages/page_0162/output_json/page_0162.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::052", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_013_batch_13_Spinoff2010", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_13_Spinoff2010.pdf", "question": "How did HoneyBeeNet data become evidence for a climate-related shift rather than just an isolated local observation?", "gold_answer_draft": "Its long-term records showed nectar flow arriving about a half-day earlier yearly and about a month earlier since the 1970s, and the timing nearly perfectly matched satellite vegetation green-up data.", "gold_evidence_draft": [{"evidence_unit_id": "real_013_batch_13_Spinoff2010:p0202:e000", "document_id": "real_013_batch_13_Spinoff2010", "page_number": 202, "element_index": 0, "element_type": "para", "bbox": [93, 164, 551, 339], "text": "Data from the network, when combined with additional data that reach back to the 1920s, indicate that the timing of spring nectar flows have undergone extraordinary changes. “Each year, the nectar flow comes about a half-day earlier on average,” said Esaias. “In total, since the 1970s, it has moved forward by about month in Maryland.”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_013_batch_13_Spinoff2010/pages/page_0202/output_json/page_0202.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_013_batch_13_Spinoff2010:p0202:e001", "document_id": "real_013_batch_13_Spinoff2010", "page_number": 202, "element_index": 1, "element_type": "para", "bbox": [93, 338, 551, 485], "text": "Esaias and Goddard colleague Robert Wolfe recently compared nectar flow data from HoneyBeeNet to satellite data that measures the annual “green up” of vegetation in the spring, one of the first times that scientists have attempted such a comparison. They corresponded nearly perfectly, confirming the usefulness of the citizen-", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_013_batch_13_Spinoff2010/pages/page_0202/output_json/page_0202.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::053", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_020_batch_20_spin03", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_20_spin03.pdf", "question": "Why did the surgical tracking system need both a substantially higher sampling rate and closed-loop compensation, rather than merely following the eye with a conventional camera?", "gold_answer_draft": "Saccadic motion occurs about 100 times per second, whereas conventional video trackers sample only 60–250 times per second and can force a laser shutdown and restart; LADARTracker samples at 4,000 times per second and continuously compensates for movement in a closed loop.", "gold_evidence_draft": [{"evidence_unit_id": "real_020_batch_20_spin03:p0012:e002", "document_id": "real_020_batch_20_spin03", "page_number": 12, "element_index": 2, "element_type": "para", "bbox": [195, 510, 513, 847], "text": "During LASIK surgery, laser pulses must be accurately placed to reshape the cornea. A challenge to this procedure is the patient's con- stant eye movement. A person's eyes make small, involuntary movements known as saccadic movements about 100 times per second. Since the sac- cadic movements will not stop dur- ing LASIK surgery, most excimer laser systems use an eye tracking device that measures the movements and guides the placement of the laser beam.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0012/output_json/page_0012.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_020_batch_20_spin03:p0012:e004", "document_id": "real_020_batch_20_spin03", "page_number": 12, "element_index": 4, "element_type": "para", "bbox": [195, 994, 658, 1163], "text": "type. The most commonly used video tracking systems follow eye movements between 60 to 250 times per sec- ond, meaning that they cannot keep up with saccadic movements. Therefore, when the eye moves too far from the limits set by the eye surgeon, the surgeon must shut down the laser beam and restart the surgery once the laser is properly centered.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0012/output_json/page_0012.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_020_batch_20_spin03:p0012:e005", "document_id": "real_020_batch_20_spin03", "page_number": 12, "element_index": 5, "element_type": "para", "bbox": [195, 1164, 658, 1456], "text": "Sufficient speed is not a problem for Alcon's patent- ed LADARTracker, TM a LADAR eye tracking device that measures eye movements at a rate of 4,000 times per second, 4 times the perceived safety margin. The LADARTracker also employs a closed-loop system, which keeps the device locked on the eye at all times. Eye movement information is continuously relayed to the system, allowing the system to compensate for the movements. Video tracking systems, on the other hand, are open-loop systems that try to follow eye movements rather than compensate for them. LADARVision is cur- rently the only excimer laser device that continually", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0012/output_json/page_0012.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::054", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_020_batch_20_spin03", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_20_spin03.pdf", "question": "What evidence suggests that turning pilot-attention biofeedback into an interactive game changed adherence more than the measured clinical outcomes?", "gold_answer_draft": "After forty one-hour sessions, both the game and traditional-biofeedback groups improved on brain-wave and attention-related measures, but the game group had fewer no-shows and no drop-outs, with parents more satisfied and children appearing to enjoy it more.", "gold_evidence_draft": [{"evidence_unit_id": "real_020_batch_20_spin03:p0014:e003", "document_id": "real_020_batch_20_spin03", "page_number": 14, "element_index": 3, "element_type": "para", "bbox": [193, 632, 659, 829], "text": "One of the most progressive physiological methods to spawn from Langley biofeedback research is known as Extended Attention Span Training (EAST). As a modifi- cation of biocybernetic technology used to increase the mental engagement of pilots, EAST transcends conven- tional neurofeedback systems by taking the form of a video game that responds to brain electrical activity and joystick input.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0014/output_json/page_0014.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_020_batch_20_spin03:p0015:e004", "document_id": "real_020_batch_20_spin03", "page_number": 15, "element_index": 4, "element_type": "para", "bbox": [85, 798, 551, 1308], "text": "After forty 1-hour sessions, both groups showed signifi- cant improvements in everyday brain-wave patterns, as well as in tests measuring attention span, impulsiveness, and hyperactivity. The key difference in the outcome, however, was motivation. According to Alan Pope, Ph.D., a psychol- ogist from Langley's Crew/Vehicle Integration Branch and co-inventor of EAST, the video game group experienced fewer no-shows for testing and no drop-outs. Additionally, Pope adds that the parents were more satisfied with the results of the video game training, and the kids seemed to have more fun. He is also quick to note that violent video games are not recommended, but rather that car racing, skateboarding, and other skills-type games are best suited for the interactive technology. By adapting to today's most pop- ular video games, S.M.A.R.T. BrainGames fully preserves high-tech entertainment value, unlike previous biofeedback methods that had a propensity to be too repetitive and simplistic. These training methods typically employed “ go-no-go ” games, in which animation or computer graph- ics would move along a predetermined path, lacking inter- activity or user control over the game itself.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0015/output_json/page_0015.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::055", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_020_batch_20_spin03", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_20_spin03.pdf", "question": "How did an astronaut-monitoring research system become usable for home chronic-care patients who lacked their own computer or Internet connection?", "gold_answer_draft": "NASA-funded work produced a miniature device for real-time collection and analysis of multiple astronaut physiological signals; the commercial system adapted it to collect readings from common home instruments and securely send them over an ordinary telephone line, so patients needed neither a personal computer nor Internet access.", "gold_evidence_draft": [{"evidence_unit_id": "real_020_batch_20_spin03:p0030:e003", "document_id": "real_020_batch_20_spin03", "page_number": 30, "element_index": 3, "element_type": "para", "bbox": [194, 778, 659, 928], "text": "NASA's Johnson Space Center granted Cybernet Systems Phase I and Phase II Small Business Innovation Research (SBIR) contracts, building upon the company's previous SBIR work on multiple military and Federal Government development projects. The pur- pose of the NASA project was to enable remote physio-", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0030/output_json/page_0030.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_020_batch_20_spin03:p0031:e000", "document_id": "real_020_batch_20_spin03", "page_number": 31, "element_index": 0, "element_type": "para", "bbox": [85, 193, 550, 539], "text": "The battery-powered and portable MedStar interface device collects physiological data from off-the-shelf instruments regularly used at home by chronic-disease patients with high blood pressure, diabetes, congestive heart failure, or respiratory conditions. These devices include weight scales, blood pressure cuffs, and glucose monitors. The MedStar device then securely transmits the data over a standard telephone line to the Cybernet Medical collection server, located at a hospital or a dis- ease management company's facility, for retrieval and analysis. The process enables a health care team to imme- diately note changes in a patient's condition and make appropriate action recommendations — resulting in fewer patient interventions and emergency hospitalizations.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0031/output_json/page_0031.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_020_batch_20_spin03:p0031:e001", "document_id": "real_020_batch_20_spin03", "page_number": 31, "element_index": 1, "element_type": "para", "bbox": [85, 539, 550, 713], "text": "Measuring 10 square inches and weighing less than a pound, the patient-friendly MedStar device is small and light and operates on standard AA batteries. Since a patient does not need a personal computer or Internet access to transmit MedStar's collected data, the device can be immediately deployed by disease management organizations regardless of patient demographics.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0031/output_json/page_0031.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::056", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_020_batch_20_spin03", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_20_spin03.pdf", "question": "Which two changes allowed a tool designed for prolonged space operations to become a scalable commercial network-operations platform?", "gold_answer_draft": "NASA moved from paper procedures toward electronic management for longer missions and used Timeliner for autonomous ISS functions; its commercial successor retained an English-like, reliable runtime but added interfaces to networked devices, servers, databases, and applications plus distributed execution capable of millions of simultaneous events.", "gold_evidence_draft": [{"evidence_unit_id": "real_020_batch_20_spin03:p0076:e003", "document_id": "real_020_batch_20_spin03", "page_number": 76, "element_index": 3, "element_type": "para", "bbox": [194, 568, 659, 966], "text": "The concept behind the Auspice software spawned from a computer program originally developed in 1981 by Cambridge, Massachusetts-based Draper Laboratory for simulating tasks performed by astronauts aboard the Space Shuttle. At the time, the Space Shuttle Program was dependent upon paper-based procedures for its manned space missions, which typically averaged 2 weeks in duration. As the Shuttle Program progressed, NASA began increasing the length of manned missions in preparation for a more permanent space habitat. Acknowledging the need to relinquish paper-based pro- cedures in favor of an electronic processing format to properly monitor and manage the complexities of these longer missions, NASA realized that Draper's task- simulation software could be applied to its vision of year-round space occupancy.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0076/output_json/page_0076.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_020_batch_20_spin03:p0076:e006", "document_id": "real_020_batch_20_spin03", "page_number": 76, "element_index": 6, "element_type": "para", "bbox": [687, 314, 1153, 676], "text": "Known as Timeliner, the software was used for the first time aboard the ISS in June 2003 to autonomously activate and control experiment payloads in the Microgravity Science Glovebox, a sealed container with built-in gloves that provides a safe, enclosed workspace for investigations conducted in the low- gravity environment. It is further anticipated to auto- mate other ISS procedural tasks typically performed by human operators—or those that execute a control process—including vehicle control, performance of preflight and postflight subsystem checkout, and han- dling of failure detection and recovery. While Draper Laboratory additionally received a patent on Timeliner in 1998, the software was licensed to Auspice in 1997, for exclusive use in commercial markets.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0076/output_json/page_0076.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_020_batch_20_spin03:p0076:e007", "document_id": "real_020_batch_20_spin03", "page_number": 76, "element_index": 7, "element_type": "para", "bbox": [687, 677, 1153, 943], "text": "“ We took the baseline version Timeliner and com- mercialized it as TLX, ” said Rick Berthold, Draper's for- mer ISS Timeliner lead engineer who cofounded Auspice and remains as its chief technical officer. “ The original Tineliner gave us the revolutionary English-like devel- opment language and an ultra-reliable runtime environ- ment. We greatly extended the utility of the language, added interconnectivity to networking devices, servers, databases, and application software, and built a limitless distributed execution environment that could process up to millions of simultaneous events. ”", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0076/output_json/page_0076.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::057", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_020_batch_20_spin03", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_20_spin03.pdf", "question": "What new category of optical imperfection could the wavefront-guided procedure address that earlier treatment had missed?", "gold_answer_draft": "It enabled surgeons to measure and address visual distortions that had previously gone undetected.", "gold_evidence_draft": [{"evidence_unit_id": "real_020_batch_20_spin03:p0013:e004", "document_id": "real_020_batch_20_spin03", "page_number": 13, "element_index": 4, "element_type": "para", "bbox": [577, 402, 1041, 685], "text": "Eye surgeons across the country are utilizing the LADARVision 4000 for LASIK surgery. In October 2002, Alcon's LADARVision system, consisting of the LADARVision 4000 and the LADARWave wavefront measurement device, became the first to gain FDA approval for wavefront-guided LASIK. The result- ing procedure, called CustomCornea, allows surgeons to measure and address visual distortions that previously went undetected. The precision of the tracking device and the small spot beam make the LADARVision system the premier equipment to deliver these precise treatments.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0013/output_json/page_0013.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::058", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_020_batch_20_spin03", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_20_spin03.pdf", "question": "In the interactive training feedback loop, which two mental states governed the simulated vehicle's progress and control?", "gold_answer_draft": "Focus acted as the accelerator and calmness as the steering; wandering focus caused the vehicle to lose ground and fail to qualify.", "gold_evidence_draft": [{"evidence_unit_id": "real_020_batch_20_spin03:p0015:e000", "document_id": "real_020_batch_20_spin03", "page_number": 15, "element_index": 0, "element_type": "para", "bbox": [84, 192, 463, 605], "text": "For example, if an individual is engaging in a race car game in which the goal is to post a fast time to qualify for the next race, it is important for him or her to maintain both speed and control. As the user improves focus, the S.M.A.R.T. BrainGames system will allow for faster speed and easier steering; if the user's focus wanders, the race car will lose ground and not qualify. In essence, the brain acts as the “ accelerator, ” and the calmness acts as the “ steering, ” notes CyberLearning Technology. In the case of ADHD, where relentless distractions and/or impulsive behav- ior take over, the biofeedback technology behind S.M.A.R.T. BrainGames has displayed great results in helping those with the disorder to concentrate and self-regulate.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_020_batch_20_spin03/pages/page_0015/output_json/page_0015.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::059", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "How did the outreach partnership turn a technically feasible acne-heating prototype into a commercially viable product?", "gold_answer_draft": "SATOP matched the company with an engineer who redesigned the constrained heating element; the advice reduced its cost from about $80 each to 10 cents, enabling commercialization.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0036:e007", "document_id": "real_016_batch_16_basic_version_07", "page_number": 36, "element_index": 7, "element_type": "para", "bbox": [572, 629, 1029, 751], "text": "Any type of small business is encouraged to submit a technical challenge to SATOP. If SATOP is able to assist, the small business is provided with up to 40 hours of free technical assistance from a scientist or engineer in the Space Program.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0036/output_json/page_0036.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_016_batch_16_basic_version_07:p0036:e014", "document_id": "real_016_batch_16_basic_version_07", "page_number": 36, "element_index": 14, "element_type": "para", "bbox": [1050, 948, 1508, 1121], "text": "SATOP directed Conrad to Allen J. Saad, of The Boeing Company, a principal design engineer at Kennedy Space Center. Saad assessed the design and made several major contributions. He was able to give the company engineering advice toward designing a new element that reduced the cost of the heating element from about $80 each to just 10 cents, making the product more", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0036/output_json/page_0036.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::060", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "What control strategy lets the acne-treatment device destroy the target bacteria without harming healthy skin?", "gold_answer_draft": "It applies an exact low-level heat dose below the skin-damage threshold, while an internal microprocessor continuously adjusts temperature to the user's heat absorption.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0037:e006", "document_id": "real_016_batch_16_basic_version_07", "page_number": 37, "element_index": 6, "element_type": "para", "bbox": [94, 848, 551, 1121], "text": "Zeno employs proprietary ClearPoint technology to provide relief of mild to moderate inflammatory acne. It delivers a precisely controlled low-level dosage of heat to the blemish, causing the bacteria at the root of more than 90 percent of acne to self-destruct. The heat is the exact temperature needed to kill the bacteria while still being below the point at which healthy skin would be damaged, and an internal microprocessor continually modulates the temperature to match the heat absorption of the individual user. Replaceable treatment tips ensure thermal efficiency over the life of the product.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0037/output_json/page_0037.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::061", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "Why did transporting a shuttle-bearing launch platform require a lubricant optimized for more than ordinary friction reduction?", "gold_answer_draft": "The lubricant had to be biodegradable because Kennedy is a wildlife refuge, while also lasting under the enormous, slow-moving load and protecting against corrosive sand and heat.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0076:e004", "document_id": "real_016_batch_16_basic_version_07", "page_number": 76, "element_index": 4, "element_type": "para", "bbox": [93, 601, 550, 946], "text": "Back in 1994, NASA sought a new type of lubricant that would be safe for the environment and would help “grease the wheels” by making the meticulous 1 mile per hour, 3-mile trek of the shuttle-bearing launcher plat- form to the launch pad an easier process. To satisfy the environmental requirement, the lubricant had to be bio- degradable. This was especially important, since Kennedy is a wildlife refuge. To account for the size and the weight of the space shuttle/platform combination, as well as the tortoise-like pace and the distance being traveled, the lubricant had to sustain a long operating life while in use. In addition, it had to provide complete protection from the corrosive sand and the heat that are a part of everyday life at Kennedy.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0076/output_json/page_0076.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "single_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::062", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "How did a manufacturing limitation in composite fan blades create the need for a custom geometry-conversion program?", "gold_answer_draft": "The blades were assembled from 50 to 250 flat composite plies, but commercial software could not accurately flatten the blade's complex double-curved internal 3-D surfaces into the required 2-D patterns.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0096:e006", "document_id": "real_016_batch_16_basic_version_07", "page_number": 96, "element_index": 6, "element_type": "para", "bbox": [571, 164, 1029, 321], "text": "into a 2-D surface. Flattening software of this nature is required, because the fan blade was being made from 50 to 250 separate 2-D carbon graphite composite sheets, or plies, that were cut and stacked in a mold where heat and pressure was applied to create a solid carbon graphite blade.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0096/output_json/page_0096.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_016_batch_16_basic_version_07:p0096:e005", "document_id": "real_016_batch_16_basic_version_07", "page_number": 96, "element_index": 5, "element_type": "para", "bbox": [92, 1022, 550, 1121], "text": "The technical shortcomings experienced in this joint project were traced to three-dimensional (3-D)-to-two- dimensional (2-D) commercial flattening software, which was not able to accurately flatten a 3-D surface", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0096/output_json/page_0096.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::063", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "What combination of thermal and structural constraints made leading-edge materials for the hypersonic test vehicle unusually demanding?", "gold_answer_draft": "At increasing speed the leading edges approached 4,000 °F, yet their protective coating also had to remain lightweight and thin because the aircraft had tightly constrained dimensions and mass.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0117:e003", "document_id": "real_016_batch_16_basic_version_07", "page_number": 117, "element_index": 3, "element_type": "para", "bbox": [93, 966, 550, 1122], "text": "MER created all of the leading edges for the X-43A test vehicles at Dryden. Considered the most critical parts of this experimental craft, the leading edges had several specific requirements. As the vehicle's speed increased, so did heat and thermal load, approaching 4,000 °F, well above the temperatures the shuttle is exposed to during", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0117/output_json/page_0117.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_016_batch_16_basic_version_07:p0117:e004", "document_id": "real_016_batch_16_basic_version_07", "page_number": 117, "element_index": 4, "element_type": "para", "bbox": [571, 888, 1028, 991], "text": "reentry. In addition to being very heat resistant, the coat- ing had to be very lightweight and thin, as the aircraft was designed to very precise specifications and could not afford to have a bulky coating.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0117/output_json/page_0117.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "manual_qa_review_v1::064", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "real_016_batch_16_basic_version_07", "source_pdf": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pdfs/nasa/batch_16_basic_version_07.pdf", "question": "Why was laser altimetry more useful than ordinary aerial or satellite imagery for narrowing a wildlife habitat search?", "gold_answer_draft": "By timing laser returns from leaves, branches, and ground, LVIS measures vertical vegetation structure; that third dimension distinguishes canopy and ground characteristics that 2-D imagery cannot reveal.", "gold_evidence_draft": [{"evidence_unit_id": "real_016_batch_16_basic_version_07:p0156:e006", "document_id": "real_016_batch_16_basic_version_07", "page_number": 156, "element_index": 6, "element_type": "para", "bbox": [572, 164, 1029, 337], "text": "(LVIS) onboard the aircraft. The instrument uses lasers that send pulses of energy to the Earth's surface. Photons of light from the lasers bounce off leaves, branches, and the ground and reflect back to the instrument. By analyzing these returned signals, scientists receive a direct measurement of the height of the forest's leaf-covered tree tops, the ground level below, and everything in between.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0156/output_json/page_0156.json", "future_node_mapping": "pending_evidence_node_assembly"}, {"evidence_unit_id": "real_016_batch_16_basic_version_07:p0156:e007", "document_id": "real_016_batch_16_basic_version_07", "page_number": 156, "element_index": 7, "element_type": "para", "bbox": [572, 338, 1029, 557], "text": "“LVIS is aiding this search effort far beyond what air- craft photos or satellite images can provide in the way of just a two-dimensional rendering of what's below,” said Woody Turner, program scientist at NASA Headquarters. “The laser technology gives us the third dimension, enabling us to better assess the complex vegetation struc- ture the plane flies over.” The flights are the latest step in an effort spanning over 2 years to find absolute evidence that a bird once thought extinct continues to survive.", "source_json": "/hfs2/data/project/hk-project-p0025545/ka_dv3352/Project/DynamicEdgeGraph/datasets/real_documents_v1_20261113/pipeline_to_nodes_v1_20261114/work/real_016_batch_16_basic_version_07/pages/page_0156/output_json/page_0156.json", "future_node_mapping": "pending_evidence_node_assembly"}], "difficulty": "hard_reasoning", "question_design": "semantic_rephrase_with_grounded_constraints", "question_type_actual": "multi_evidence", "uses_gold_annotations": false, "node_mapping_status": "PENDING_EVIDENCE_NODE_ASSEMBLY", "reviewer_decision": null, "reviewer_notes": null, "corpus": "real_documents_v1_20261113", "answer_status": "candidate_gold_requires_human_approval"}, {"draft_id": "legacy_qa_review_v1::001", "review_status": "NEEDS_HUMAN_REVIEW", "document_id": "CERNCourier2022NovDec-digitaledition", "document_title": "CERNCourier2022NovDec-digitaledition", "question": "What substantive claim, mechanism, or result does the selected passage establish about CERNCourier2022NovDec-digitaledition? Include any condition that limits the claim.", "gold_answer_draft": "AGNs are galaxies in which the super- massive black hole at their centre is accre- ting matter, thereby producing violent jets responsible for the observed emissions. While our galaxy has a supermassive black hole at its centre, it is currently not accreting matter and therefore the nucleus of the Milky Way is not active. Strong films of past activity were, however, discovered using the Fermi –LAT satellite in 2019. In particular, the data showed two giant masses, the merger and the starburst (shown as the Fermi galaxies - extending from the galactic centre and covering almost-half of the sky (see Image). The exact origin of the giant plasma lobes remains to be understood. However, their position and bipolar nature point towards an origin in the Milky Way's centre several million years ago, likely during a period of high activity in the galactic nucleus.", "gold_evidence_draft": [{"evidence_unit_id": "CERNCourier2022NovDec-digitaledition_page_0006_HY_021", "document_id": "CERNCourier2022NovDec-digitaledition", "page_id": "page_0006", "element_type": "TEXT", "bbox": [[851.0, 287.0, 1044.0, 572.0]], "text": "AGNs are galaxies in which the super- massive black hole at their centre is accre- ting matter, thereby producing violent jets responsible for the observed emissions. While our galaxy has a supermassive black hole at its centre, it is currently not accreting matter and therefore the nucleus of the Milky Way is not active. Strong fi
